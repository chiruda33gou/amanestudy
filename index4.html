<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南西諸島 学び直しクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#123a4a;
    --ocean:#1d5b70;
    --lagoon:#3f9c9c;
    --sand:#f4ecd8;
    --sand-card:#fffdf7;
    --coral:#c1502e;
    --leaf:#3f7a5c;
    --ink:#1c2b2e;
    --line:#dcd0ae;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
    background:var(--sand);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .wave-header{
    width:100%;
    background:linear-gradient(160deg, var(--ocean-deep), var(--ocean) 65%, var(--lagoon));
    color:#fdf9ee;
    padding:34px 20px 46px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .wave-header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:34px;
    background:
      radial-gradient(circle at 10px -6px, transparent 12px, var(--sand) 13px) 0 0/40px 40px repeat-x;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.14em;
    color:#bfe3e0;
    margin:0 0 10px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:clamp(24px, 5vw, 34px);
    margin:0 0 8px;
    letter-spacing:.02em;
  }
  .sub{
    margin:0;
    font-size:14px;
    color:#dcefe9;
  }
  .stage{
    width:100%;
    max-width:640px;
    padding:0 18px 60px;
    margin-top:-26px;
    z-index:2;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 4px 16px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:#e4d9b8;
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--lagoon);
    border-radius:99px;
    transition:width .35s ease;
  }
  .progress-label{
    font-size:13px;
    color:var(--ocean-deep);
    font-weight:500;
    white-space:nowrap;
  }
  .home-btn{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ocean-deep);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .home-btn:hover{ border-color:var(--lagoon); background:#f2faf8; }
  .home-btn:active{ transform:scale(.95); }
  .card{
    background:var(--sand-card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 18px 34px -22px rgba(18,58,74,.45);
    padding:26px 24px 28px;
  }
  .section-tag{
    display:inline-block;
    font-size:12px;
    font-weight:500;
    color:var(--ocean);
    background:#e3f0ea;
    border:1px solid #cfe4d8;
    padding:4px 12px;
    border-radius:99px;
    margin-bottom:14px;
  }
  .q-image{
    display:block;
    width:100%;
    border-radius:10px;
    border:1px solid var(--line);
    margin-bottom:18px;
  }
  .q-text{
    font-size:18px;
    line-height:1.65;
    font-weight:500;
    margin:0 0 20px;
    color:var(--ink);
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    width:100%;
    padding:13px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .choice:hover:not(:disabled){
    border-color:var(--lagoon);
    background:#f2faf8;
  }
  .choice:active:not(:disabled){ transform:scale(.99); }
  .choice .tag{
    flex:none;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--sand);
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
    color:var(--ocean-deep);
  }
  .choice:disabled{ cursor:default; }
  .choice.correct{
    border-color:var(--leaf);
    background:#eaf5ee;
  }
  .choice.correct .tag{ background:var(--leaf); color:#fff; border-color:var(--leaf); }
  .choice.wrong{
    border-color:var(--coral);
    background:#fbeee8;
  }
  .choice.wrong .tag{ background:var(--coral); color:#fff; border-color:var(--coral); }
  .choice.dim{ opacity:.55; }

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:12px;
    font-size:14.5px;
    line-height:1.6;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.good{ background:#eaf5ee; color:#2b5a41; border:1px solid #cfe4d8; }
  .feedback.bad{ background:#fbeee8; color:#8a3820; border:1px solid #eccabd; }
  .feedback strong{ display:block; margin-bottom:4px; font-size:15px; }

  .next-btn{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--ocean-deep);
    color:#fdf9ee;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{ display:block; }
  .next-btn:hover{ background:var(--ocean); }

  .result-card{
    text-align:center;
  }
  .result-score{
    font-family:'Shippori Mincho', serif;
    font-size:56px;
    font-weight:700;
    color:var(--ocean-deep);
    margin:6px 0 0;
  }
  .result-score span{ font-size:24px; color:var(--ocean); }
  .result-caption{
    font-size:14px;
    color:#5b6a63;
    margin:6px 0 22px;
  }
  .result-breakdown{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:22px;
    max-height:260px;
    overflow-y:auto;
    padding-right:4px;
  }
  .bd-item{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
    line-height:1.5;
    padding:8px 10px;
    border-radius:8px;
    background:#f7f2e2;
  }
  .bd-item .mark{
    flex:none;
    width:20px; height:20px;
    border-radius:50%;
    font-size:12px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    margin-top:1px;
  }
  .bd-item.ok .mark{ background:var(--leaf); }
  .bd-item.no .mark{ background:var(--coral); }
  .retry-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--lagoon);
    color:#08343a;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
  }
  .retry-btn:hover{ filter:brightness(1.06); }

  .start-card{ text-align:center; }
  .start-card p{ font-size:14.5px; line-height:1.7; color:#4a5a54; margin:0 0 24px; }
  .start-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--coral);
    color:#fff8f2;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .start-btn:hover{ filter:brightness(1.05); }
  .part-pick{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .part-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .part-btn:hover{ border-color:var(--lagoon); background:#f2faf8; }
  .part-btn:active{ transform:scale(.99); }
  .part-btn:first-child{
    background:var(--ocean-deep);
    border-color:var(--ocean-deep);
  }
  .part-btn:first-child .part-title,
  .part-btn:first-child .part-count{ color:#fdf9ee; }
  .part-title{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
    color:var(--ocean-deep);
  }
  .part-count{
    font-size:13px;
    color:#5b6a63;
  }
  .topic-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:26px;
  }
  .topic-pill{
    font-size:12.5px;
    padding:6px 12px;
    border-radius:99px;
    background:#f0e8d0;
    color:var(--ocean-deep);
    border:1px solid var(--line);
  }
  footer{
    color:#8a8264;
    font-size:12px;
    margin:26px 0 10px;
    text-align:center;
  }
</style>
</head>
<body>

<div class="wave-header">
  <p class="eyebrow">社会・地理 学び直し</p>
  <h1>南西諸島 学び直しクイズ</h1>
  <p class="sub">あたたかく雨の多い南西諸島 ― 位置・気候・くらし・産業</p>
</div>

<div class="stage">
  <div id="app"></div>
  <footer>全問終えたら「もう一度挑戦する」で何度でも復習できます。</footer>
</div>

<script>const QUESTIONS = [{"part": "①", "section": "南西諸島の位置", "image": null, "q": "南西諸島は、種子島から与那国島までおよそ何kmにわたって連なる島々か。", "choices": ["500km", "1000km", "2000km", "3000km"], "a": 1, "exp": "南西諸島は、種子島から与那国島までおよそ1000kmにわたって連なっています。"}, {"part": "①", "section": "南西諸島の位置", "image": null, "q": "種子島や屋久島は、どの都道府県にふくまれるか。", "choices": ["沖縄県", "鹿児島県", "宮崎県", "熊本県"], "a": 1, "exp": "種子島・屋久島は鹿児島県にふくまれます。"}, {"part": "①", "section": "南西諸島の位置", "image": null, "q": "沖縄県にふくまれるのは、県庁所在地の何市がある沖縄島からか。", "choices": ["名護市", "浦添市", "那覇市", "宜野湾市"], "a": 2, "exp": "沖縄県の県庁所在地は那覇市です。"}, {"part": "①", "section": "南西諸島の位置", "image": null, "q": "沖縄県にふくまれるのは、日本のもっとも西にある何という島までか。", "choices": ["西表島", "宮古島", "久米島", "与那国島"], "a": 3, "exp": "日本のもっとも西にあるのは与那国島です。"}, {"part": "①", "section": "南西諸島の気候", "image": null, "q": "南西諸島の気温が日本の中でとくに高いのは、方位でいうとどこに位置しているからか。", "choices": ["北", "東", "西", "南"], "a": 3, "exp": "南西諸島は日本の中でもっとも南に位置しているため、気温が高くなります。"}, {"part": "①", "section": "南西諸島の気候", "image": null, "q": "5月・6月に本州よりも少し早くやってきて、南西諸島の降水量を増やすものは何か。", "choices": ["台風", "梅雨", "からっ風", "木枯らし"], "a": 1, "exp": "本州よりも少し早くやってくる梅雨のえいきょうで、5月・6月の降水量が多くなります。"}, {"part": "①", "section": "南西諸島の気候", "image": null, "q": "8月・9月に南西諸島の降水量を増やす大きなえいきょうを与えるものは何か。", "choices": ["梅雨", "寒波", "台風", "移動性高気圧"], "a": 2, "exp": "8月・9月は台風のえいきょうを受けやすい時期です。"}, {"part": "①", "section": "南西諸島の気候", "image": null, "q": "熱帯ににている、南西諸島のような気候は何と呼ばれるか。", "choices": ["温暖湿潤気候", "冷帯気候", "亜熱帯気候", "地中海性気候"], "a": 2, "exp": "南西諸島の気候は亜熱帯気候とよばれます。"}, {"part": "①", "section": "南西諸島のくらし", "image": "house_photo", "q": "沖縄の伝統的な家は、家のまわりを何や木々でかこまれているか。", "choices": ["コンクリート塀", "石垣", "竹垣のみ", "土塀"], "a": 1, "exp": "家のまわりを石垣や木々でかこみ、台風から家を守っています。"}, {"part": "①", "section": "南西諸島のくらし", "image": "house_photo", "q": "沖縄の伝統的な家の屋根のかわらは、何で固められているか。", "choices": ["セメント", "しっくい", "漆", "粘土のみ"], "a": 1, "exp": "屋根のかわらはしっくいで固められています。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "石垣やしっくいの工夫は、沖縄に多く接近する何から家を守るためのものか。", "choices": ["地震", "台風", "洪水", "積雪"], "a": 1, "exp": "沖縄に多く接近する台風から家を守るための工夫です。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "沖縄の近年の家に設置されていることがある、水不足に備えるための設備は何か。", "choices": ["浄水器", "井戸", "貯水タンク", "雨どいの拡張"], "a": 2, "exp": "水不足に備えて、貯水タンクが設置されていることがあります。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "沖縄島は南北に細長く山がちであるため、大きな何がないか。", "choices": ["平野", "湖", "川", "盆地"], "a": 2, "exp": "大きな川がないため、雨が降ってもすぐ海へ流れてしまいます。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "沖縄の農業で、あたたかい気候をいかして昔からさかんな、砂糖の原料となる作物は何か。", "choices": ["てんさい", "とうもろこし", "さとうきび", "大豆"], "a": 2, "exp": "さとうきびは砂糖の原料となる作物です。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "近年栽培がさかんで、パイナップルよりも生産額が多くなっているくだものは何か。", "choices": ["りんご", "みかん", "ぶどう", "マンゴー"], "a": 3, "exp": "マンゴーの栽培がさかんで、パイナップルより生産額が多くなっています。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "日本の他の地域では冬につくることがむずかしい、沖縄でさかんな花は何か。", "choices": ["バラ", "菊", "ひまわり", "チューリップ"], "a": 1, "exp": "あたたかい気候をいかし、冬でも菊の栽培がさかんです。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "あたたかくてきれいな海でしか見られない、南西諸島の自然は何か。", "choices": ["サンゴ礁", "流氷", "干潟", "深海魚"], "a": 0, "exp": "あたたかくきれいな海でしか見られないサンゴ礁が広がっています。"}, {"part": "①", "section": "南西諸島のくらし", "image": null, "q": "国内外から多くの観光客が訪れ、南西諸島でさかんになっている業種は何か。", "choices": ["漁業", "観光業", "製造業", "林業"], "a": 1, "exp": "きれいな海などを求めて多くの観光客が訪れ、観光業がさかんです。"}, {"part": "①", "section": "地図で確認", "image": "map_blank", "q": "地図中の1の県はどこか。", "choices": ["沖縄県", "鹿児島県", "宮崎県", "熊本県"], "a": 1, "exp": "1は種子島・屋久島・奄美群島をふくむ鹿児島県です。"}, {"part": "①", "section": "地図で確認", "image": "map_blank", "q": "地図中の2の県はどこか。", "choices": ["鹿児島県", "宮崎県", "沖縄県", "熊本県"], "a": 2, "exp": "2は沖縄島や与那国島などをふくむ沖縄県です。"}, {"part": "①", "section": "地図で確認", "image": "map_blank", "q": "地図中の3の島はどれか。", "choices": ["種子島", "屋久島", "奄美大島", "沖縄島"], "a": 1, "exp": "3は大隅半島の近くにあり、ほぼ円形の屋久島です。"}, {"part": "①", "section": "地図で確認", "image": "map_blank", "q": "地図中の4の島はどれか。", "choices": ["屋久島", "種子島", "奄美大島", "与那国島"], "a": 1, "exp": "4は南北に細長い形の種子島です。"}, {"part": "①", "section": "地図で確認", "image": "map_blank", "q": "地図中の5の島はどれか。", "choices": ["沖縄島", "奄美大島", "石垣島", "西表島"], "a": 1, "exp": "5は大島つむぎで知られる奄美大島です。"}, {"part": "①", "section": "地図で確認", "image": "map_blank", "q": "地図中の6の島はどれか。", "choices": ["奄美大島", "与那国島", "沖縄島", "宮古島"], "a": 2, "exp": "6は南西諸島でもっとも面積が大きい沖縄島です。"}, {"part": "①", "section": "地図で確認", "image": "map_blank", "q": "地図中の7の島はどれか。", "choices": ["石垣島", "与那国島", "西表島", "宮古島"], "a": 1, "exp": "7は日本最西端の与那国島です。"}, {"part": "③", "section": "那覇の雨温図", "image": "naha_graph2", "q": "那覇の月別平均気温が20℃を超えている月は何か月あるか。", "choices": ["6か月", "7か月", "8か月", "12か月"], "a": 2, "exp": "4月から11月までの8か月間、月別平均気温は20℃を超えています。"}, {"part": "③", "section": "那覇の雨温図", "image": "naha_graph2", "q": "那覇の月別平均気温について、もっとも高い月ともっとも低い月とで、もっとも近い気温差はどれか。", "choices": ["5℃", "10℃", "15℃", "20℃"], "a": 1, "exp": "もっとも高い7・8月ごろと、もっとも低い1・2月ごろの差はおよそ10℃です。"}, {"part": "③", "section": "那覇の雨温図", "image": "naha_graph2", "q": "那覇の雨温図を読み取った内容としてふさわしいものはどれか。", "choices": ["1か月の降水量が50mmより少ない月が2か月ある", "1か月の降水量が200mm以上の月は4か月ある", "年間の降水量は合計で1000mmほどである", "降水量がもっとも多いのは12月である"], "a": 1, "exp": "5月・6月・8月・9月の4か月は、降水量が200mm以上あります。"}, {"part": "③", "section": "那覇の雨温図", "image": "naha_graph2", "q": "那覇でもっとも降水量が多い月はいつか。", "choices": ["3月", "6月", "9月", "12月"], "a": 1, "exp": "雨温図では6月の降水量がもっとも多くなっています。"}, {"part": "③", "section": "那覇の雨温図", "image": null, "q": "那覇で6月に降水量がとくに多くなる理由として、もっともふさわしいものはどれか。", "choices": ["台風がもっとも多く接近するから", "梅雨の影響を受けるから", "木枯らしが吹くから", "移動性高気圧におおわれるから"], "a": 1, "exp": "沖縄には本州よりも少し早く梅雨がやってくるため、6月の降水量が多くなります。"}, {"part": "③", "section": "沖縄の人々のくらし", "image": "house_photo", "q": "沖縄に昔からある家の、台風などの強風にそなえた工夫としてふさわしくないものはどれか。", "choices": ["家のまわりを石垣や木々でかこんでいる", "屋根のかわらをしっくいでぬり固めている", "家のかべを少なくし、窓を大きくしている", "屋根がわらをしっかり固定している"], "a": 2, "exp": "かべを少なくし窓を大きくする工夫は、風通しをよくして涼しく過ごすためのもので、強風対策ではありません。"}, {"part": "③", "section": "沖縄の人々のくらし", "image": null, "q": "雨が多い地域であるのに、沖縄で近年建てられた家に貯水タンクが設置されている理由としてふさわしいものはどれか。", "choices": ["本州の大都市よりも人口密度が高いから", "冬でもあたたかく、冬の降水量が少ないから", "大きな川がなく、雨が降ってもすぐ海に流れこんでしまうから", "地下水の水質が悪いから"], "a": 2, "exp": "沖縄島には大きな川がなく、雨が降ってもすぐ海に流れこんでしまうため、水不足に備えて貯水タンクが設置されています。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "南西諸島は北東から南西にかけて、およそ何kmにわたって連なっているか。", "choices": ["500km", "1000km", "2000km", "3000km"], "a": 1, "exp": "南西諸島は北東から南西へ、およそ1000kmにわたって連なっています。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "この長さは、日本列島の連なりのおよそどのくらいにあたるか。", "choices": ["3分の1", "同じくらい", "3倍", "10分の1"], "a": 0, "exp": "南西諸島の長さは、日本列島全体のおよそ3分の1にあたります。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "地図中のAで示された、中国大陸と南西諸島の間に広がる海の名前はどれか。", "choices": ["日本海", "太平洋", "東シナ海", "オホーツク海"], "a": 2, "exp": "南西諸島の西側、中国大陸との間に広がるのは東シナ海です。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "地図中のBで示された、南西諸島の東側に広がる海の名前はどれか。", "choices": ["太平洋", "日本海", "東シナ海", "瀬戸内海"], "a": 0, "exp": "南西諸島の東側に広がるのは太平洋です。南西諸島は東シナ海と太平洋を分ける境になっています。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "「鹿児島県でもっとも面積が大きく、大島つむぎという伝統的工芸品が古くからつくられている」――この島の名前はどれか。", "choices": ["屋久島", "種子島", "奄美大島", "沖縄島"], "a": 2, "exp": "大島つむぎで有名な奄美大島は、鹿児島県でもっとも面積の大きい島です。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "「南西諸島の中でもっとも面積が大きく、県庁所在地に首里城という昔の琉球王国の城あとがある」――この島の名前はどれか。", "choices": ["奄美大島", "沖縄島", "石垣島", "宮古島"], "a": 1, "exp": "沖縄島は南西諸島の中でもっとも面積が大きく、首里城のあった島です。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "「大隅半島の南に位置しており、南北に細長い形をしている。1543年に鉄砲が伝わったことで知られている」――この島の名前はどれか。", "choices": ["種子島", "屋久島", "奄美大島", "与論島"], "a": 0, "exp": "南北に細長い種子島は、1543年に鉄砲が伝わったことで知られています。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "「大隅半島の南に位置しており、ほぼ円形をしている。屋久杉とよばれる、樹齢数千年といわれる杉があることで知られている」――この島の名前はどれか。", "choices": ["種子島", "屋久島", "奄美大島", "沖縄島"], "a": 1, "exp": "ほぼ円形の屋久島は、屋久杉で知られています。"}, {"part": "③", "section": "南西諸島の地図(演習)", "image": "map_circled", "q": "「日本でもっとも西に位置しており、晴れた日には西方およそ100km先にある台湾を見ることができる」――この島の名前はどれか。", "choices": [ <script>
(function(){
  const app = document.getElementById('app');
  let order = [];
  let current = 0;
  let answers = []; // {qIndex, chosen, correct}
  let answered = false;
  let activePart = 'all';

  const PART1 = QUESTIONS.map((q,i)=>i).filter(i=>QUESTIONS[i].part==='①');
  const PART3 = QUESTIONS.map((q,i)=>i).filter(i=>QUESTIONS[i].part==='③');

  function sectionsOf(indices){
    return [...new Set(indices.map(i=>QUESTIONS[i].section))];
  }

  function renderStart(){
    app.innerHTML = `
      <div class="card start-card">
        <span class="section-tag">全${QUESTIONS.length}問・4択・出題順</span>
        <p>教科書の図・写真・グラフをそのまま使った一問一答です。学び直し①・③どちらから始めるか選んでください。問題は資料集に出てくる順番のまま出題されます。</p>

        <div class="part-pick">
          <button class="part-btn" id="pickAll">
            <span class="part-title">通してやる（①→③）</span>
            <span class="part-count">全${QUESTIONS.length}問</span>
          </button>
          <button class="part-btn" id="pick1">
            <span class="part-title">学び直し①</span>
            <span class="part-count">南西諸島の位置・気候・くらし（${PART1.length}問）</span>
          </button>
          <button class="part-btn" id="pick3">
            <span class="part-title">学び直し③</span>
            <span class="part-count">雨温図・地図演習・産業（${PART3.length}問）</span>
          </button>
        </div>
      </div>
    `;
    document.getElementById('pickAll').onclick = () => startQuiz([...PART1, ...PART3], 'all');
    document.getElementById('pick1').onclick = () => startQuiz(PART1, '①');
    document.getElementById('pick3').onclick = () => startQuiz(PART3, '③');
  }

  function startQuiz(indices, part){
    order = indices.slice();
    activePart = part;
    current = 0;
    answers = [];
    renderQuestion();
  }

  function renderQuestion(){
    answered = false;
    const qi = order[current];
    const q = QUESTIONS[qi];
    const pct = Math.round((current / order.length) * 100);
    const letters = ['A','B','C','D'];

    app.innerHTML = `
      <div class="progress-wrap">
        <button class="home-btn" id="homeBtn" title="トップに戻る" aria-label="トップに戻る">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
        </button>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${current+1} / ${order.length}</div>
      </div>
      <div class="card">
        <span class="section-tag">学び直し${q.part} ・ ${q.section}</span>
        ${q.image ? `<img class="q-image" src="${IMAGES[q.image]}" alt="資料画像">` : ''}
        <p class="q-text">${q.q}</p>
        <div class="choices">
          ${q.choices.map((c,i)=>`
            <button class="choice" data-i="${i}">
              <span class="tag">${letters[i]}</span><span>${c}</span>
            </button>
          `).join('')}
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn">${current === order.length-1 ? '結果を見る' : '次の問題へ'}</button>
      </div>
    `;

    document.getElementById('homeBtn').onclick = () => {
      const answeredCount = answers.length;
      if(answeredCount > 0 || current > 0){
        const ok = window.confirm('トップに戻ると今の進み具合はリセットされます。よろしいですか？');
        if(!ok) return;
      }
      renderStart();
    };

    const buttons = app.querySelectorAll('.choice');
    buttons.forEach(btn=>{
      btn.onclick = () => {
        if(answered) return;
        answered = true;
        const chosen = parseInt(btn.dataset.i, 10);
        const correct = q.a;
        buttons.forEach(b=>{
          const i = parseInt(b.dataset.i, 10);
          b.disabled = true;
          if(i === correct) b.classList.add('correct');
          else if(i === chosen) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        const fb = document.getElementById('feedback');
        const isCorrect = chosen === correct;
        fb.className = 'feedback show ' + (isCorrect ? 'good' : 'bad');
        fb.innerHTML = `<strong>${isCorrect ? '正解！' : '残念、不正解'}</strong>${q.exp}`;
        document.getElementById('nextBtn').classList.add('show');
        answers.push({qIndex: qi, chosen, correct: isCorrect});
      };
    });

    document.getElementById('nextBtn').onclick = () => {
      if(current < order.length - 1){
        current++;
        renderQuestion();
      } else {
        renderResult();
      }
    };
  }

  function renderResult(){
    const score = answers.filter(a=>a.correct).length;
    const total = order.length;
    const pct = Math.round((score/total)*100);
    let caption = '';
    if(pct === 100) caption = '満点！南西諸島のことはばっちりだね。';
    else if(pct >= 80) caption = 'よくできました。もう少しで満点！';
    else if(pct >= 60) caption = 'いい調子！間違えた問題を見直そう。';
    else caption = 'もう一度、教科書と見比べながら復習しよう。';

    const partLabel = activePart === 'all' ? '学び直し①→③ 通し' : `学び直し${activePart}`;
    app.innerHTML = `
      <div class="card result-card">
        <span class="section-tag">${partLabel}の結果</span>
        <p class="result-score">${score}<span> / ${total} 問正解</span></p>
        <p class="result-caption">${caption}</p>
        <div class="result-breakdown">
          ${answers.map(a=>{
            const q = QUESTIONS[a.qIndex];
            return `<div class="bd-item ${a.correct?'ok':'no'}">
              <span class="mark">${a.correct?'○':'×'}</span>
              <span>${q.q}</span>
            </div>`;
          }).join('')}
        </div>
        <button class="retry-btn" id="retryBtn">もう一度挑戦する</button>
      </div>
    `;
    document.getElementById('retryBtn').onclick = renderStart;
  }

  renderStart();
})();
</script>
</body>
</html>
