<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>中央高地チャレンジ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column card, like a 学習ノート page; header band shows progress as a "標高" bar */
:root{
  --bg:#eef1ee; --paper:#ffffff; --ink:#1f2a26; --muted:#5f6d67; --line:#d5ddd8;
  --grape:#6b3f8f; --grape-soft:#efe6f6; --leaf:#2f7a4a; --leaf-soft:#e2f2e7;
  --miss:#b3402f; --miss-soft:#fbe7e3; --bar:#b9c7c0; --bar2:#8aa79a;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b19; --paper:#1f2623; --ink:#e7ece9; --muted:#9aa8a1; --line:#34403b;
  --grape:#c49be6; --grape-soft:#2f2538; --leaf:#6fcf92; --leaf-soft:#1d3326;
  --miss:#f08a78; --miss-soft:#3a221e; --bar:#4b5c55; --bar2:#76988a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b19; --paper:#1f2623; --ink:#e7ece9; --muted:#9aa8a1; --line:#34403b;
  --grape:#c49be6; --grape-soft:#2f2538; --leaf:#6fcf92; --leaf-soft:#1d3326;
  --miss:#f08a78; --miss-soft:#3a221e; --bar:#4b5c55; --bar2:#76988a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,36px);line-height:1.25;margin:0;text-wrap:balance}
h1 span{color:var(--grape)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--leaf);width:0;transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--grape-soft);color:var(--grape)}
.q{font-size:19px;font-weight:700;margin:10px 0 14px;text-wrap:pretty}
.chart{margin:0 0 16px;overflow-x:auto}
.chart svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.chart svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart svg .ttl{fill:var(--ink);font-weight:700;font-size:13px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:16px;text-align:left;padding:13px 16px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--grape)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted)}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.ok .k{background:var(--leaf);color:var(--paper)}
.opt.ng{border-color:var(--miss);background:var(--miss-soft)}
.opt.ng .k{background:var(--miss);color:var(--paper)}
.opt:disabled{cursor:default}
.chart.map svg{max-width:380px}
.opts.letters{grid-template-columns:repeat(5,1fr)}
.opts.letters .opt{justify-content:center;padding:12px 4px}
.opts.letters .k{width:32px;height:32px;font-size:16px}
.exp{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--bg);font-size:15px}
.exp b{display:block;margin-bottom:4px}
.exp b.ok{color:var(--leaf)} .exp b.ng{color:var(--miss)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-weight:700;font-size:15px;padding:11px 20px;border-radius:10px;border:2px solid var(--grape);background:var(--grape);color:var(--paper);cursor:pointer}
.btn.sub{background:transparent;color:var(--grape)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.mode{font:inherit;text-align:left;padding:14px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mode:hover{border-color:var(--grape)}
.mode strong{font-size:16px} .mode span{font-size:13px;color:var(--muted)}
.score{font-family:var(--display);font-size:56px;line-height:1;color:var(--grape);font-variant-numeric:tabular-nums}
.score small{font-family:var(--body);font-size:18px;color:var(--muted);font-weight:700}
.review{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding:0;list-style:none}
.review li{padding:12px 14px;border-radius:10px;background:var(--miss-soft);font-size:14px}
.review li strong{display:block}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">中部地方・中央高地の学習</div>
    <h1>中央高地<span>チャレンジ</span></h1>
  </header>
  <main id="app" class="card"></main>
  <p class="note">グラフの数値は教材ページのグラフから読み取ったおよその値です。生産量は2024年、『日本のすがた2026』による。</p>
</div>

<script>
const T={
  kofuT:[3,4.3,8,13.3,18,21.5,25,26,22,15.5,8.8,3],
  shizT:[7,7.7,10.8,15.3,19.4,22.6,26.4,27.8,25,20.5,15.8,11.4],
  kofuP:[43,42,83,76,80,110,142,124,170,148,39,24],
  shizP:[78,104,207,222,215,268,297,184,280,250,130,75]
};
const C={
 temp(){return lineChart();},
 kofuT(){return lineChart(true);},
 rain(){return barCharts();},
 grape(){return hbar('ぶどうの生産量が多い県（全国16.5万トン）',[['山梨',26],['長野',20],['岡山',9],['山形',9],['福岡',4],['その他',32]]);},
 peach(){return hbar('ももの生産量が多い県（全国11.0万トン）',[['山梨',29],['福島',27],['長野',10],['山形',9],['和歌山',5],['その他',20]]);}
};
function axisY(x0,y0,h,max,step,unit,w){let s='';for(let v=0;v<=max;v+=step){const y=y0-h*v/max;s+=`<line x1="${x0}" x2="${x0+w}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${v?'3 3':''}"/><text x="${x0-6}" y="${y+4}" text-anchor="end">${v}</text>`;}return s+`<text x="${x0-6}" y="${y0-h-10}" text-anchor="end">(${unit})</text>`;}
function months(x0,y0,w){let s='';for(let i=0;i<12;i++)s+=`<text x="${x0+w*(i+.5)/12}" y="${y0+16}" text-anchor="middle">${i+1}</text>`;return s;}
function lineChart(kofuOnly){
  const W=560,H=250,pw=210,ph=160,y0=200;
  const one=(x0,data,title)=>{let pts=data.map((v,i)=>[x0+pw*(i+.5)/12,y0-ph*v/30]);
    return `<text class="ttl" x="${x0+pw/2}" y="20" text-anchor="middle">${title}</text>${axisY(x0,y0,ph,30,5,'℃',pw)}${months(x0,y0,pw)}
    <polyline fill="none" stroke="var(--grape)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--grape)"/>`).join('')}`;};
  if(kofuOnly) return `<svg viewBox="0 0 300 ${H}">${one(50,T.kofuT,'甲府の月別平均気温')}<text x="160" y="240" text-anchor="middle">（月）</text></svg>`;
  return `<svg viewBox="0 0 ${W} ${H}">${one(40,T.kofuT,'甲府の月別平均気温')}${one(330,T.shizT,'静岡の月別平均気温')}<text x="${W/2}" y="240" text-anchor="middle">（月）</text></svg>`;
}
function barCharts(){
  const W=560,H=260,pw=210,ph=170,y0=210;
  const one=(x0,data,title)=>{let b='';data.forEach((v,i)=>{const bw=pw/12,h=ph*v/400;b+=`<rect x="${x0+bw*i+1.5}" y="${y0-h}" width="${bw-3}" height="${h}" fill="var(--bar2)"/>`;});
    return `<text class="ttl" x="${x0+pw/2}" y="20" text-anchor="middle">${title}</text>${axisY(x0,y0,ph,400,100,'mm',pw)}${b}${months(x0,y0,pw)}`;};
  return `<svg viewBox="0 0 ${W} ${H}">${one(40,T.kofuP,'甲府の月別降水量')}${one(330,T.shizP,'静岡の月別降水量')}<text x="${W/2}" y="252" text-anchor="middle">（月）</text></svg>`;
}
const PLACES={
  nagano:{n:'長野盆地',x:248,y:122,lx:16,ly:4},
  matsumoto:{n:'松本盆地',x:236,y:182,lx:16,ly:4},
  kofu:{n:'甲府盆地',x:306,y:262,lx:16,ly:4},
  shinano:{n:'信濃川',x:279,y:62,lx:16,ly:4},
  fuji:{n:'富士川',x:316,y:300,lx:16,ly:4}
};
function mapChart(assign){
  let m='';
  for(const k in PLACES){const p=PLACES[k],L=assign[k],isRiver=k==='shinano'||k==='fuji';
    m+=`${isRiver?'':`<circle cx="${p.x}" cy="${p.y}" r="6" fill="var(--ink)"/>`}<g><circle cx="${p.x+p.lx+8}" cy="${p.y+p.ly-4}" r="11" fill="var(--grape)"/><text x="${p.x+p.lx+8}" y="${p.y+p.ly+1}" text-anchor="middle" style="fill:var(--paper);font-weight:700;font-size:13px">${L}</text></g>`;}
  const alp=(x1,y1,x2,y2,n,tx,ty)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--bar)" stroke-width="11" stroke-linecap="round"/><text x="${tx}" y="${ty}" text-anchor="end">${n}</text>`;
  return `<svg viewBox="0 0 400 420" role="img" aria-label="中央高地の略地図">
  <rect x="0" y="0" width="400" height="420" fill="var(--bg)"/>
  <path d="M0 0 H272 C262 40 240 80 196 100 C170 108 140 104 118 116 C108 96 112 70 124 52 C130 40 118 22 104 26 C92 30 84 60 70 80 C50 110 20 140 0 150 Z" fill="var(--grape-soft)" stroke="var(--muted)" stroke-width="1"/>
  <path d="M40 420 C60 390 100 380 120 362 C132 378 150 396 176 392 C196 388 220 400 248 382 C276 362 300 340 320 326 C334 340 346 350 360 330 C372 312 388 300 400 296 V420 Z" fill="var(--grape-soft)" stroke="var(--muted)" stroke-width="1"/>
  <text x="60" y="40">日本海</text><text x="200" y="412">太平洋</text>
  ${alp(182,108,180,210,'飛驒山脈',170,160)}${alp(222,230,204,306,'木曽山脈',196,272)}${alp(268,246,256,326,'赤石山脈',246,340)}
  <path d="M248 122 C258 96 276 60 298 0" fill="none" stroke="var(--grape)" stroke-width="3"/>
  <path d="M248 122 C246 150 262 186 292 210" fill="none" stroke="var(--grape)" stroke-width="3"/>
  <path d="M306 262 C312 282 316 304 322 328" fill="none" stroke="var(--grape)" stroke-width="3"/>
  ${m}
  </svg>`;
}
function hbar(title,rows){
  const x0=70,w=430,rh=26;let s=`<text class="ttl" x="${x0}" y="18">${title}</text>`;
  rows.forEach(([n,v],i)=>{const y=34+i*rh,bw=w*v/35;s+=`<text x="${x0-8}" y="${y+15}" text-anchor="end">${n}</text><rect x="${x0}" y="${y+2}" width="${bw}" height="${rh-8}" rx="3" fill="${n==='その他'?'var(--bar)':'var(--bar2)'}"/><text x="${x0+bw+6}" y="${y+15}">${v}%</text>`;});
  return `<svg viewBox="0 0 560 ${40+rows.length*rh}">${s}</svg>`;
}

const Q=[
 {s:'地形',q:'中央高地とは、どの地域を合わせた地域？',a:'山梨県・長野県・岐阜県北部',o:['新潟県・富山県・石川県','静岡県・愛知県・岐阜県南部','福井県・石川県・富山県'],e:'中央高地は山梨県・長野県・岐阜県北部を合わせた地域です。'},
 {s:'地形',q:'中央高地の平均標高はどのくらい？',a:'700mくらいから1000mくらい',o:['100mくらいから300mくらい','300mくらいから500mくらい','2000mくらいから3000mくらい'],e:'平均標高は700〜1000mくらい。日本の中でも高い土地が広がっています。'},
 {s:'地形',q:'中央高地のおもな盆地の組み合わせとして正しいものは？',a:'長野盆地・松本盆地・甲府盆地',o:['甲府盆地・濃尾平野・越後平野','松本盆地・関東平野・石狩平野','長野盆地・庄内平野・讃岐平野'],e:'中央高地のおもな盆地は長野盆地・松本盆地・甲府盆地です。'},
 {s:'地形',q:'「日本アルプス」とよばれる3つの山脈は？',a:'飛驒山脈・木曽山脈・赤石山脈',o:['奥羽山脈・越後山脈・飛驒山脈','木曽山脈・中国山地・紀伊山地','赤石山脈・日高山脈・鈴鹿山脈'],e:'飛驒山脈・木曽山脈・赤石山脈をまとめて日本アルプスとよびます。'},
 {s:'地形',q:'「北アルプス」とよばれる山脈は？',a:'飛驒山脈',o:['木曽山脈','赤石山脈','奥羽山脈'],e:'いちばん北にある飛驒山脈が北アルプスです。'},
 {s:'地形',q:'「中央アルプス」とよばれる山脈は？',a:'木曽山脈',o:['飛驒山脈','赤石山脈','越後山脈'],e:'3つのまん中にある木曽山脈が中央アルプスです。'},
 {s:'地形',q:'「南アルプス」とよばれる山脈は？',a:'赤石山脈',o:['木曽山脈','飛驒山脈','紀伊山地'],e:'いちばん南にある赤石山脈が南アルプスです。'},
 {s:'地形',q:'富山県と長野県の境にそびえる立山は、どの山脈にふくまれる？',a:'飛驒山脈（北アルプス）',o:['木曽山脈（中央アルプス）','赤石山脈（南アルプス）','奥羽山脈'],e:'立山は飛驒山脈（北アルプス）の山です。富山県側から見える3000m級の山々として知られています。'},
 {s:'地形',q:'長野県と静岡県の境にある赤石岳は、どの山脈にふくまれる？',a:'赤石山脈（南アルプス）',o:['飛驒山脈（北アルプス）','木曽山脈（中央アルプス）','越後山脈'],e:'赤石岳は赤石山脈（南アルプス）の山で、山脈の名前の由来にもなっています。'},
 {s:'地図',map:'shinano',q:'地図のA〜Eのうち、信濃川はどれ？',e:'信濃川は長野盆地を通って北へ流れ、日本海に注ぎます。日本でいちばん長い川です。'},
 {s:'地図',map:'fuji',q:'地図のA〜Eのうち、富士川はどれ？',e:'富士川は甲府盆地から南へ流れ、太平洋（駿河湾）に注ぎます。'},
 {s:'地図',map:'nagano',q:'地図のA〜Eのうち、長野盆地はどれ？',e:'長野盆地は3つの盆地のうちいちばん北にあり、信濃川が流れています。'},
 {s:'地図',map:'matsumoto',q:'地図のA〜Eのうち、松本盆地はどれ？',e:'松本盆地は長野盆地の南、飛驒山脈（北アルプス）の東側にあります。'},
 {s:'地図',map:'kofu',q:'地図のA〜Eのうち、甲府盆地はどれ？',e:'甲府盆地は赤石山脈の東、山梨県にあり、富士川が南へ流れ出しています。'},
 {s:'地形',q:'甲府盆地から流れ出て、太平洋に注ぐ川は？',a:'富士川',o:['信濃川','木曽川','天竜川'],e:'地図では、甲府盆地から南へ富士川が流れています。長野盆地を流れるのは信濃川です。'},
 {s:'気候',q:'土地の標高が高くなると、気温はどうなる？',a:'すずしくなる',o:['暑くなる','変わらない','雨が多くなる'],e:'標高が高くなるにしたがって、すずしくなります。'},
 {s:'気候',c:'temp',q:'甲府（盆地）と静岡（海に面した場所）の気温をくらべると、甲府の特色は？',a:'夏と冬の気温の差が大きい',o:['夏と冬の気温の差が小さい','1年中、静岡より暑い','冬は静岡よりあたたかい'],e:'甲府は1月が約3℃、8月が約26℃で差は約23℃。静岡は約7℃と約28℃で差は約21℃。盆地は海に面した場所にくらべて夏と冬の差が大きくなります。'},
 {s:'グラフ',c:'kofuT',q:'甲府の月別平均気温で、いちばん気温が高い月は？',a:'8月',o:['6月','7月','9月'],e:'グラフでは8月が約26℃でいちばん高くなっています。'},
 {s:'気候',c:'rain',q:'甲府と静岡の降水量をくらべてわかる、盆地の降水量の特色は？',a:'1年間を通して少ない',o:['1年間を通して多い','冬だけ多い','夏だけ少ない'],e:'甲府はどの月も静岡より少なく、いちばん多い9月でも約170mmです。盆地は1年を通して降水量が少ないのが特色です。'},
 {s:'グラフ',c:'rain',q:'静岡の月別降水量で、いちばん多い月は？',a:'7月',o:['6月','8月','9月'],e:'静岡は7月が約300mmでいちばん多くなっています。'},
 {s:'土地利用',q:'山々から流れ出した川が盆地の中につくる地形は？',a:'扇状地',o:['三角州','台地','砂丘'],e:'川が山から平地に出るところに土砂が積もってできる、扇の形の地形を扇状地といいます。'},
 {s:'土地利用',q:'扇状地の見られる土地の特色は？',a:'水はけがよい',o:['水はけが悪い','いつも水につかっている','土地がとても低い'],e:'扇状地は砂や石が多く、水はけがよい土地です。'},
 {s:'土地利用',q:'甲府盆地で、かつて多く見られた畑は？',a:'くわ畑',o:['茶畑','さとうきび畑','キャベツ畑'],e:'養蚕（かいこを育てること）がさかんだったため、かいこのえさになるくわの畑が多く見られました。'},
 {s:'土地利用',q:'甲府盆地でかつてくわ畑が多かったのは、何がさかんだったから？',a:'養蚕',o:['酪農','稲作','林業'],e:'くわの葉はかいこのえさ。養蚕がさかんだったのでくわ畑が広がっていました。'},
 {s:'土地利用',q:'現在の甲府盆地で多いのは？',a:'果樹園（ぶどうやもも）',o:['水田（米）','茶畑（茶）','牧場（牛乳）'],e:'現在は果樹園が多く、おもにぶどうやももを栽培しています。'},
 {s:'土地利用',q:'くだものの実がおいしくなるのは、どんな気候のとき？',a:'気温差が大きいとき',o:['1年中あたたかいとき','雨がとても多いとき','気温差が小さいとき'],e:'くだものには気温差が大きいと実がおいしくなる性質があります。盆地は1年の中でも1日の中でも気温差が大きく、栽培に適しています。'},
 {s:'グラフ',c:'grape',q:'ぶどうの生産量がいちばん多い県は？',a:'山梨県',o:['長野県','岡山県','山形県'],e:'山梨県が26%で1位、長野県が20%で2位です。'},
 {s:'グラフ',c:'peach',q:'ももの生産量で、山梨県に次いで2位の県は？',a:'福島県',o:['長野県','山形県','和歌山県'],e:'1位山梨県29%、2位福島県27%、3位長野県10%です。'},
 {s:'グラフ',c:'grape',q:'ぶどうの生産量で、山梨県と長野県を合わせると全国の何%？',a:'46%',o:['26%','36%','56%'],e:'山梨26%＋長野20%＝46%。中央高地の2県で全国のほぼ半分をつくっています。'},
 {s:'高原',q:'長野県東部に広がり、レタスの栽培で知られる高原は？',a:'野辺山原',o:['松本盆地','甲府盆地','濃尾平野'],e:'野辺山原は長野県東部（地図では甲府盆地の北）に広がる高原です。'},
 {s:'高原',q:'野辺山原で夏にレタスを栽培できるのは、どんな気候をいかしているから？',a:'夏でもすずしい気候',o:['冬でもあたたかい気候','1年中雨が多い気候','夏にとても暑い気候'],e:'標高が高い高原は夏でもすずしいので、暑さに弱いレタスを夏に栽培できます。'}
];

const app=document.getElementById('app');
let deck=[],idx=0,correct=0,missed=[];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sections=['地形','地図','気候','土地利用','高原','グラフ'];

function home(){
  const counts=s=>Q.filter(q=>q.s===s).length;
  app.innerHTML=`<p style="margin:0">教材ページの内容から全${Q.length}問。中央高地の地形・気候・土地利用・高原の農業をたしかめよう。グラフを読みとる問題もあるよ。</p>
  <div class="modes">
    <button class="mode" id="m-all" data-s="all"><strong>ぜんぶ挑戦</strong><span>${Q.length}問・順番はランダム</span></button>
    <button class="mode" id="m-10" data-s="ten"><strong>10問チャレンジ</strong><span>ランダムに10問</span></button>
    ${sections.map(s=>`<button class="mode" id="m-${s}" data-s="${s}"><strong>${s}</strong><span>${counts(s)}問</span></button>`).join('')}
  </div>`;
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{const s=b.dataset.s;
    start(s==='all'?shuffle(Q):s==='ten'?shuffle(Q).slice(0,10):shuffle(Q.filter(q=>q.s===s)));});
}
function start(d){deck=d;idx=0;correct=0;missed=[];show();}
function show(){
  let q=deck[idx],chart=q.c?C[q.c]():'';
  if(q.map){
    const keys=Object.keys(PLACES),letters=shuffle(['A','B','C','D','E']),assign={};
    keys.forEach((k,i)=>assign[k]=letters[i]);
    const a=assign[q.map];
    q=deck[idx]={...q,a,o:['A','B','C','D','E'].filter(l=>l!==a),fixed:true};
    chart=mapChart(assign);
  }
  const opts=q.fixed?['A','B','C','D','E']:shuffle([q.a,...q.o]);
  app.innerHTML=`<div class="meta"><span>${idx+1} / ${deck.length} 問</span><span>正解 ${correct}</span></div>
  <div class="track" style="margin:8px 0 14px"><div class="fill" style="width:${idx/deck.length*100}%"></div></div>
  <span class="tag">${q.s}</span>
  <p class="q">${q.q}</p>
  ${chart?`<div class="chart${q.map?' map':''}">${chart}</div>`:''}
  <div class="opts${q.fixed?' letters':''}">${opts.map((o,i)=>`<button class="opt" id="o${i}" data-v="${o}">${q.fixed?`<span class="k">${o}</span>`:`<span class="k">${'アイウエ'[i]}</span><span>${o}</span>`}</button>`).join('')}</div>
  <div id="after"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(btn,q){
  const ok=btn.dataset.v===q.a;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.a)b.classList.add('ok');});
  if(ok)correct++;else{btn.classList.add('ng');missed.push(q);}
  const last=idx===deck.length-1;
  document.getElementById('after').innerHTML=`<div class="exp"><b class="${ok?'ok':'ng'}">${ok?'正解！':'ざんねん。正解は「'+q.a+'」'}</b>${q.e}</div>
  <div class="row"><button class="btn" id="next">${last?'結果を見る':'次の問題へ'}</button></div>`;
  const n=document.getElementById('next');n.focus({preventScroll:true});
  n.onclick=()=>{if(last)result();else{idx++;show();app.scrollIntoView({block:'start',behavior:'smooth'});}};
}
function result(){
  const pct=Math.round(correct/deck.length*100);
  const msg=pct===100?'全問正解！中央高地マスターだね。':pct>=80?'よくできました。まちがえた問題だけ見直そう。':pct>=50?'あと少し。解説を読んでもう一度挑戦しよう。':'教材のページを見直してから、もう一度やってみよう。';
  app.innerHTML=`<div class="meta"><span>結果</span><span>${pct}%</span></div>
  <div class="track" style="margin:8px 0 18px"><div class="fill" style="width:${pct}%"></div></div>
  <div class="score">${correct}<small> / ${deck.length} 問正解</small></div>
  <p>${msg}</p>
  ${missed.length?`<ul class="review">${missed.map(q=>`<li><strong>${q.q}</strong>正解：${q.a}</li>`).join('')}</ul>`:''}
  <div class="row">
    ${missed.length?`<button class="btn" id="retry">まちがえた問題だけやり直す</button>`:''}
    <button class="btn ${missed.length?'sub':''}" id="home">メニューにもどる</button>
  </div>`;
  const r=document.getElementById('retry');if(r)r.onclick=()=>start(shuffle(missed));
  document.getElementById('home').onclick=home;
}
home();
</script>

</body></html>
