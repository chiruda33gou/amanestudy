<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>えいごたんごクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF0F6;
    --card: #FFFDFE;
    --line: #FBD9E7;
    --ink: #6B4560;
    --ink-soft: #B08AA6;
    --blue: #FF6FA5;
    --blue-deep: #E8508C;
    --lavender: #C9A6E8;
    --green: #4FBE93;
    --green-bg: #E9FBF2;
    --red: #FF7A85;
    --red-bg: #FFEDF0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(160deg, #FFE9F3 0%, #F6E9FF 55%, #EAF3FF 100%);
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    justify-content: center;
    padding: clamp(20px, 5vw, 56px) 14px;
  }

  .card {
    width: min(94vw, 440px);
    background: var(--card);
    border-radius: 28px;
    border: 2px solid #FFDCEC;
    box-shadow: 0 14px 34px rgba(232, 80, 140, 0.16);
    padding: 26px 24px 28px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFE3F0 0%, transparent 70%);
    pointer-events: none;
  }

  header.title-block {
    text-align: center;
    margin-bottom: 20px;
    position: relative;
  }
  header.title-block .heart-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  header.title-block h1 {
    margin: 0;
    font-size: clamp(19px, 5.5vw, 22px);
    font-weight: 900;
    color: var(--blue-deep);
  }
  header.title-block p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---------- Start screen ---------- */
  .start-screen p.lead {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.8;
    margin: 0 0 22px;
  }
  .choice-grid {
    display: grid;
    gap: 12px;
  }
  .count-btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 18px;
    border: 2px solid var(--blue);
    background: #fff;
    color: var(--blue-deep);
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .count-btn span.sub { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .count-btn:hover, .count-btn:focus-visible { background: var(--blue); color: #fff; }
  .count-btn:hover span.sub, .count-btn:focus-visible span.sub { color: #dbe9f8; }
  .count-btn:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }

  /* ---------- Quiz screen ---------- */
  .top-link-row {
    margin-bottom: 12px;
  }
  .top-link-btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 4px 2px;
    cursor: pointer;
  }
  .top-link-btn:hover, .top-link-btn:focus-visible { color: var(--blue-deep); }
  .top-link-btn:focus-visible { outline: 2px solid var(--blue-deep); outline-offset: 2px; }

  .progress-wrap {
    margin-bottom: 20px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .progress-bar-track {
    height: 8px;
    background: var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .word-box {
    background: linear-gradient(135deg, #FFE6F1 0%, #F3E8FF 100%);
    border-radius: 20px;
    padding: 24px 12px 16px;
    text-align: center;
    margin-bottom: 18px;
  }
  .word-en {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 9vw, 44px);
    color: var(--blue-deep);
    word-break: break-word;
  }

  .hint-btn {
    margin-top: 10px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue-deep);
    background: #fff;
    border: 2px solid var(--lavender);
    border-radius: 999px;
    padding: 6px 16px;
    cursor: pointer;
  }
  .hint-btn:hover, .hint-btn:focus-visible { background: var(--lavender); color: #fff; }
  .hint-btn:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
  .hint-btn:disabled { opacity: 0.5; cursor: default; }

  .hint-text {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--lavender);
    min-height: 20px;
    letter-spacing: 0.12em;
  }

  .prompt {
    text-align: center;
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 360px){
    .options { grid-template-columns: 1fr; }
  }

  .opt-btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: clamp(15px, 4.4vw, 17px);
    font-weight: 700;
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 16px;
    min-height: 64px;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.3;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .opt-btn ruby { ruby-align: center; }
  .opt-btn rt { font-size: 0.5em; color: var(--ink-soft); }

  .opt-btn:not(:disabled):hover,
  .opt-btn:not(:disabled):focus-visible {
    border-color: var(--blue);
    transform: translateY(-1px);
  }
  .opt-btn:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
  .opt-btn:disabled { cursor: default; }

  .opt-btn.is-correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
  }
  .opt-btn.is-correct rt { color: var(--green); }

  .opt-btn.is-wrong {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--red);
  }
  .opt-btn.is-wrong rt { color: var(--red); }

  .opt-btn.is-dim { opacity: 0.5; }

  .feedback-row {
    min-height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 700;
    font-size: 14.5px;
  }
  .feedback-row.correct { color: var(--green); }
  .feedback-row.wrong { color: var(--red); }

  /* ---------- Result screen ---------- */
  .result-screen { text-align: center; }
  .result-score {
    font-family: 'Baloo 2', sans-serif;
    font-size: 40px;
    font-weight: 800;
    color: var(--blue-deep);
    margin: 8px 0 6px;
  }
  .result-msg {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0 0 22px;
    line-height: 1.7;
  }
  .result-btns {
    display: grid;
    gap: 10px;
  }
  .result-btns button {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 14px;
    border-radius: 18px;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--blue);
    color: #fff;
    border: none;
  }
  .btn-primary:hover, .btn-primary:focus-visible { background: var(--blue-deep); }
  .btn-secondary {
    background: transparent;
    color: var(--blue-deep);
    border: 2px solid var(--blue);
  }
  .btn-secondary:hover, .btn-secondary:focus-visible { background: #EAF1F9; }
  .result-btns button:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="card">
  <header class="title-block">
    <div class="heart-row">
      <svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true">
        <path d="M10 17 C10 17 1 11.3 1 5.8 C1 2.9 3.2 1 5.8 1 C7.6 1 9.1 2 10 3.4 C10.9 2 12.4 1 14.2 1 C16.8 1 19 2.9 19 5.8 C19 11.3 10 17 10 17 Z" fill="#FF9EC4"/>
      </svg>
      <h1>えいごたんご クイズ</h1>
      <svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true">
        <path d="M10 17 C10 17 1 11.3 1 5.8 C1 2.9 3.2 1 5.8 1 C7.6 1 9.1 2 10 3.4 C10.9 2 12.4 1 14.2 1 C16.8 1 19 2.9 19 5.8 C19 11.3 10 17 10 17 Z" fill="#FF9EC4"/>
      </svg>
    </div>
    <p>英検5級レベル</p>
  </header>

  <!-- START SCREEN -->
  <section id="start-screen" class="start-screen">
    <p class="lead">えいごの たんごを 見て、正しい 日本語の いみを 4つの 中から えらんでね。何問 やる？</p>
    <div class="choice-grid">
      <button class="count-btn" data-count="30">
        30問
        <span class="sub">みじかく れんしゅう</span>
      </button>
      <button class="count-btn" data-count="60">
        60問
        <span class="sub">しっかり れんしゅう</span>
      </button>
      <button class="count-btn" data-count="all">
        <span id="all-count-label">全問</span>
        <span class="sub">ぜんぶ ちょうせん</span>
      </button>
    </div>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="quiz-screen" class="hidden">
    <div class="top-link-row">
      <button class="top-link-btn" id="top-btn-quiz">← トップに戻る</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">1 / 10問</span>
        <span id="score-text">せいかい 0</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="word-box">
      <div class="word-en" id="word-en">dog</div>
      <button class="hint-btn" id="hint-btn">💡 ヒント</button>
      <div class="hint-text" id="hint-text"></div>
    </div>

    <p class="prompt">この ことばの いみは どれかな？</p>

    <div class="options" id="options"></div>

    <div class="feedback-row" id="feedback-row" aria-live="polite"></div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="result-screen" class="hidden result-screen">
    <h1 style="font-size:20px;margin:0 0 4px;color:var(--blue-deep);">クイズ おわり！</h1>
    <div class="result-score" id="result-score">7 / 10</div>
    <p class="result-msg" id="result-msg">よくがんばったね！</p>
    <div class="result-btns">
      <button class="btn-primary" id="retry-same-btn">もういちど 同じ数で やる</button>
      <button class="btn-secondary" id="retry-choose-btn">トップに戻る（問題数を えらびなおす）</button>
    </div>
  </section>

</div>

<script>
(function(){

  // ---------- Word bank (Eiken 5-kyu level) ----------
  var WORDS = [
    ["dog","<ruby>犬<rt>いぬ</rt></ruby>","ドッグ"],
    ["cat","<ruby>猫<rt>ねこ</rt></ruby>","キャット"],
    ["bird","<ruby>鳥<rt>とり</rt></ruby>","バード"],
    ["fish","<ruby>魚<rt>さかな</rt></ruby>","フィッシュ"],
    ["rabbit","うさぎ","ラビット"],
    ["bear","くま","ベア"],
    ["lion","ライオン","ライオン"],
    ["elephant","ぞう","エレファント"],
    ["monkey","さる","モンキー"],
    ["horse","<ruby>馬<rt>うま</rt></ruby>","ホース"],
    ["cow","<ruby>牛<rt>うし</rt></ruby>","カウ"],
    ["pig","ぶた","ピッグ"],
    ["sheep","ひつじ","シープ"],
    ["tiger","とら","タイガー"],
    ["panda","パンダ","パンダ"],
    ["red","<ruby>赤<rt>あか</rt></ruby>","レッド"],
    ["blue","<ruby>青<rt>あお</rt></ruby>","ブルー"],
    ["yellow","<ruby>黄色<rt>きいろ</rt></ruby>","イエロー"],
    ["green","<ruby>緑<rt>みどり</rt></ruby>","グリーン"],
    ["white","<ruby>白<rt>しろ</rt></ruby>","ホワイト"],
    ["black","<ruby>黒<rt>くろ</rt></ruby>","ブラック"],
    ["pink","ピンク","ピンク"],
    ["brown","<ruby>茶色<rt>ちゃいろ</rt></ruby>","ブラウン"],
    ["purple","<ruby>紫<rt>むらさき</rt></ruby>","パープル"],
    ["one","いち（1）","ワン"],
    ["two","に（2）","トゥー"],
    ["three","さん（3）","スリー"],
    ["four","よん（4）","フォー"],
    ["five","ご（5）","ファイブ"],
    ["six","ろく（6）","シックス"],
    ["seven","なな（7）","セブン"],
    ["eight","はち（8）","エイト"],
    ["nine","きゅう（9）","ナイン"],
    ["ten","じゅう（10）","テン"],
    ["father","<ruby>お父さん<rt>おとうさん</rt></ruby>","ファーザー"],
    ["mother","<ruby>お母さん<rt>おかあさん</rt></ruby>","マザー"],
    ["brother","<ruby>兄<rt>あに</rt></ruby>","ブラザー"],
    ["sister","<ruby>姉<rt>あね</rt></ruby>","シスター"],
    ["friend","<ruby>友達<rt>ともだち</rt></ruby>","フレンド"],
    ["family","<ruby>家族<rt>かぞく</rt></ruby>","ファミリー"],
    ["grandmother","おばあさん","グランドマザー"],
    ["grandfather","おじいさん","グランドファーザー"],
    ["school","<ruby>学校<rt>がっこう</rt></ruby>","スクール"],
    ["book","<ruby>本<rt>ほん</rt></ruby>","ブック"],
    ["pen","ペン","ペン"],
    ["pencil","<ruby>鉛筆<rt>えんぴつ</rt></ruby>","ペンシル"],
    ["eraser","<ruby>消しゴム<rt>けしゴム</rt></ruby>","イレイザー"],
    ["bag","かばん","バッグ"],
    ["desk","<ruby>机<rt>つくえ</rt></ruby>","デスク"],
    ["chair","いす","チェア"],
    ["notebook","ノート","ノートブック"],
    ["teacher","<ruby>先生<rt>せんせい</rt></ruby>","ティーチャー"],
    ["student","<ruby>生徒<rt>せいと</rt></ruby>","ステューデント"],
    ["apple","りんご","アップル"],
    ["banana","バナナ","バナナ"],
    ["grape","ぶどう","グレープ"],
    ["milk","ミルク","ミルク"],
    ["bread","パン","ブレッド"],
    ["rice","<ruby>ご飯<rt>ごはん</rt></ruby>","ライス"],
    ["water","<ruby>水<rt>みず</rt></ruby>","ウォーター"],
    ["egg","<ruby>卵<rt>たまご</rt></ruby>","エッグ"],
    ["cake","ケーキ","ケーキ"],
    ["ball","ボール","ボール"],
    ["soccer","サッカー","サッカー"],
    ["baseball","<ruby>野球<rt>やきゅう</rt></ruby>","ベースボール"],
    ["swim","<ruby>泳ぐ<rt>およぐ</rt></ruby>","スイム"],
    ["run","<ruby>走る<rt>はしる</rt></ruby>","ラン"],
    ["jump","ジャンプする","ジャンプ"],
    ["eat","<ruby>食べる<rt>たべる</rt></ruby>","イート"],
    ["drink","<ruby>飲む<rt>のむ</rt></ruby>","ドリンク"],
    ["sleep","<ruby>寝る<rt>ねる</rt></ruby>","スリープ"],
    ["play","<ruby>遊ぶ<rt>あそぶ</rt></ruby>","プレイ"],
    ["big","<ruby>大きい<rt>おおきい</rt></ruby>","ビッグ"],
    ["small","<ruby>小さい<rt>ちいさい</rt></ruby>","スモール"],
    ["happy","うれしい","ハッピー"],
    ["sad","<ruby>悲しい<rt>かなしい</rt></ruby>","サッド"],
    ["hot","<ruby>暑い<rt>あつい</rt></ruby>","ホット"],
    ["cold","<ruby>寒い<rt>さむい</rt></ruby>","コールド"],
    ["rain","<ruby>雨<rt>あめ</rt></ruby>","レイン"],
    ["snow","<ruby>雪<rt>ゆき</rt></ruby>","スノー"],
    ["sun","<ruby>太陽<rt>たいよう</rt></ruby>","サン"],
    ["spring","<ruby>春<rt>はる</rt></ruby>","スプリング"],
    ["summer","<ruby>夏<rt>なつ</rt></ruby>","サマー"],
    ["autumn","<ruby>秋<rt>あき</rt></ruby>","オータム"],
    ["winter","<ruby>冬<rt>ふゆ</rt></ruby>","ウィンター"],
    ["house","<ruby>家<rt>いえ</rt></ruby>","ハウス"],
    ["park","<ruby>公園<rt>こうえん</rt></ruby>","パーク"],
    ["station","<ruby>駅<rt>えき</rt></ruby>","ステーション"],
    ["hospital","<ruby>病院<rt>びょういん</rt></ruby>","ホスピタル"],
    ["shop","<ruby>店<rt>みせ</rt></ruby>","ショップ"],
    ["head","<ruby>頭<rt>あたま</rt></ruby>","ヘッド"],
    ["hand","<ruby>手<rt>て</rt></ruby>","ハンド"],
    ["foot","<ruby>足<rt>あし</rt></ruby>","フット"],
    ["eye","<ruby>目<rt>め</rt></ruby>","アイ"],
    ["ear","<ruby>耳<rt>みみ</rt></ruby>","イヤー"]
  ];

  document.getElementById('all-count-label').textContent = '全' + WORDS.length + '問';

  // ---------- State ----------
  var quiz = [];
  var currentIndex = 0;
  var score = 0;
  var answered = false;
  var advanceTimer = null;

  // ---------- Helpers ----------
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildQuiz(count){
    var pool = shuffle(WORDS);
    var picked = count === 'all' ? pool : pool.slice(0, count);
    return picked.map(function(word){
      var correct = word[1];
      var others = WORDS.filter(function(w){ return w[1] !== correct; });
      var distractors = shuffle(others).slice(0, 3).map(function(w){ return w[1]; });
      var options = shuffle([correct].concat(distractors));
      return { en: word[0], correct: correct, options: options, kana: word[2] };
    });
  }

  // ---------- Screens ----------
  var startScreen = document.getElementById('start-screen');
  var quizScreen = document.getElementById('quiz-screen');
  var resultScreen = document.getElementById('result-screen');

  function showScreen(el){
    [startScreen, quizScreen, resultScreen].forEach(function(s){ s.classList.add('hidden'); });
    el.classList.remove('hidden');
  }

  // ---------- Start ----------
  document.querySelectorAll('.count-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var raw = btn.getAttribute('data-count');
      var count = raw === 'all' ? 'all' : parseInt(raw, 10);
      startQuiz(count);
    });
  });

  function startQuiz(count){
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    quiz = buildQuiz(count);
    currentIndex = 0;
    score = 0;
    showScreen(quizScreen);
    renderQuestion();
  }

  // ---------- Progress ----------
  var progressText = document.getElementById('progress-text');
  var scoreText = document.getElementById('score-text');
  var progressBarFill = document.getElementById('progress-bar-fill');

  function renderProgress(){
    progressText.textContent = (currentIndex + 1) + ' / ' + quiz.length + '問';
    scoreText.textContent = 'せいかい ' + score;
    progressBarFill.style.width = Math.round(((currentIndex) / quiz.length) * 100) + '%';
  }

  // ---------- Question rendering ----------
  var wordEnEl = document.getElementById('word-en');
  var optionsEl = document.getElementById('options');
  var feedbackEl = document.getElementById('feedback-row');
  var hintBtn = document.getElementById('hint-btn');
  var hintText = document.getElementById('hint-text');

  function renderQuestion(){
    answered = false;
    renderProgress();
    var q = quiz[currentIndex];
    wordEnEl.textContent = q.en;
    feedbackEl.innerHTML = '';
    feedbackEl.className = 'feedback-row';
    hintText.textContent = '';
    hintBtn.disabled = false;
    hintBtn.textContent = '💡 ヒント';

    optionsEl.innerHTML = '';
    q.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = opt;
      btn.addEventListener('click', function(){ handleAnswer(btn, opt, q.correct); });
      optionsEl.appendChild(btn);
    });
  }

  function maskKana(kana){
    if (kana.length <= 1) return kana;
    return kana.slice(0, 1) + '●'.repeat(kana.length - 1);
  }

  hintBtn.addEventListener('click', function(){
    var q = quiz[currentIndex];
    hintText.textContent = maskKana(q.kana);
    hintBtn.disabled = true;
  });

  function handleAnswer(btn, chosen, correct){
    if (answered) return;
    answered = true;

    var isCorrect = chosen === correct;
    if (isCorrect) score++;

    Array.from(optionsEl.children).forEach(function(b){
      b.disabled = true;
      if (b.innerHTML === correct) {
        b.classList.add('is-correct');
      } else if (b === btn) {
        b.classList.add('is-wrong');
      } else {
        b.classList.add('is-dim');
      }
    });

    if (isCorrect) {
      feedbackEl.className = 'feedback-row correct';
      feedbackEl.textContent = 'せいかい！';
    } else {
      feedbackEl.className = 'feedback-row wrong';
      feedbackEl.textContent = 'ざんねん。正しい こたえは 緑のところだよ';
    }

    scoreText.textContent = 'せいかい ' + score;

    var delay = isCorrect ? 1100 : 1700;
    advanceTimer = setTimeout(goNext, delay);
  }

  function goNext(){
    if (currentIndex < quiz.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  // ---------- Result ----------
  var resultScoreEl = document.getElementById('result-score');
  var resultMsgEl = document.getElementById('result-msg');

  function showResult(){
    progressBarFill.style.width = '100%';
    resultScoreEl.textContent = score + ' / ' + quiz.length;
    var ratio = score / quiz.length;
    var msg;
    if (ratio === 1) {
      msg = 'パーフェクト！ すごいね！';
    } else if (ratio >= 0.8) {
      msg = 'よくできました！ その ちょうしで がんばろう。';
    } else if (ratio >= 0.5) {
      msg = 'よくがんばったね。もう一度 やると もっと おぼえられるよ。';
    } else {
      msg = 'まだまだ これから！ もう一度 ちょうせんしてみよう。';
    }
    resultMsgEl.textContent = msg;
    showScreen(resultScreen);
  }

  document.getElementById('retry-same-btn').addEventListener('click', function(){
    startQuiz(quiz.length === WORDS.length ? 'all' : quiz.length);
  });
  document.getElementById('retry-choose-btn').addEventListener('click', function(){
    showScreen(startScreen);
  });
  document.getElementById('top-btn-quiz').addEventListener('click', function(){
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    showScreen(startScreen);
  });

})();
</script>

</body>
</html>
