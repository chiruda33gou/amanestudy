<style>
:root{
  --paper:#F6F8F5; --sheet:#FFFFFF; --grid:#3E8C6A; --guide:#A9CDBB;
  --ink:#24303A; --muted:#66737C; --red:#D23A3A; --red-soft:rgba(210,58,58,.22);
  --line:#DCE6DF; --btn:#E8F1EC; --on:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A18; --sheet:#1C2421; --grid:#6DBB95; --guide:#35574A;
    --ink:#E7ECE9; --muted:#9AA7A0; --red:#FF6B6B; --red-soft:rgba(255,107,107,.25);
    --line:#2C3833; --btn:#23302B; --on:#10201A;
  }
}
:root[data-theme="dark"]{
  --paper:#141A18; --sheet:#1C2421; --grid:#6DBB95; --guide:#35574A;
  --ink:#E7ECE9; --muted:#9AA7A0; --red:#FF6B6B; --red-soft:rgba(255,107,107,.25);
  --line:#2C3833; --btn:#23302B; --on:#10201A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overscroll-behavior:none;touch-action:manipulation;background:var(--paper);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6;-webkit-tap-highlight-color:transparent}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
header{border-bottom:2px solid var(--grid);padding-bottom:10px}
h1{font-family:"Klee One",serif;font-weight:600;font-size:1.2rem;margin:0 0 10px;letter-spacing:.06em}
.sets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sets button{flex:none}
.sets[hidden]{display:none}
.sets button[aria-pressed="true"]{background:var(--grid);color:var(--on);border-color:var(--grid);font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.count{font-size:.95rem;color:var(--muted);min-width:4.5em;text-align:center}
.count b{color:var(--ink);font-size:1.15rem}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:10px 0 0}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots span.seen{background:var(--guide)}
.dots span.now{background:var(--grid);transform:scale(1.3)}

.sentence{font-family:"Klee One",serif;font-size:1.2rem;margin:22px 0 4px;text-align:center}
.sentence u{text-decoration:none;border-bottom:2px solid var(--red);padding:0 2px}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:0 0 16px}

.tate{display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;gap:clamp(12px,4vw,36px)}
.stack{display:flex;flex-direction:column;align-items:center}
.stack h2{font-family:"Klee One",serif;font-size:1rem;margin:0 0 6px;height:1.6rem;color:var(--red)}
.stack .spacer{height:1.6rem;margin-bottom:6px}
.seg{display:flex;align-items:center}
.seg + .seg .box,.seg + .seg .ans{border-top-width:0}
.kana{writing-mode:vertical-rl;font-family:"Klee One",serif;font-size:1.1rem;width:var(--kw);
  letter-spacing:.1em;white-space:nowrap;display:flex;align-items:center;justify-content:center;padding-left:4px}
.plain .txt{width:var(--cell);writing-mode:vertical-rl;text-orientation:upright;font-family:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  font-size:calc(var(--cell)*.36);line-height:var(--cell);letter-spacing:0;white-space:nowrap;text-align:center;flex:none;height:calc(var(--cell)*.4*var(--len) + 8px);padding-top:4px}
.plain::after{content:"";width:var(--kw)}
.box{position:relative;width:var(--cell);aspect-ratio:1;background:var(--sheet);
  border:2.5px solid var(--grid);border-radius:4px;overflow:hidden}
.box::before,.box::after,.ans::before,.ans::after{content:"";position:absolute;pointer-events:none}
.box::before,.ans::before{left:50%;top:0;bottom:0;border-left:1.5px dashed var(--guide)}
.box::after,.ans::after{top:50%;left:0;right:0;border-top:1.5px dashed var(--guide)}
.hintbtn{padding:10px 5px;font-size:.78rem;line-height:1.2;margin-right:8px;writing-mode:vertical-rl;letter-spacing:.15em;border-radius:10px;white-space:nowrap}
.hintbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on)}
#cells .plain::before{content:"";width:var(--hb)}
.hintsvg{position:absolute;inset:0;width:100%;height:100%;display:none}
.hintsvg text{fill:var(--red-soft);font-family:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.hintname{position:absolute;left:4px;top:3px;font-size:.7rem;color:var(--red);display:none;line-height:1.2;
  background:var(--sheet);padding:1px 4px;border-radius:3px}
.box.hinted .hintsvg,.box.hinted .hintname{display:block}
.box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{display:flex;gap:6px;margin-top:10px;justify-content:center;padding-right:var(--kw);padding-left:var(--hb)}
button{white-space:nowrap;font:inherit;color:var(--ink);background:var(--btn);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
button:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.primary{display:block;margin:24px auto 0;background:var(--grid);color:var(--on);border-color:var(--grid);
  font-weight:700;font-size:1.05rem;padding:12px 40px}

#answer{--cell:calc(var(--csize)*.55)}
#answer .kana{font-size:.9rem}
#cells{--cell:var(--csize)}
.tools{--cell:var(--csize)}
#answer[hidden],#check[hidden],#again[hidden]{display:none}
:root{--kw:30px;--hb:38px}
.ans{position:relative;width:var(--cell);aspect-ratio:1;background:var(--sheet);border:2.5px solid var(--red);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-family:"Klee One","Yu Kyokasho","YuKyokasho",serif;
  font-size:calc(var(--cell)*.74);line-height:1;color:var(--red)}
.ans::before,.ans::after{border-color:var(--red-soft)}
.ans span{position:relative}
.again{display:block;margin:22px auto 0}
</style>
</head>
<body>
<main>
  <header>
    <h1>漢字のかきとり</h1>
    <div class="sets" id="sets" role="group" aria-label="問題集をえらぶ"></div>
  </header>

  <div class="bar">
    <button id="prev">前の問題</button>
    <span class="count" id="count"></span>
    <button id="next">次の問題</button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <p class="sentence" id="sentence"></p>
  <p class="hint">ふりがなを見て、マスに指で漢字を書きましょう。</p>
  <div class="tate">
    <div class="stack">
      <div class="spacer"></div>
      <div id="cells"></div>
      <div class="tools"><button id="undo">もどす</button><button id="clear">けす</button></div>
    </div>
    <section class="stack" id="answer" hidden aria-live="polite">
      <h2>こたえ</h2>
      <div id="ansWord"></div>
    </section>
  </div>
  <button class="primary" id="check">こたえあわせ</button>
  <button class="again" id="again" hidden>もう一度書く</button>
</main>

<script>
/* 書き方：[漢字:よみ] はマス、かっこの外はそのまま表示するひらがな */
const SETS = [
 {title:"かきとり", items:[
  ["[岸:きし][辺:べ]","川の <u>きしべ</u>を 歩く。"],
  ["[結:けっ][成:せい]","新しい チームを <u>けっせい</u>する。"],
  ["[風:ふう][船:せん]","赤い <u>ふうせん</u>が 空へ とんでいく。"],
  ["[奏:かな]でる","ピアノで 曲を <u>かなでる</u>。"],
  ["[著:あらわ]した","物語を <u>あらわした</u> 作家。"],
  ["[円:えん][熟:じゅく]","<u>えんじゅく</u>した えんぎを 見せる。"],
  ["[映:えい][画:が]","<u>えいが</u>を 見に 行く。"],
  ["[歌:か][劇:げき]","<u>かげき</u>を かんしょうする。"],
  ["[幕:まく][間:あい]","<u>まくあい</u>に ひと休みする。"],
  ["[創:そう][作:さく]","自分で 物語を <u>そうさく</u>する。"],
  ["[絶:ぜっ][好:こう]","<u>ぜっこう</u>の チャンスが くる。"],
  ["[模:も][型:けい]","船の <u>もけい</u>を 作る。"],
  ["[熟:じゅく][達:たつ]","書道に <u>じゅくたつ</u>する。"],
  ["[縦:じゅう][走:そう]","山々を <u>じゅうそう</u>する。"],
  ["[観:かん][光:こう]","京都を <u>かんこう</u>する。"],
  ["[紀:き][行:こう]","旅の <u>きこう</u>文を 書く。"],
  ["[至:いた]る","頂上に <u>いたる</u> 道。"],
  ["[兼:か]ねて","さんぽを <u>かねて</u> 買い物に 行く。"],
  ["[磁:じ][石:しゃく]","<u>じしゃく</u>で 鉄を 引きつける。"],
  ["[街:かい][道:どう]","むかしの <u>かいどう</u>を 歩く。"]
 ]}
];

const RAD = {"岸": ["山", "やま", "T"], "辺": ["辶", "しんにょう", "BL"], "結": ["糸", "いとへん", "L"], "成": ["戈", "ほこづくり", "R"], "風": ["風", "かぜ", "W"], "船": ["舟", "ふねへん", "L"], "奏": ["大", "だい", "N"], "著": ["艹", "くさかんむり", "T"], "円": ["冂", "どうがまえ", "K"], "熟": ["灬", "れっか", "B"], "映": ["日", "ひへん", "L"], "画": ["田", "た", "N"], "歌": ["欠", "あくび", "R"], "劇": ["刂", "りっとう", "R"], "幕": ["巾", "はば", "B"], "間": ["門", "もんがまえ", "K"], "創": ["刂", "りっとう", "R"], "作": ["亻", "にんべん", "L"], "絶": ["糸", "いとへん", "L"], "好": ["女", "おんなへん", "L"], "模": ["木", "きへん", "L"], "型": ["土", "つち", "B"], "達": ["辶", "しんにょう", "BL"], "縦": ["糸", "いとへん", "L"], "走": ["走", "はしる", "W"], "観": ["見", "みる", "R"], "光": ["儿", "ひとあし", "B"], "紀": ["糸", "いとへん", "L"], "行": ["行", "ぎょうがまえ", "W"], "至": ["至", "いたる", "W"], "兼": ["八", "はち", "N"], "磁": ["石", "いしへん", "L"], "石": ["石", "いし", "W"], "街": ["行", "ぎょうがまえ", "N"], "道": ["辶", "しんにょう", "BL"]};
const parse = s => [...s.matchAll(/\[(.+?):(.+?)\]|([^\[]+)/g)]
  .map(m => m[1] ? {k:m[1], r:m[2]} : {p:m[3]});

let si = 0, qi = 0;
const state = {};             // "si-qi" -> {strokes:[[...],...], answered:bool}
const key = () => `${si}-${qi}`;
const $ = s => document.querySelector(s);
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 手書きマス ---------- */
function makePad(box, strokes, onStroke){
  const cv = document.createElement('canvas'); box.appendChild(cv);
  const ctx = cv.getContext('2d');
  let cur = null;
  function redraw(){
    const w = cv.width; ctx.clearRect(0,0,w,w);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle = cssVar('--ink'); ctx.lineWidth = w*0.045;
    for(const s of strokes){
      ctx.beginPath();
      s.forEach((p,i)=> i ? ctx.lineTo(p[0]*w,p[1]*w) : ctx.moveTo(p[0]*w,p[1]*w));
      if(s.length===1) ctx.lineTo(s[0][0]*w+0.1,s[0][1]*w);
      ctx.stroke();
    }
  }
  function size(){
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
    cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); redraw();
  }
  const pt = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); cur=[pt(e)]; strokes.push(cur); onStroke(); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; e.preventDefault(); cur.push(pt(e)); redraw(); });
  const end = ()=>{ cur=null; };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  new ResizeObserver(size).observe(cv);
  return { undo(){ strokes.pop(); redraw(); }, clear(){ strokes.length=0; redraw(); }, redraw };
}

/* ---------- ヒント（部首） ---------- */
// L:へん R:つくり T:かんむり B:あし TL:たれ BL:にょう K:かまえ … 部首の形をその位置にうすく表示
// N:部首が字の中にある／W:字全体が部首 … 名前だけ表示
const POS = { L:[27,50,.55,1], R:[73,50,.55,1], T:[50,27,1,.5], B:[50,73,1,.5], TL:[50,50,1,1], BL:[50,50,1,1], K:[50,50,1,1] };
const COMPONENT = '亻氵辶廴艹宀广癶覀灬刂阝卩勹冂礻飠牜罒彳';
function hintHTML(ch){
  const r = RAD[ch]; if(!r) return '';
  const [g,name,pos] = r;
  // 亻・艹・辶などの部首専用の字形は、もともと字の中の位置に描かれているのでそのまま出す
  const t = POS[pos] && (COMPONENT.includes(g) ? [50,50,1,1] : POS[pos]);
  const svg = t ? `<svg class="hintsvg" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(${t[0]} ${t[1]}) scale(${t[2]} ${t[3]})"><text x="0" y="0" font-size="86" text-anchor="middle" dominant-baseline="central">${g}</text></g></svg>` : '';
  const label = pos==='W' ? `${name}（字全体）` : `${name}${t ? '' : '（'+g+'）'}`;
  return svg + `<span class="hintname">${label}</span>`;
}

/* ---------- 画面 ---------- */
let pads = [];
function cellSize(n){
  const avail = Math.min(document.querySelector('main').clientWidth - 32, 648);
  const plainH = parse(SETS[si].items[qi][0]).filter(x=>x.p).reduce((a,x)=>a+x.p.length,0);
  // 横：書くマスとこたえのマスの2列＋ふりがな、縦：画面の高さの6割におさめる
  // 書くマスを大きく、こたえのマスはその0.55倍。横：ヒント＋マス＋ふりがな と こたえの列、縦：画面の高さの7割
  const byW = (avail - 38 - 2*30 - 20) / 1.55;
  const byH = (window.innerHeight*0.7) / (n + plainH*0.4);
  return Math.floor(Math.max(80, Math.min(260, byW, byH)));
}

function renderSets(){
  $('#sets').hidden = SETS.length < 2;
  $('#sets').innerHTML = SETS.map((s,i)=>`<button aria-pressed="${i===si}" data-i="${i}">${s.title}</button>`).join('');
  $('#sets').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ si=+b.dataset.i; qi=0; renderSets(); render(); });
}

function render(){
  const items = SETS[si].items, [src, sentence] = items[qi];
  const segs = parse(src), n = segs.filter(x=>x.k).length;
  const st = state[key()] ||= { strokes: segs.filter(x=>x.k).map(()=>[]), answered:false };
  document.documentElement.style.setProperty('--csize', cellSize(n)+'px');

  $('#count').innerHTML = `<b>${qi+1}</b> / ${items.length}`;
  $('#prev').disabled = qi===0;
  const last = qi===items.length-1;
  $('#next').textContent = last ? (si<SETS.length-1 ? '次のまとめへ' : 'おわり') : '次の問題';
  $('#next').disabled = last && si===SETS.length-1;
  $('#dots').innerHTML = items.map((_,i)=>`<span class="${i===qi?'now':state[`${si}-${i}`]?'seen':''}"></span>`).join('');
  $('#sentence').innerHTML = sentence;

  const cells = $('#cells'); cells.innerHTML = ''; pads = [];
  st.hist ||= [];
  let k = 0;
  segs.forEach(seg=>{
    const row = document.createElement('div');
    if(seg.p){ row.className='seg plain'; row.innerHTML=`<div class="txt" style="--len:${seg.p.length}">${seg.p}</div>`; cells.appendChild(row); return; }
    const idx = k++;
    row.className='seg';
    row.innerHTML = `<button class="hintbtn" aria-pressed="false">ヒント</button><div class="box" role="img" aria-label="「${seg.r}」の漢字を書くマス">${hintHTML(seg.k)}</div><div class="kana">${seg.r}</div>`;
    cells.appendChild(row);
    const hb = row.querySelector('.hintbtn'), bx = row.querySelector('.box');
    st.hints ||= [];
    const setHint = on => { st.hints[idx]=on; hb.setAttribute('aria-pressed',on); bx.classList.toggle('hinted',on); };
    setHint(!!st.hints[idx]);
    hb.onclick = ()=> setHint(!st.hints[idx]);
    pads.push(makePad(row.querySelector('.box'), st.strokes[idx], ()=>st.hist.push(idx)));
  });
  $('#undo').onclick = ()=>{ const i = st.hist.pop(); if(i!==undefined) pads[i].undo(); };
  $('#clear').onclick = ()=>{ st.hist.length=0; pads.forEach(p=>p.clear()); };

  $('#ansWord').innerHTML = segs.map(seg => seg.p
    ? `<div class="seg plain"><div class="txt" style="--len:${seg.p.length}">${seg.p}</div></div>`
    : `<div class="seg"><div class="ans"><span>${seg.k}</span></div><div class="kana">${seg.r}</div></div>`).join('');
  $('#answer').hidden = !st.answered; $('#check').hidden = st.answered; $('#again').hidden = !st.answered;
}

$('#check').onclick = ()=>{
  state[key()].answered = true;
  $('#answer').hidden = false; $('#check').hidden = true; $('#again').hidden = false;
};
$('#again').onclick = ()=>{ const st = state[key()]; st.answered=false; st.hist=[]; st.hints=[]; st.strokes.forEach(s=>s.length=0); render(); };
$('#prev').onclick = ()=>{ if(qi>0){ qi--; render(); window.scrollTo({top:0}); } };
$('#next').onclick = ()=>{
  if(qi < SETS[si].items.length-1) qi++;
  else if(si < SETS.length-1){ si++; qi=0; renderSets(); }
  render(); window.scrollTo({top:0});
};
let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  const n = parse(SETS[si].items[qi][0]).filter(x=>x.k).length;
  document.documentElement.style.setProperty('--csize', cellSize(n)+'px'); },100); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>pads.forEach(p=>p.redraw()));

renderSets(); render();
</script>
</body>
</html>
