<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ことばのなかま探し</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Kiwi+Maru:wght@500&display=swap">
<style>
/* Layout: 国語ノートのマス目を背景に、1問ずつのカード。品詞ごとに色を固定（名詞=藍・動詞=朱・形容詞=若草・副詞=山吹） */
:root{
  --bg:#eef3f6; --grid:#d9e4ea; --paper:#ffffff; --ink:#1f2d36; --mute:#5d6f7a; --line:#c9d6de;
  --n:#2f5fb3; --n-soft:#e3ebfa;
  --v:#c8442f; --v-soft:#fbe6e1;
  --a:#3f8a3a; --a-soft:#e4f2e1;
  --d:#c27c0e; --d-soft:#fbefd9;
  --ok:#2e8b57; --ng:#c0392b;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --display:"Kiwi Maru","Zen Maru Gothic","Hiragino Mincho ProN",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b20; --grid:#1d272e; --paper:#1c252c; --ink:#e8eef2; --mute:#9db0bb; --line:#33424c;
  --n:#7ea6f0; --n-soft:#22314a; --v:#f08a76; --v-soft:#43261f; --a:#86c97e; --a-soft:#223823; --d:#eab45a; --d-soft:#40311a;
  --ok:#5cc68a; --ng:#f07b6e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141b20; --grid:#1d272e; --paper:#1c252c; --ink:#e8eef2; --mute:#9db0bb; --line:#33424c;
  --n:#7ea6f0; --n-soft:#22314a; --v:#f08a76; --v-soft:#43261f; --a:#86c97e; --a-soft:#223823; --d:#eab45a; --d-soft:#40311a;
  --ok:#5cc68a; --ng:#f07b6e; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100%}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:500;font-size:clamp(26px,6vw,36px);margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:22px clamp(16px,4vw,28px)}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--n);outline-offset:2px}

/* なかまカード */
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lg{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lg b{font-size:18px}
.lg span{font-size:13px;color:var(--ink)}
.lg small{font-size:12px;color:var(--mute)}
.p-n{background:var(--n-soft)} .p-n b{color:var(--n)}
.p-v{background:var(--v-soft)} .p-v b{color:var(--v)}
.p-a{background:var(--a-soft)} .p-a b{color:var(--a)}
.p-d{background:var(--d-soft)} .p-d b{color:var(--d)}

/* スタート */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--n);transform:translateY(-2px)}
.mode .t{font-weight:900;font-size:18px}
.mode .e{font-size:13px;color:var(--mute)}
.mode .demo{font-size:15px;margin-top:4px}
.mode .demo em{font-style:normal;background:var(--v-soft);color:var(--v);border-radius:6px;padding:0 6px;font-weight:700}
.best{font-size:13px;color:var(--mute);text-align:right}

/* 出題 */
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--n);width:0;transition:width .3s}
.count{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.quit{border:none;background:none;color:var(--mute);font-size:13px;text-decoration:underline;padding:4px}
.ask{font-size:clamp(18px,4.6vw,22px);font-weight:700;margin:14px 0 4px;text-wrap:balance}
.ask .tag{display:inline-block;border-radius:8px;padding:0 10px;color:#fff;margin:0 2px}
.tag.n{background:var(--n)} .tag.v{background:var(--v)} .tag.a{background:var(--a)} .tag.d{background:var(--d)}
:root[data-theme="dark"] .tag, :root[data-theme="dark"] .tag{color:#141b20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#141b20}}
.hint{font-size:13px;color:var(--mute);margin:0 0 16px}
.sentence{font-size:clamp(22px,6vw,30px);line-height:2.1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 2px;padding:14px 0 6px;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);min-height:96px}
.w{font:inherit;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:0 10px;line-height:1.7;transition:background .15s,border-color .15s,transform .1s}
button.w:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
button.w:disabled{cursor:default}
.part{color:var(--mute);font-weight:500;padding:0 1px}
.w.focus{border-color:var(--ink);background:var(--bg);box-shadow:0 3px 0 var(--ink)}
.w.ok{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.w.ng{border-color:var(--ng);color:var(--ng);text-decoration:line-through;text-decoration-thickness:2px}
.w.miss{border-color:var(--ok);border-style:dashed;color:var(--ok)}
.w.reveal-n{border-color:var(--n);color:var(--n)} .w.reveal-v{border-color:var(--v);color:var(--v)}
.w.reveal-a{border-color:var(--a);color:var(--a)} .w.reveal-d{border-color:var(--d);color:var(--d)}

.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
@media (max-width:560px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ch{border:2px solid transparent;border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--ink);transition:transform .1s,border-color .15s}
.ch b{font-size:20px}
.ch small{font-size:12px;color:var(--mute)}
.ch:hover:not(:disabled){transform:translateY(-2px)}
.ch:disabled{cursor:default;opacity:.55}
.ch.n{background:var(--n-soft)} .ch.n b{color:var(--n)}
.ch.v{background:var(--v-soft)} .ch.v b{color:var(--v)}
.ch.a{background:var(--a-soft)} .ch.a b{color:var(--a)}
.ch.d{background:var(--d-soft)} .ch.d b{color:var(--d)}
.ch.right{opacity:1;border-color:var(--ok)}
.ch.wrong{opacity:1;border-color:var(--ng)}

.feedback{margin-top:18px;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.feedback.ng{background:color-mix(in srgb,var(--ng) 12%,var(--paper))}
.feedback .head{font-weight:900;font-size:20px}
.feedback.ok .head{color:var(--ok)} .feedback.ng .head{color:var(--ng)}
.feedback p{margin:0;font-size:15px}
.next{align-self:flex-end;margin-top:6px;border:none;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 22px;font-size:16px;font-weight:700}

/* 結果 */
.result{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.score{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--mute)}
.stars{font-size:36px;letter-spacing:6px;color:var(--d)}
.stars .off{color:var(--line)}
.msg{font-size:17px;font-weight:700;margin:0}
.review{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.review h3{margin:6px 0 0;font-size:16px}
.rv{border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.rv .s{font-size:17px;margin-bottom:2px}
.rv mark{background:none;font-weight:900;border-bottom:3px solid currentColor}
.rv mark.n{color:var(--n)} .rv mark.v{color:var(--v)} .rv mark.a{color:var(--a)} .rv mark.d{color:var(--d)}
.rv p{margin:0;color:var(--mute);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 20px;font-size:16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>ことばのなかま探し</h1>
      <p class="sub">小学4年生　国語　｜　名詞・動詞・形容詞・副詞を見分けよう</p>
    </div>
  </header>

  <section class="card legend" aria-label="ことばのなかま">
    <div class="lg p-n"><b>名詞</b><span>ものや人の名前</span><small>ねこ・本・空</small></div>
    <div class="lg p-v"><b>動詞</b><span>動きをあらわす</span><small>「う」の音で終わる（歩く・読む）</small></div>
    <div class="lg p-a"><b>形容詞</b><span>様子・気持ちをあらわす</span><small>「い」で終わる（白い・楽しい）</small></div>
    <div class="lg p-d"><b>副詞</b><span>どのように？をくわしくする</span><small>ゆっくり・とても・ころころ</small></div>
  </section>

  <main id="app" class="card"></main>
</div>

<script>
// ---- 問題データ：[ことば, 品詞, (動詞の言い切りの形)]。品詞なしは「が・を」などの助詞 ----
const S = [
  [["小さい","a"],["ねこ","n"],["が"],["ゆっくり","d"],["歩く","v"],["。"]],
  [["白い","a"],["雲","n"],["が"],["ふわふわ","d"],["うかぶ","v"],["。"]],
  [["弟","n"],["は"],["とても","d"],["楽しい","a"],["本","n"],["を"],["読んだ","v","読む"],["。"]],
  [["冷たい","a"],["水","n"],["を"],["ごくごく","d"],["飲む","v"],["。"]],
  [["赤い","a"],["花","n"],["が"],["いっせいに","d"],["さいた","v","さく"],["。"]],
  [["明るい","a"],["星","n"],["が"],["きらきら","d"],["光る","v"],["。"]],
  [["母","n"],["は"],["熱い","a"],["お茶","n"],["を"],["ゆっくり","d"],["飲む","v"],["。"]],
  [["強い","a"],["風","n"],["が"],["びゅうびゅう","d"],["ふく","v"],["。"]],
  [["ぼく","n"],["は"],["新しい","a"],["自転車","n"],["で"],["すいすい","d"],["走る","v"],["。"]],
  [["先生","n"],["が"],["やさしい","a"],["声","n"],["で"],["ゆっくり","d"],["話す","v"],["。"]],
  [["高い","a"],["空","n"],["を"],["鳥","n"],["が"],["すいすい","d"],["とぶ","v"],["。"]],
  [["かわいい","a"],["犬","n"],["が"],["しっぽ","n"],["を"],["ぶんぶん","d"],["ふる","v"],["。"]],
  [["姉","n"],["は"],["いつも","d","乗る"],["早い","a"],["電車","n"],["に"],["乗る","v"],["。"]],
  [["重い","a"],["荷物","n"],["を"],["やっと","d"],["運んだ","v","運ぶ"],["。"]],
  [["黒い","a"],["雲","n"],["が"],["だんだん","d"],["広がる","v"],["。"]],
  [["子どもたち","n"],["が"],["広い","a"],["公園","n"],["で"],["のびのび","d"],["遊ぶ","v"],["。"]],
  [["古い","a"],["時計","n"],["が"],["ちくたく","d"],["動く","v"],["。"]],
  [["父","n"],["は"],["長い","a"],["道","n"],["を"],["ずっと","d"],["歩いた","v","歩く"],["。"]],
  [["あまい","a"],["りんご","n"],["を"],["もぐもぐ","d"],["食べる","v"],["。"]],
  [["弱い","a"],["雨","n"],["が"],["しとしと","d"],["ふる","v"],["。"]],
  [["細い","a"],["川","n"],["が"],["さらさら","d"],["流れる","v"],["。"]],
  [["妹","n"],["が"],["短い","a"],["手紙","n"],["を"],["そっと","d"],["開けた","v","開ける"],["。"]],
  [["暑い","a"],["日","n"],["に"],["氷","n"],["が"],["すぐ","d"],["とける","v"],["。"]],
  [["丸い","a"],["ボール","n"],["が"],["ころころ","d"],["転がる","v"],["。"]],
  [["ぼくたち","n"],["は"],["もう","d","着いた"],["すずしい","a"],["教室","n"],["に"],["着いた","v","着く"],["。"]],
  [["にわとり","n"],["が"],["大きい","a"],["声","n"],["で"],["たびたび","d"],["鳴く","v"],["。"]],
];

const P = {
  n:{name:"名詞",kana:"めいし",desc:"ものや人の名前"},
  v:{name:"動詞",kana:"どうし",desc:"動きをあらわす"},
  a:{name:"形容詞",kana:"けいようし",desc:"様子・気持ち"},
  d:{name:"副詞",kana:"ふくし",desc:"くわしくする"},
};
const ORDER = ["n","v","a","d"];
const ROUND = 10;

function why(tok, s){
  const [w,p,base] = tok;
  const next = s.slice(s.indexOf(tok)+1).find(t=>t[1]);
  if(p==="n") return `「${w}」は、ものや人の名前なので名詞です。「${w}が」「${w}を」のように、あとに「が・を・は」をつけられます。`;
  if(p==="v") return base
    ? `「${w}」は動きをあらわす動詞です。言い切りの形にすると「${base}」で、「う」の音で終わります。`
    : `「${w}」は動きをあらわす動詞です。言い切りの形が「う」の音で終わっています。`;
  if(p==="a") return `「${w}」は様子や気持ちをあらわす形容詞です。言い切りの形が「い」で終わります。`;
  const tgt = p==="d" ? (base || (next&&next[0])) : null;
  if(p==="d") return tgt
    ? `「${w}」は副詞です。「どのように？」「どのくらい？」に答えて、「${tgt}」をくわしくしています。`
    : `「${w}」は副詞です。ほかのことばをくわしくしています。`;
}

const app = document.getElementById("app");
let mode="tap", qs=[], qi=0, score=0, misses=[], answered=false;

function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function build(m){
  const sents = shuffle(S).slice(0,ROUND);
  // 品詞がかたよらないよう順番にわりふる
  const targets = shuffle([...ORDER,...ORDER,...ORDER]).slice(0,ROUND);
  return sents.map((s,i)=>{
    const pos = targets[i];
    if(m==="tap") return {type:"tap",s,pos};
    const cands = s.filter(t=>t[1]===pos);
    return {type:"pick",s,tok:cands[Math.random()*cands.length|0]};
  });
}

function start(m){
  mode=m; qs = m==="mix" ? build("tap").map((q,i)=> i%2 ? build("pick")[i] : q) : build(m);
  qi=0; score=0; misses=[]; renderQ();
}

function home(){
  const bt=store("best-tap"), bp=store("best-pick"), bm=store("best-mix");
  app.innerHTML = `
    <h2 style="margin:0 0 4px;font-size:20px">あそび方をえらぼう</h2>
    <p class="hint" style="margin-bottom:14px">1回 ${ROUND}問。まちがえた問題は、さいごにふりかえれます。</p>
    <div class="modes">
      <button class="mode" id="m-tap">
        <span class="t">ことばをさがす</span>
        <span class="e">文の中から、言われたなかまのことばをタップ</span>
        <span class="demo">「<em>動詞</em>」はどれ？ → ねこが ゆっくり <em>歩く</em>。</span>
      </button>
      <button class="mode" id="m-pick">
        <span class="t">なかまをこたえる</span>
        <span class="e">しるしのついたことばが、どのなかまか4つからえらぶ</span>
        <span class="demo">白い雲が <em>ふわふわ</em> うかぶ。 → 副詞</span>
      </button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="btn ghost" id="m-mix" style="font-size:14px;padding:8px 14px">ミックス（両方まぜる）</button>
      <span class="best">${[["ことばをさがす",bt],["なかまをこたえる",bp],["ミックス",bm]].filter(x=>x[1]).map(x=>`${x[0]} ベスト ${x[1]}/${ROUND}`).join("　")}</span>
    </div>`;
  document.getElementById("m-tap").onclick=()=>start("tap");
  document.getElementById("m-pick").onclick=()=>start("pick");
  document.getElementById("m-mix").onclick=()=>start("mix");
}

function topBar(){
  return `<div class="top"><div class="bar"><i style="width:${qi/ROUND*100}%"></i></div>
    <span class="count">${qi+1} / ${ROUND}問　◯ ${score}</span>
    <button class="quit" id="quit">やめる</button></div>`;
}

function renderQ(){
  answered=false;
  const q=qs[qi];
  if(q.type==="tap"){
    app.innerHTML = topBar()+`
      <p class="ask">この文の中から <span class="tag ${q.pos}">${P[q.pos].name}</span> をえらぼう</p>
      <p class="hint">${P[q.pos].name}（${P[q.pos].kana}）は「${P[q.pos].desc}」ことば。色のない「が・を」などはえらべません。</p>
      <div class="sentence">${q.s.map((t,i)=> t[1]
        ? `<button class="w" data-i="${i}">${t[0]}</button>` : `<span class="part">${t[0]}</span>`).join("")}</div>
      <div id="fb"></div>`;
    app.querySelectorAll("button.w").forEach(b=>b.onclick=()=>answerTap(+b.dataset.i));
  } else {
    const ti=q.s.indexOf(q.tok);
    app.innerHTML = topBar()+`
      <p class="ask">しるしのついたことばは、どのなかま？</p>
      <p class="hint">文の中での働きを考えよう。</p>
      <div class="sentence">${q.s.map((t,i)=> i===ti
        ? `<span class="w focus">${t[0]}</span>` : `<span class="${t[1]?"":"part"}" style="${t[1]?"padding:0 2px":""}">${t[0]}</span>`).join("")}</div>
      <div class="choices">${ORDER.map(p=>`<button class="ch ${p}" data-p="${p}"><b>${P[p].name}</b><small>${P[p].desc}</small></button>`).join("")}</div>
      <div id="fb"></div>`;
    app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answerPick(b.dataset.p));
  }
  document.getElementById("quit").onclick=home;
}

function feedback(ok, text){
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="feedback ${ok?"ok":"ng"} pop">
    <span class="head">${ok?"せいかい！":"ざんねん…"}</span><p>${text}</p>
    <button class="next" id="next">${qi+1<ROUND?"つぎの問題へ":"けっかを見る"}</button></div>`;
  const n=document.getElementById("next"); n.focus({preventScroll:true}); n.onclick=advance;
  fb.scrollIntoView && fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function answerTap(i){
  if(answered) return; answered=true;
  const q=qs[qi], t=q.s[i], ok=t[1]===q.pos;
  app.querySelectorAll("button.w").forEach(b=>{
    const tk=q.s[+b.dataset.i]; b.disabled=true;
    if(tk[1]===q.pos) b.classList.add(+b.dataset.i===i?"ok":"miss");
    else if(+b.dataset.i===i) b.classList.add("ng");
  });
  const correct=q.s.filter(x=>x[1]===q.pos);
  let text;
  if(ok){ score++; text=why(t,q.s); if(correct.length>1) text+=` この文には「${correct.map(x=>x[0]).join("」「")}」の${correct.length}つの${P[q.pos].name}があります。`; }
  else { text=`「${t[0]}」は${P[t[1]].name}です。${P[q.pos].name}は「${correct.map(x=>x[0]).join("」「")}」。`+why(correct[0],q.s);
    misses.push({s:q.s,tok:correct[0],note:`${P[q.pos].name}をさがす問題で「${t[0]}」（${P[t[1]].name}）をえらんだ`}); }
  feedback(ok,text);
}

function answerPick(p){
  if(answered) return; answered=true;
  const q=qs[qi], ok=p===q.tok[1];
  app.querySelectorAll(".ch").forEach(b=>{ b.disabled=true;
    if(b.dataset.p===q.tok[1]) b.classList.add("right"); else if(b.dataset.p===p) b.classList.add("wrong"); });
  const f=app.querySelector(".w.focus"); f.classList.remove("focus"); f.classList.add(ok?"ok":"reveal-"+q.tok[1]);
  if(ok) score++; else misses.push({s:q.s,tok:q.tok,note:`「${P[p].name}」とこたえた`});
  feedback(ok, (ok?"":`こたえは${P[q.tok[1]].name}。`)+why(q.tok,q.s));
}

function advance(){ qi++; if(qi<ROUND) renderQ(); else result(); }

function result(){
  const key="best-"+mode, prev=+(store(key)||0);
  if(score>prev) store(key,String(score));
  const stars = score>=10?3: score>=7?2: score>=4?1:0;
  const msg = score===10?"パーフェクト！ことばのなかま名人です。": score>=7?"よくできました！あと少しで全問せいかい。": score>=4?"その調子！まちがえた問題を見なおそう。":"なかまカードを読んで、もう一回ちょうせんしよう。";
  app.innerHTML=`<div class="result">
    <div class="stars pop">${[0,1,2].map(i=>`<span class="${i<stars?"":"off"}">★</span>`).join("")}</div>
    <div class="score">${score}<small> / ${ROUND}</small></div>
    <p class="msg">${msg}</p>
    ${score>prev && prev>0 ? `<p class="hint" style="margin:0">ベスト記録を ${prev}問 → ${score}問 に更新！</p>`:""}
    ${misses.length?`<div class="review"><h3>ふりかえり（${misses.length}問）</h3>${misses.map(m=>`
      <div class="rv"><div class="s">${m.s.map(t=>t===m.tok?`<mark class="${t[1]}">${t[0]}</mark>`:t[0]).join("")}</div>
      <p>${m.note}。<b style="color:var(--${m.tok[1]})">${m.tok[0]}＝${P[m.tok[1]].name}</b>　${why(m.tok,m.s)}</p></div>`).join("")}</div>`:""}
    <div class="actions"><button class="btn" id="again">もう一回</button><button class="btn ghost" id="back">あそび方をえらぶ</button></div>
  </div>`;
  document.getElementById("again").onclick=()=>start(mode);
  document.getElementById("back").onclick=home;
}

home();
</script>

</body></html>
