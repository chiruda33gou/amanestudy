<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>地図記号クイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 地形図の紙面。中央の1カラムに「出題カード＋選択肢」。背景に等高線。 */
:root{
  --paper:#f2f5ec; --card:#ffffff; --ink:#1c2420; --muted:#5d6a62;
  --contour:#b86f32; --line:#d9ddd0;
  --good:#23885a; --good-bg:#e1f3e8; --bad:#c23d34; --bad-bg:#fbe6e3;
  --f-display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-glyph:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131916; --card:#1d2521; --ink:#e7ece5; --muted:#9aa79f;
  --contour:#e0a063; --line:#2f3a34;
  --good:#5cc993; --good-bg:#183326; --bad:#ef7b70; --bad-bg:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131916; --card:#1d2521; --ink:#e7ece5; --muted:#9aa79f;
  --contour:#e0a063; --line:#2f3a34;
  --good:#5cc993; --good-bg:#183326; --bad:#ef7b70; --bad-bg:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 48px;position:relative;overflow-x:hidden}
.contours{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.contours path{fill:none;stroke:var(--contour);stroke-width:1.2;opacity:.18}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--contour)}
.tabs{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:700 14px var(--f-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:3px solid var(--contour);outline-offset:2px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;font:700 15px var(--f-body);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode span{font-size:12px;font-weight:500;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--contour);box-shadow:inset 0 0 0 1px var(--contour)}

.progress{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--contour);width:0;transition:width .3s}

.stage{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qlabel{font-size:14px;font-weight:700;color:var(--muted)}
.qsym{width:min(180px,46vw);aspect-ratio:1;max-width:100%}
.qname{font-family:var(--f-display);font-size:clamp(30px,9vw,44px);line-height:1.3;padding-block:18px 6px}
.yomi{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em}

svg.sym{display:block;width:100%;height:100%}
svg.sym .s{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
svg.sym .f{fill:var(--ink)}
svg.sym text{fill:var(--ink);font-family:var(--f-glyph);font-weight:700}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font:700 18px var(--f-body);cursor:pointer;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .08s,border-color .15s}
.choice small{font-size:11px;color:var(--muted);font-weight:500}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice:active:not(:disabled){transform:scale(.97)}
.choice .mini{width:76px;height:76px}
.choice.sym-choice{padding:10px}
.choice:disabled{cursor:default}
.choice.correct{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.dim{opacity:.45}

.feedback{border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;border:2px solid}
.feedback.ok{background:var(--good-bg);border-color:var(--good)}
.feedback.ng{background:var(--bad-bg);border-color:var(--bad)}
.feedback .fsym{width:64px;height:64px;flex:none;background:var(--card);border-radius:10px;padding:6px}
.feedback .ftext{min-width:0}
.feedback b{display:block;font-size:17px}
.feedback.ok b{color:var(--good)} .feedback.ng b{color:var(--bad)}
.feedback p{margin:2px 0 0;font-size:14px}

.primary{align-self:center;border:0;background:var(--ink);color:var(--paper);font:900 17px var(--f-body);padding:14px 36px;border-radius:999px;cursor:pointer}
.primary:hover{background:var(--contour);color:#fff}

.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.score{font-family:var(--f-display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:24px;color:var(--muted)}
.rank{font-weight:900;font-size:18px;color:var(--contour)}
.best{font-size:13px;color:var(--muted)}
.miss h3{font-size:15px;margin:8px 0}
.misslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.card .csym{width:72px;height:72px}
.card h4{margin:4px 0 0;font-size:16px;line-height:1.3}
.card p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--bad);border-radius:12px;padding:4px 10px 4px 4px;font-weight:700;font-size:14px}
.chip .csym{width:36px;height:36px}
.intro{margin:0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg class="contours" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <path d="M-20 620 C120 560 220 650 360 600 S600 520 820 590"/>
  <path d="M-20 680 C140 620 240 720 380 660 S620 590 820 650"/>
  <path d="M-20 740 C150 690 260 780 400 720 S640 660 820 710"/>
  <path d="M560 120 C640 80 740 130 720 210 C700 290 600 300 560 250 C520 200 500 150 560 120Z"/>
  <path d="M540 100 C640 40 780 110 750 220 C720 320 590 330 535 265 C485 205 470 140 540 100Z"/>
  <path d="M600 150 C650 130 700 160 690 200 C680 240 620 245 600 220 C580 195 575 160 600 150Z"/>
  <path d="M-20 260 C80 230 140 300 90 360 C40 420 -20 400 -20 400"/>
</svg>

<div class="wrap">
  <header>
    <h1><small>小学生が覚えておきたい</small>地図記号クイズ</h1>
    <nav class="tabs" aria-label="表示切り替え">
      <button id="tab-quiz" aria-pressed="true">クイズ</button>
      <button id="tab-list" aria-pressed="false">記号ずかん</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
const S = (d) => `<path class="s" d="${d}"/>`;
function gear(){
  const cx=50, cy=50, rO=36, rI=27, n=8, step=Math.PI*2/n, w=step*0.22;
  const P=(r,t)=>`${(cx+r*Math.cos(t)).toFixed(1)} ${(cy+r*Math.sin(t)).toFixed(1)}`;
  let d="";
  for(let i=0;i<n;i++){
    const a=i*step-Math.PI/2;
    d+=(i===0?"M":"L")+P(rI,a-w*1.3)+" L"+P(rO,a-w)+" L"+P(rO,a+w)+" L"+P(rI,a+w*1.3)+" ";
    d+=`A${rI} ${rI} 0 0 1 ${P(rI,a+step-w*1.3)} `;
  }
  return `<path class="s" d="${d}Z"/><circle class="s" cx="50" cy="50" r="10"/>`;
}
function rays(){
  let d="";
  for(let i=0;i<8;i++){const t=i*Math.PI/4; d+=`M${(50+20*Math.cos(t)).toFixed(1)} ${(50+20*Math.sin(t)).toFixed(1)} L${(50+36*Math.cos(t)).toFixed(1)} ${(50+36*Math.sin(t)).toFixed(1)} `;}
  return `<circle class="f" cx="50" cy="50" r="9"/>${S(d)}`;
}

const KIGO = [
  {id:"shi",   name:"市役所", yomi:"しやくしょ", g:'<circle class="s" cx="50" cy="50" r="32"/><circle class="s" cx="50" cy="50" r="19"/>', note:"二重丸の記号。東京23区の区役所もこの記号です。", pair:"cho"},
  {id:"cho",   name:"町・村役場", yomi:"ちょう・そんやくば", g:'<circle class="s" cx="50" cy="50" r="26"/>', note:"丸が一つだけ。市役所の二重丸とまちがえやすいので注意。", pair:"shi"},
  {id:"kei",   name:"警察署", yomi:"けいさつしょ", g:'<circle class="s" cx="50" cy="50" r="32"/>'+S("M37 37 L63 63 M63 37 L37 63"), note:"交番の「×」を丸でかこんだ形です。", pair:"kob"},
  {id:"kob",   name:"交番", yomi:"こうばん", g:S("M30 30 L70 70 M70 30 L30 70"), note:"警察官が持つ警棒（けいぼう）を2本交差させた形。", pair:"kei"},
  {id:"sho",   name:"消防署", yomi:"しょうぼうしょ", g:S("M50 84 V50 M28 22 Q28 50 50 50 Q72 50 72 22"), note:"昔の火消しが使った道具「さすまた」の形。"},
  {id:"yu",    name:"郵便局", yomi:"ゆうびんきょく", g:'<circle class="s" cx="50" cy="50" r="32"/>'+S("M35 37 H65 M35 49 H65 M50 49 V70"), note:"昔、郵便をあつかった逓信省（ていしんしょう）の「テ」がもと。"},
  {id:"gak",   name:"小・中学校", yomi:"しょう・ちゅうがっこう", g:'<text x="50" y="52" font-size="64" text-anchor="middle" dominant-baseline="central">文</text>', note:"「文」の字で、勉強する場所をあらわします。", pair:"kou"},
  {id:"kou",   name:"高等学校", yomi:"こうとうがっこう", g:'<circle class="s" cx="50" cy="50" r="34"/><text x="50" y="52" font-size="40" text-anchor="middle" dominant-baseline="central">文</text>', note:"「文」を丸でかこむと高等学校になります。", pair:"gak"},
  {id:"byo",   name:"病院", yomi:"びょういん", g:'<circle class="s" cx="50" cy="50" r="32"/>'+S("M50 32 V68 M32 50 H68"), note:"昔の陸軍の衛生隊（えいせいたい）のしるしがもとになっています。"},
  {id:"jin",   name:"神社", yomi:"じんじゃ", g:S("M16 28 Q50 38 84 28 M26 44 H74 M35 33 V82 M65 33 V82"), note:"神社の入り口に立っている「鳥居（とりい）」の形。", pair:"ji"},
  {id:"ji",    name:"寺院", yomi:"じいん", g:'<text x="50" y="52" font-size="66" text-anchor="middle" dominant-baseline="central">卍</text>', note:"仏教のしるし「卍（まんじ）」の形。", pair:"jin"},
  {id:"tos",   name:"図書館", yomi:"としょかん", g:S("M18 34 Q34 26 50 34 Q66 26 82 34 V72 Q66 64 50 72 Q34 64 18 72 Z M50 34 V72"), note:"本を開いたようすをあらわした形。", pair:"hak"},
  {id:"hak",   name:"博物館・美術館", yomi:"はくぶつかん・びじゅつかん", g:S("M20 42 L50 22 L80 42 Z M20 78 H80 M31 48 V72 M50 48 V72 M69 48 V72"), note:"博物館や美術館の建物の形。", pair:"rou"},
  {id:"rou",   name:"老人ホーム", yomi:"ろうじん", g:S("M20 80 V46 L50 22 L80 46 V80 Z M56 72 V46 Q56 38 48 38 Q42 38 42 44"), note:"建物とつえの形。全国の小・中学生のアイデアから生まれた記号です。", pair:"hak"},
  {id:"kojo",  name:"工場", yomi:"こうじょう", g:gear(), note:"機械の歯車（はぐるま）の形。"},
  {id:"on",    name:"温泉", yomi:"おんせん", g:S("M24 58 Q24 82 50 82 Q76 82 76 58 M38 52 Q32 44 38 36 Q44 28 38 20 M50 52 Q44 44 50 36 Q56 28 50 20 M62 52 Q56 44 62 36 Q68 28 62 20"), note:"湯ぶねから湯気が立ちのぼる形。"},
  {id:"tou",   name:"灯台", yomi:"とうだい", g:rays(), note:"光が四方八方に広がるようすをあらわした形。"},
  {id:"ta",    name:"田", yomi:"た", g:S("M38 32 V68 M62 32 V68"), note:"稲をかりとったあとの切り株の形。", pair:"hata"},
  {id:"hata",  name:"畑", yomi:"はたけ", g:S("M50 80 V52 M50 52 Q26 52 24 28 M50 52 Q74 52 76 28"), note:"植物の芽が出た「ふたば」の形。", pair:"ta"},
  {id:"ka",    name:"果樹園", yomi:"かじゅえん", g:'<circle class="s" cx="50" cy="58" r="22"/>'+S("M50 36 Q50 24 60 18"), note:"りんごやなしなどの実を横から見た形。", pair:"kou-ju"},
  {id:"cha",   name:"茶畑", yomi:"ちゃばたけ", g:'<circle class="s" cx="50" cy="30" r="12"/><circle class="s" cx="30" cy="66" r="12"/><circle class="s" cx="70" cy="66" r="12"/>', note:"お茶の実を半分に切った形。"},
  {id:"kou-ju", name:"広葉樹林", yomi:"こうようじゅりん", g:'<ellipse class="s" cx="50" cy="42" rx="24" ry="20"/>'+S("M50 62 V84"), note:"さくらやけやきなど、葉の広い木を横から見た形。", pair:"shin"},
  {id:"shin",  name:"針葉樹林", yomi:"しんようじゅりん", g:S("M26 60 L50 20 L74 60 M50 34 V84"), note:"すぎやまつなど、葉が針のように細い木を横から見た形。", pair:"kou-ju"},
  {id:"hi",    name:"自然災害伝承碑", yomi:"しぜんさいがいでんしょうひ", g:S("M36 76 V36 L50 22 L64 36 V76 M24 76 H76 M50 38 V66"), note:"2019年にできた新しい記号。昔の災害を伝える石碑の場所をしめします。", pair:"hak"},
];
const byId = Object.fromEntries(KIGO.map(k=>[k.id,k]));
const svg = (k, cls="sym") => `<svg class="sym ${cls}" viewBox="0 0 100 100" role="img" aria-label="地図記号">${k.g}</svg>`;

const QN = 10;
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let mode = store.get("chizu-mode") || "sym2name";
let view = "quiz";
let st = null;

const app = document.getElementById("app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };

function makeQuestions(){
  return shuffle(KIGO).slice(0,QN).map(k=>{
    const others = KIGO.filter(o=>o.id!==k.id);
    let picks = [];
    if(k.pair && byId[k.pair]) picks.push(byId[k.pair]);
    shuffle(others).forEach(o=>{ if(picks.length<3 && !picks.includes(o)) picks.push(o); });
    return { ans:k, opts: shuffle([k,...picks]) };
  });
}
function start(){ st = { qs: makeQuestions(), i:0, score:0, answered:null, misses:[] }; render(); }

function modeButtons(){
  return `<div class="modes" role="group" aria-label="クイズの種類">
    <button class="mode" id="m1" aria-pressed="${mode==='sym2name'}">記号 → 名前<span>記号を見て名前をえらぶ</span></button>
    <button class="mode" id="m2" aria-pressed="${mode==='name2sym'}">名前 → 記号<span>名前を見て記号をえらぶ</span></button>
  </div>`;
}

function render(){
  document.getElementById("tab-quiz").setAttribute("aria-pressed", view==="quiz");
  document.getElementById("tab-list").setAttribute("aria-pressed", view==="list");
  if(view==="list") return renderList();
  if(st.i>=QN) return renderResult();
  const q = st.qs[st.i], a = st.answered;
  const prompt = mode==="sym2name"
    ? `<div class="qlabel">この地図記号は何をあらわしている？</div><div class="qsym">${svg(q.ans)}</div>`
    : `<div class="qlabel">この地図記号はどれ？</div><div class="qname">${q.ans.name}</div><div class="yomi">${q.ans.yomi}</div>`;
  const opts = q.opts.map((o,idx)=>{
    let cls = "choice" + (mode==="name2sym"?" sym-choice":"");
    if(a){ if(o.id===q.ans.id) cls+=" correct"; else if(o.id===a) cls+=" wrong"; else cls+=" dim"; }
    const inner = mode==="sym2name" ? `${o.name}<small>${o.yomi}</small>` : `<span class="mini">${svg(o)}</span>`;
    return `<button class="${cls}" id="opt${idx}" data-id="${o.id}" ${a?"disabled":""} aria-label="${mode==='sym2name'?o.name:'選択肢'+(idx+1)}">${inner}</button>`;
  }).join("");
  let fb = "";
  if(a){
    const ok = a===q.ans.id;
    fb = `<div class="feedback ${ok?'ok':'ng'}" role="status"><div class="fsym">${svg(q.ans)}</div><div class="ftext">
      <b>${ok?"せいかい！":"ざんねん！"} 「${q.ans.name}」</b><p>${q.ans.note}</p></div></div>
      <button class="primary" id="next">${st.i===QN-1?"結果を見る":"つぎの問題へ"}</button>`;
  }
  app.innerHTML = `<div class="wrap" style="max-width:none">${modeButtons()}
    <div class="progress"><span>${st.i+1} / ${QN} 問</span><div class="bar"><i style="width:${(st.i+(a?1:0))/QN*100}%"></i></div><span>${st.score} 点</span></div>
    <section class="stage">${prompt}</section>
    <div class="choices">${opts}</div>${fb}</div>`;
  bindModes();
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(st.answered) return;
    st.answered = b.dataset.id;
    if(st.answered===q.ans.id) st.score++; else st.misses.push(q.ans);
    render();
    const n=document.getElementById("next"); if(n) n.focus({preventScroll:true});
  });
  const n=document.getElementById("next");
  if(n) n.onclick=()=>{ st.i++; st.answered=null; render(); window.scrollTo({top:0}); };
}

function bindModes(){
  const set = m => { if(m===mode) return; mode=m; store.set("chizu-mode",m); start(); };
  const m1=document.getElementById("m1"), m2=document.getElementById("m2");
  if(m1) m1.onclick=()=>set("sym2name"); if(m2) m2.onclick=()=>set("name2sym");
}

function renderResult(){
  const key="chizu-best-"+mode, prev=+(store.get(key)||0);
  if(st.score>prev) store.set(key,st.score);
  const best=Math.max(prev,st.score);
  const rank = st.score===10?"地図記号マスター！":st.score>=8?"あと少しで全問正解！":st.score>=5?"いい調子。まちがえた記号を見直そう":"ずかんで形と由来をたしかめてから、もう一度！";
  const miss = st.misses.length ? `<div class="miss"><h3>まちがえた記号</h3><div class="misslist">${st.misses.map(k=>`<span class="chip"><span class="csym">${svg(k)}</span>${k.name}</span>`).join("")}</div></div>` : "";
  app.innerHTML = `<div class="wrap" style="max-width:none">${modeButtons()}
    <section class="stage result"><div class="qlabel">けっか</div>
      <div class="score">${st.score}<span> / ${QN}</span></div>
      <div class="rank">${rank}</div><div class="best">このモードのベスト：${best} / ${QN}</div>${miss}</section>
    <button class="primary" id="again">もう一度チャレンジ</button></div>`;
  bindModes();
  document.getElementById("again").onclick=start;
}

function renderList(){
  app.innerHTML = `<div class="wrap" style="max-width:none"><p class="intro">形の由来（もとになったもの）を知ると覚えやすくなります。全${KIGO.length}種類。</p>
