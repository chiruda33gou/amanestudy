<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>文の組み立てドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one column like a 国語ノート page — guide strip, ruled sentence sheet with tiles + arrows, action panel, progress dots */
:root{
  --paper:#eef3f1; --sheet:#ffffff; --ink:#1c2a29; --sub:#5a6a68; --rule:#d3dfdb; --chip:#e6edeb;
  --s:#2a5fd0; --s-bg:#e7eefc; --p:#cf3d27; --p-bg:#fcebe7; --m:#1d8656; --m-bg:#e4f4ec;
  --accent:#2f3c88; --accent-fg:#ffffff; --ng:#c4322a;
  --f-text:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141b1b; --sheet:#1d2626; --ink:#e8efed; --sub:#9fb0ad; --rule:#2f3c3b; --chip:#2a3534;
  --s:#7ea6ff; --s-bg:#1f2b45; --p:#ff8a72; --p-bg:#3d2420; --m:#5fd19b; --m-bg:#183427;
  --accent:#9aa8ff; --accent-fg:#141b1b; --ng:#ff7b70; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#141b1b; --sheet:#1d2626; --ink:#e8efed; --sub:#9fb0ad; --rule:#2f3c3b; --chip:#2a3534;
  --s:#7ea6ff; --s-bg:#1f2b45; --p:#ff8a72; --p-bg:#3d2420; --m:#5fd19b; --m-bg:#183427;
  --accent:#9aa8ff; --accent-fg:#141b1b; --ng:#ff7b70; color-scheme:dark;}

body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6}
.page{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-text);font-weight:600;font-size:1.7rem;margin:0;text-wrap:balance;letter-spacing:.04em}
.grade{font-size:.8rem;color:var(--sub);letter-spacing:.1em}
.qno{font-size:.95rem;color:var(--sub);font-variant-numeric:tabular-nums}

.guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g{background:var(--sheet);border-radius:10px;padding:10px 12px;min-width:0}
.g b{display:block;font-size:1rem}
.g span{font-size:.8rem;color:var(--sub);line-height:1.45;display:block}
.g.s b{color:var(--s)} .g.p b{color:var(--p)} .g.m b{color:var(--m)}
.mark{font-family:var(--f-text);font-size:.95rem;text-underline-offset:5px;text-decoration-thickness:2px}
.g.s .mark{text-decoration:underline solid var(--s)}
.g.p .mark{text-decoration:underline double var(--p)}
.g.m .mark{text-decoration:underline wavy var(--m)}
@media (max-width:520px){.guide{grid-template-columns:1fr}.g{display:flex;gap:10px;align-items:baseline}.g b{flex:none}}

.sheet{background:var(--sheet);border-radius:14px;padding:18px 0 8px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);}
.scroll{overflow-x:auto;padding:0 16px}
.row{position:relative;display:flex;gap:6px;width:max-content;min-width:100%;justify-content:center;padding:4px 2px 70px}
.row svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

.tile{appearance:none;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px 10px;border-radius:10px;font:inherit;position:relative;z-index:1}
.tile:hover{background:var(--chip)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .chip{font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--sub);min-width:3.2em;text-align:center}
.tile .w{font-family:var(--f-text);font-weight:600;font-size:1.65rem;line-height:1.3;white-space:nowrap;text-underline-offset:8px;text-decoration-thickness:2.5px}
.tile.r-s .chip{background:var(--s-bg);color:var(--s)} .tile.r-s .w{text-decoration:underline solid var(--s)}
.tile.r-p .chip{background:var(--p-bg);color:var(--p)} .tile.r-p .w{text-decoration:underline double var(--p)}
.tile.r-m .chip{background:var(--m-bg);color:var(--m)} .tile.r-m .w{text-decoration:underline wavy var(--m)}
.tile.sel{border-color:var(--accent);background:var(--chip)}
.tile.cand{border-style:dashed;border-color:var(--sub)}
.tile.cand.r-s,.tile.cand.r-p{border-color:var(--accent);border-style:dashed}
.tile.lock{cursor:default;opacity:.6}
.tile.lock:hover{background:transparent}
.steps{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:6px}
.st{appearance:none;border:2px solid var(--rule);background:var(--sheet);color:var(--sub);font:inherit;font-weight:700;font-size:.85rem;
  padding:6px 8px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;min-width:0;text-align:center;line-height:1.3}
.st:disabled{cursor:not-allowed;opacity:.5}
.st:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.st .num{flex:none;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:.8rem}
.st.done.s{color:var(--s);border-color:var(--s-bg);background:var(--s-bg)} .st.done.p{color:var(--p);border-color:var(--p-bg);background:var(--p-bg)}
.st.done .num{background:var(--sheet)}
.st.now.s{background:var(--s);border-color:var(--s);color:var(--sheet)}
.st.now.p{background:var(--p);border-color:var(--p);color:var(--sheet)}
.st.now.m{background:var(--m);border-color:var(--m);color:var(--sheet)}
.st.now .num{background:var(--sheet);color:var(--ink)}
.now-banner{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border-left:6px solid}
.now-banner .lead{font-size:.9rem;font-weight:700}
.now-banner strong{font-family:var(--f-text);font-size:2rem;line-height:1.2;font-weight:600}
.now-banner .cnt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.now-banner.s{background:var(--s-bg);color:var(--s);border-color:var(--s)}
.now-banner.p{background:var(--p-bg);color:var(--p);border-color:var(--p)}
.now-banner.m{background:var(--m-bg);color:var(--m);border-color:var(--m)}
.sheet.at-s{box-shadow:0 0 0 3px var(--s)} .sheet.at-p{box-shadow:0 0 0 3px var(--p)} .sheet.at-m{box-shadow:0 0 0 3px var(--m)}
.sheet.at-s .tile:not(.lock):hover{background:var(--s-bg)} .sheet.at-p .tile:not(.lock):hover{background:var(--p-bg)} .sheet.at-m .tile:not(.lock):hover{background:var(--m-bg)}
@media (max-width:520px){.steps{grid-template-columns:1fr 1fr}.st.m{grid-column:1/-1}}
.k-s{color:var(--s)} .k-p{color:var(--p)} .k-m{color:var(--m)}
.tile .fix{font-size:.72rem;font-weight:700;color:var(--ng);white-space:nowrap;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px}
.tile .res{position:absolute;top:-6px;right:-4px;font-size:.9rem;font-weight:700}
.tile.ok .res{color:var(--m)} .tile.ng .res{color:var(--ng)}
.tile.ng{border-color:var(--ng);border-style:solid}

.panel{background:var(--sheet);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:128px}
.prompt{font-size:1.05rem;font-weight:700;margin:0}
.prompt q{font-family:var(--f-text);quotes:"「" "」"}
.help{font-size:.88rem;color:var(--sub);margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{appearance:none;border:2px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-weight:700;font-size:1rem;
  padding:10px 18px;border-radius:12px;cursor:pointer;min-height:48px}
button.b:hover{border-color:var(--sub)}
button.b:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.b.role-s{color:var(--s);border-color:var(--s);background:var(--s-bg)}
button.b.role-p{color:var(--p);border-color:var(--p);background:var(--p-bg)}
button.b.role-m{color:var(--m);border-color:var(--m);background:var(--m-bg)}
button.b.on{box-shadow:inset 0 0 0 2px currentColor}
button.b.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.b.quiet{border-color:transparent;color:var(--sub);font-weight:500}
button.b:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.verdict{font-family:var(--f-text);font-weight:600;font-size:1.5rem;margin:0}
.verdict.ok{color:var(--m)} .verdict.ng{color:var(--ng)}

.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dot{appearance:none;border:2px solid var(--rule);background:var(--sheet);color:var(--sub);width:34px;height:34px;border-radius:50%;
  font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.dot.ok{background:var(--m);border-color:var(--m);color:var(--sheet)}
.dot.ng{background:var(--p-bg);border-color:var(--ng);color:var(--ng)}
.dot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.end{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 0}
.end .big{font-family:var(--f-text);font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.tile{transition:background .15s,border-color .15s}}
</style>

<div class="page">
  <header>
    <div>
      <div class="grade">小学4年 ・ 国語 ・ 文の組み立て</div>
      <h1>主語・述語・修飾語</h1>
    </div>
    <div class="qno" id="qno"></div>
  </header>

  <div class="sheet"><div class="scroll"><div class="row" id="row"></div></div></div>
  <div class="panel" id="panel"></div>
  <nav class="dots" id="dots" aria-label="問題をえらぶ"></nav>
</div>

<script>
// r: s=主語 p=述語 m=修飾語 / t: 修飾語がかかる文節の番号
const Q=[
 {w:["白い","犬が","走る。"],r:"msp",t:{0:1}},
 {w:["弟が","公園で","遊ぶ。"],r:"smp",t:{1:2}},
 {w:["赤い","花が","きれいに","さいた。"],r:"msmp",t:{0:1,2:3}},
 {w:["わたしの","父は","医者です。"],r:"msp",t:{0:1}},
 {w:["ねこも","日なたで","ねむる。"],r:"smp",t:{1:2}},
 {w:["大きな","船が","ゆっくり","進む。"],r:"msmp",t:{0:1,2:3}},
 {w:["今日の","空は","とても","青い。"],r:"msmp",t:{0:1,2:3}},
 {w:["兄は","図書館で","本を","読んだ。"],r:"smmp",t:{1:3,2:3}},
 {w:["庭の","木が","風で","ゆれる。"],r:"msmp",t:{0:1,2:3}},
 {w:["妹が","母に","手紙を","書いた。"],r:"smmp",t:{1:3,2:3}},
 {w:["わたしは","毎朝","ぎゅうにゅうを","飲みます。"],r:"smmp",t:{1:3,2:3}},
 {w:["きのう","ぼくは","友だちと","川へ","行った。"],r:"msmmp",t:{0:4,2:4,3:4}},
 {w:["二羽の","鳥が","空を","高く","飛んだ。"],r:"msmmp",t:{0:1,2:4,3:4}},
 {w:["冷たい","雨が","ふり、","強い","風が","ふく。"],r:"mspmsp",t:{0:1,3:4}},
 {w:["姉は","ピアノを","ひき、","ぼくは","歌を","歌う。"],r:"smpsmp",t:{1:2,4:5}},
];
const NAME={s:"主語",p:"述語",m:"修飾語"};
const clean=s=>s.replace(/[。、]/g,"");
// step 1=主語 2=述語 3=修飾語とかかり先 / mode "target" = 修飾語のかかり先をえらび中
let qi=0, ans, step=1, sel=null, mode="pick", checked=false;
const results=Array(Q.length).fill(null);
const saved={};

function load(i){
  qi=i; checked=results[i]!==null && saved[i]?true:false;
  ans=saved[i]?saved[i].map(a=>({...a})):Q[i].w.map(()=>({role:null,target:null}));
  clearTimeout(advTimer); step=1; sel=null; mode="pick"; render();
}
function complete(){return ans.every(a=>a.role && (a.role!=="m"||a.target!==null))}
function has(r){return ans.some(a=>a.role===r)}
function correctAt(i){
  const q=Q[i===undefined?qi:i];
  return ans.map((a,j)=>a.role===q.r[j] && (q.r[j]!=="m"||a.target===q.t[j]));
}

function render(){
  const q=Q[qi];
  document.getElementById("qno").textContent=`第${qi+1}問 ／ ${Q.length}問`;
  const row=document.getElementById("row");
  const ok=checked?correctAt():null;
  row.innerHTML="";
  document.querySelector(".sheet").className="sheet"+(checked?"":" at-"+["s","p","m"][step-1]);
  q.w.forEach((w,i)=>{
    const a=ans[i], b=document.createElement("button");
    b.className="tile"+(a.role?" r-"+a.role:"");
    if(!checked){
      if(mode==="target"){ b.classList.add(i===sel?"sel":"cand"); }
      else{
        const usable=step===1||(step===2&&a.role!=="s")||(step===3&&a.role!=="s"&&a.role!=="p");
        if(!usable)b.classList.add("lock");
      }
    }else b.classList.add(ok[i]?"ok":"ng");
    b.dataset.i=i;
    b.setAttribute("aria-label",`${clean(w)}${a.role?"、"+NAME[a.role]:""}`);
    let fix="";
    if(checked&&!ok[i]){
      const rr=q.r[i]; fix=`<span class="fix">→ ${NAME[rr]}${rr==="m"?"（"+clean(q.w[q.t[i]])+"）":""}</span>`;
    }
    b.innerHTML=`<span class="chip">${a.role?NAME[a.role]:"？"}</span><span class="w">${w}</span>${checked?`<span class="res">${ok[i]?"○":"×"}</span>`:""}${fix}`;
    b.onclick=()=>tap(i);
    row.appendChild(b);
  });
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  row.appendChild(svg);
  requestAnimationFrame(()=>drawArrows(svg));
  renderPanel(); renderDots();
}

function drawArrows(svg){
  const row=document.getElementById("row"), q=Q[qi];
  const tiles=[...row.querySelectorAll(".tile")], base=row.getBoundingClientRect();
  const css=getComputedStyle(document.documentElement);
  const col={m:css.getPropertyValue("--m").trim(),ng:css.getPropertyValue("--ng").trim()};
  let out=`<defs>
    <marker id="hm" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L5 10 L10 0 Z" fill="${col.m}"/></marker>
    <marker id="hn" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L5 10 L10 0 Z" fill="${col.ng}"/></marker></defs>`;
  const line=(i,t,kind)=>{
    if(t===null||t===undefined||!tiles[i]||!tiles[t])return;
    const a=tiles[i].getBoundingClientRect(), b=tiles[t].getBoundingClientRect();
    const x1=a.left+a.width/2-base.left, x2=b.left+b.width/2-base.left;
    const y=a.bottom-base.top+2, d=Math.min(18+12*Math.abs(i-t),58);
    const c=kind==="ng"?col.ng:col.m;
    out+=`<path d="M${x1} ${y} C ${x1} ${y+d}, ${x2} ${y+d}, ${x2} ${y+3}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" ${kind==="ng"?'stroke-dasharray="5 5"':""} marker-end="url(#${kind==="ng"?"hn":"hm"})"/>`;
    out+=`<circle cx="${x1}" cy="${y}" r="3.5" fill="${c}"/>`;
  };
  if(!checked){ans.forEach((a,i)=>{if(a.role==="m")line(i,a.target,"m")});}
  else{
    ans.forEach((a,i)=>{if(a.role==="m"&&a.target!==null&&a.target!==q.t[i])line(i,a.target,"ng")});
    [...q.r].forEach((r,i)=>{if(r==="m")line(i,q.t[i],"m")});
  }
  svg.innerHTML=out;
}

const need=r=>[...Q[qi].r].filter(x=>x===r).length;
const count=r=>ans.filter(a=>a.role===r).length;
let advTimer=null;
function autoAdvance(from,r){
  clearTimeout(advTimer);
  if(count(r)!==need(r))return;
  advTimer=setTimeout(()=>{ if(step===from&&!checked&&count(r)===need(r)){step=from+1;mode="pick";sel=null;render();} },550);
}
function tap(i){
  if(checked)return;
  const a=ans[i];
  if(step===1){ a.target=null; a.role=a.role==="s"?null:"s"; render(); autoAdvance(1,"s"); return; }
  else if(step===2){ if(a.role==="s")return; a.target=null; a.role=a.role==="p"?null:"p"; render(); autoAdvance(2,"p"); return; }
  else if(mode==="target"){ if(i===sel)return; ans[sel].target=i; mode="pick"; sel=null; }
  else{
    if(a.role==="s"||a.role==="p")return;
    if(a.role!=="m"){a.role="m";a.target=null;}
    sel=i; mode="target";
  }
  render();
}

function renderPanel(){
  const p=document.getElementById("panel"), q=Q[qi];
  if(checked){
    const ok=correctAt(), wrong=ok.filter(x=>!x).length, last=qi===Q.length-1;
    const allDone=results.every(r=>r!==null);
    p.innerHTML=`<p class="verdict ${wrong?"ng":"ok"}">${wrong?`おしい！ まちがいが ${wrong}こ あるよ`:"せいかい！ よくできました"}</p>
      <p class="help">${wrong?"赤い字が正しい答えです。緑の矢印は、修飾語が正しくかかっている言葉を表しています。":"緑の矢印が、修飾語がくわしくしている言葉です。"}</p>
      <div class="actions"><button class="b quiet" id="retry">もう一度とく</button>
      <button class="b main" id="next">${last||allDone&&nextUnsolved()===null?"けっかを見る":"つぎの問題へ"}</button></div>`;
    p.querySelector("#retry").onclick=()=>{delete saved[qi];results[qi]=null;load(qi)};
    p.querySelector("#next").onclick=()=>{const n=nextUnsolved(); n===null?showEnd():load(n)};
    return;
  }
  const labels=[["s","主語"],["p","述語"],["m","修飾語とかかり先"]];
  const can=k=>k===1||(k===2&&has("s"))||(k===3&&has("s")&&has("p"));
  const bar=`<div class="steps" role="tablist">${labels.map(([r,l],k)=>{
    const n=k+1, st=n===step?" now":n<step?" done":"";
    return `<button class="st ${r}${st}" data-step="${n}" ${can(n)?"":"disabled"} ${n===step?'aria-current="step"':""}><span class="num">${n<step?"✓":n}</span>${l}</button>`;
  }).join("")}</div>`;
  const R=["s","p","m"][step-1];
  let body="", next="";
  if(step===1){
    const n=need("s"), c=count("s");
    body=`<div class="now-banner s"><span class="lead">いま えらぶのは</span><strong>主語</strong><span class="cnt">${c} / ${n}</span></div>
      <p class="prompt">「だれが」「なにが」にあたる言葉をタップしよう</p>
      <p class="help">${n>1?`この文には主語が ${n}つ あるよ。`:""}えらび終わると、自動で述語に進みます。</p>`;
  }else if(step===2){
    const n=need("p"), c=count("p");
    body=`<div class="now-banner p"><span class="lead">いま えらぶのは</span><strong>述語</strong><span class="cnt">${c} / ${n}</span></div>
      <p class="prompt">「どうする」「どんなだ」「なんだ」にあたる言葉をタップしよう</p>
      <p class="help">${n>1?`この文には述語が ${n}つ あるよ。`:""}えらび終わると、自動で修飾語に進みます。</p>`;
  }else if(mode==="target"){
    body=`<div class="now-banner m"><span class="lead">いま えらぶのは</span><strong>かかり先</strong></div>
      <p class="prompt"><q>${clean(q.w[sel])}</q> は、どの言葉を くわしくしている？</p>
      <p class="help">くわしくしている言葉をタップしよう。</p>
      <div class="btns"><button class="b quiet" id="cancel">やめる</button><button class="b quiet" id="unset">修飾語ではない</button></div>`;
  }else{
    const left=ans.filter(a=>!a.role).length;
    body=`<div class="now-banner m"><span class="lead">いま えらぶのは</span><strong>修飾語</strong><span class="cnt">のこり ${left}</span></div>
      <p class="prompt">のこりの言葉から修飾語をタップして、つぎに どの言葉をくわしくしているか タップしよう</p>
      <p class="help">${left?"":"ぜんぶ えらべたね。答え合わせをしよう。矢印をなおすときは、修飾語をもう一度タップしてね。"}</p>`;
    next=`<button class="b main" id="check" ${complete()?"":"disabled"}>答え合わせ</button>`;
  }
  p.innerHTML=bar+body+`<div class="actions"><button class="b quiet" id="clear">ぜんぶ消す</button>${next}</div>`;
  p.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{clearTimeout(advTimer);step=+b.dataset.step;mode="pick";sel=null;render()});
  const on=(id,f)=>{const e=p.querySelector("#"+id); if(e)e.onclick=f;};
  on("cancel",()=>{mode="pick";sel=null;render()});
  on("unset",()=>{ans[sel].role=null;ans[sel].target=null;ans.forEach(a=>{if(a.target===sel)a.target=null});mode="pick";sel=null;render()});
  on("clear",()=>{ans=Q[qi].w.map(()=>({role:null,target:null}));step=1;sel=null;mode="pick";render()});
  on("check",()=>{
    checked=true; results[qi]=correctAt().every(Boolean); saved[qi]=ans.map(a=>({...a})); sel=null; render();
  });
}
function nextUnsolved(){
  for(let k=1;k<=Q.length;k++){const j=(qi+k)%Q.length; if(results[j]===null)return j;}
  return null;
}
function renderDots(){
  const d=document.getElementById("dots"); d.innerHTML="";
  Q.forEach((_,i)=>{
    const b=document.createElement("button");
    b.className="dot"+(i===qi?" cur":"")+(results[i]===true?" ok":results[i]===false?" ng":"");
    b.textContent=i+1; b.setAttribute("aria-label",`第${i+1}問`);
    b.onclick=()=>load(i); d.appendChild(b);
  });
}
function showEnd(){
  const n=results.filter(r=>r===true).length;
  document.getElementById("row").innerHTML="";
  document.getElementById("qno").textContent="けっか";
  const p=document.getElementById("panel");
  p.innerHTML=`<div class="end"><div class="help">${Q.length}問中</div><div class="big">${n}問 せいかい</div>
    <p class="help">${n===Q.length?"ぜんぶ正解！ 文の組み立て名人だね。":"番号の丸をタップすると、まちがえた問題を見直せるよ。"}</p>
    <button class="b main" id="again">はじめから やり直す</button></div>`;
  p.querySelector("#again").onclick=()=>{results.fill(null);for(const k in saved)delete saved[k];load(0)};
  qi=-1; renderDots();
}
addEventListener("resize",()=>{const s=document.querySelector("#row svg"); if(s)drawArrows(s)});
load(0);
</script>

</body></html>
