<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>漢字のなぞり書き</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EFE9DA;
    --card: #FBF8F0;
    --ink: #2B2A28;
    --ink-soft: rgba(43,42,40,0.16);
    --ink-mid: rgba(43,42,40,0.45);
    --vermillion: #C1361B;
    --vermillion-soft: rgba(193,54,27,0.4);
    --ai-blue: #2E5C8A;
    --shadow: rgba(43,42,40,0.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(193,54,27,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(46,92,138,0.05), transparent 40%);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    -webkit-user-select:none;
    user-select:none;
    overscroll-behavior:none;
  }

  .app-shell{
    max-width:440px;
    margin:0 auto;
    padding:32px 20px 40px;
  }

  header{
    text-align:center;
    margin-bottom:20px;
  }
  header h1{
    margin:0 0 6px;
    font-size:24px;
    font-weight:900;
    letter-spacing:.02em;
  }
  header p{
    margin:0;
    font-size:14px;
    color:var(--ink-mid);
  }

  .entry-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
  }
  .entry-chip{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid rgba(43,42,40,0.18);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  .entry-chip:hover{ border-color:rgba(43,42,40,0.35); }
  .entry-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .entry-chip.mastered::after{ content:" \2713"; color:var(--vermillion); }
  .entry-chip.active.mastered::after{ color:#fff; }
  .entry-chip:focus-visible{ outline:2px solid var(--ai-blue); outline-offset:2px; }
  .entry-chip ruby{ ruby-align:center; }
  .entry-chip rt{ font-size:8px; color:var(--ink-mid); font-weight:700; }
  .entry-chip.active rt{ color:rgba(255,255,255,0.75); }

  .practice-card{
    background:var(--card);
    border-radius:28px;
    padding:20px 20px 24px;
    box-shadow: 0 18px 40px -20px var(--shadow), 0 2px 0 rgba(43,42,40,0.05);
    border:1px solid rgba(43,42,40,0.06);
    position:relative;
  }

  .word-header{
    text-align:center;
    margin-bottom:14px;
  }
  .word-header ruby{
    font-family:'Shippori Mincho', serif;
    font-size:30px;
    font-weight:700;
    color:var(--ink);
    ruby-align:center;
  }
  .word-header rt{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--vermillion);
    letter-spacing:.02em;
  }
  .word-header .okuri{
    font-family:'Shippori Mincho', serif;
    font-size:30px;
    font-weight:700;
    color:var(--ink);
  }

  .char-progress-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .char-progress-row.hidden{ display:none; }
  .char-chip{
    font-family:'Shippori Mincho',serif;
    font-size:22px;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    border:2px solid var(--ink-soft);
    color:var(--ink-mid);
    transition:all .2s ease;
  }
  .char-chip.done{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .char-chip.active{ border-color:var(--vermillion); color:var(--ink); }

  .square-wrap{
    position:relative;
    border-radius:18px;
    overflow:hidden;
  }

  svg#board{
    display:block;
    width:100%;
    height:auto;
    touch-action:none;
    cursor:crosshair;
  }

  .grid-border{ fill:var(--card); stroke:rgba(43,42,40,0.16); stroke-width:1; }
  .grid-cross{ stroke:rgba(43,42,40,0.16); stroke-width:0.6; stroke-dasharray:2.4 2.4; }
  .grid-diag{ stroke:rgba(43,42,40,0.09); stroke-width:0.6; stroke-dasharray:1.8 3; }

  .guide-stroke{
    fill:none;
    stroke:var(--ink-soft);
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .guide-stroke.active{
    stroke:var(--vermillion-soft);
    stroke-dasharray:5 4;
    marker-end:url(#arrow);
    animation:dashmove 1s linear infinite;
  }
  .guide-stroke.done{ opacity:0; }

  .written-stroke{
    fill:none;
    stroke:var(--ink);
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0;
    transition:opacity .25s ease;
  }
  .written-stroke.done{ opacity:1; }

  #draw-path{
    fill:none;
    stroke:var(--ai-blue);
    stroke-width:5;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:opacity .4s ease, stroke .2s ease;
  }
  #draw-path.fail{ stroke:var(--vermillion); opacity:.55; }

  .marker-start{ fill:var(--vermillion); }
  .marker-pulse{
    fill:none;
    stroke:var(--vermillion);
    stroke-width:1.1;
    animation:pulse 1.4s ease-out infinite;
  }
  .marker-num{
    fill:#fff;
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:700;
    font-size:5px;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
  }

  @keyframes pulse{ 0%{ r:5; stroke-opacity:.9; } 100%{ r:11; stroke-opacity:0; } }
  @keyframes dashmove{ to{ stroke-dashoffset:-18; } }

  .progress-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
  }
  .dot{
    width:11px;
    height:11px;
    border-radius:50%;
    border:2px solid var(--ink-soft);
    background:transparent;
    transition:all .2s ease;
  }
  .dot.done{ background:var(--ink); border-color:var(--ink); }
  .dot.current{ border-color:var(--vermillion); transform:scale(1.25); }

  .hint-text{
    text-align:center;
    margin-top:12px;
    font-size:15px;
    font-weight:500;
    min-height:20px;
    color:var(--ink);
  }

  .controls{
    display:flex;
    justify-content:center;
    margin-top:20px;
  }
  button.reset-btn{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    background:transparent;
    border:1.5px solid rgba(43,42,40,0.28);
    padding:10px 26px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button.reset-btn:hover{ background:rgba(43,42,40,0.06); }
  button.reset-btn:active{ transform:scale(.96); }
  button.reset-btn:focus-visible{ outline:2px solid var(--ai-blue); outline-offset:2px; }

  .info-card{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:16px;
    background:var(--card);
    border-radius:24px;
    padding:16px 20px;
    box-shadow: 0 14px 30px -22px var(--shadow);
    border:1px solid rgba(43,42,40,0.06);
  }
  .info-glyph{
    font-family:'Shippori Mincho', serif;
    font-size:52px;
    font-weight:700;
    line-height:1;
    color:var(--ink);
    flex-shrink:0;
  }
  .info-glyph.two-char{ font-size:34px; letter-spacing:-1px; }
  .info-lines{ font-size:13px; color:var(--ink-mid); line-height:1.9; }
  .info-lines b{ color:var(--ink); font-weight:700; }

  .credit{
    text-align:center;
    margin-top:18px;
    font-size:11px;
    color:var(--ink-mid);
  }
  .credit a{ color:var(--ink-mid); }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:rgba(251,248,240,0.9);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    border-radius:18px;
    text-align:center;
    padding:0 16px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .stamp{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid var(--vermillion);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--vermillion);
    font-family:'Shippori Mincho', serif;
    font-size:30px;
    font-weight:700;
    transform:rotate(-8deg) scale(0);
    box-shadow:0 0 0 4px rgba(193,54,27,0.12);
  }
  .overlay.show .stamp{ animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stampIn{
    0%{ transform:rotate(-8deg) scale(1.8); opacity:0; }
    60%{ transform:rotate(-8deg) scale(.92); opacity:1; }
    100%{ transform:rotate(-8deg) scale(1); opacity:1; }
  }

  .overlay p{
    margin:0;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }

  .overlay-word ruby{
    font-family:'Shippori Mincho', serif;
    font-size:44px;
    font-weight:700;
    color:var(--ink);
    ruby-align:center;
  }
  .overlay-word rt{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:18px;
    font-weight:800;
    color:var(--vermillion);
    letter-spacing:.02em;
  }
  .overlay-word .okuri{
    font-family:'Shippori Mincho', serif;
    font-size:44px;
    font-weight:700;
    color:var(--ink);
  }

  @media (prefers-reduced-motion: reduce){
    .guide-stroke.active, .marker-pulse, .overlay.show .stamp{ animation:none; }
  }
</style>
</head>

<div class="app-shell">
  <header>
    <h1>漢字のなぞり書き</h1>
    <p>指でなぞって、書き順を覚えよう</p>
  </header>

  <div class="entry-row" id="entry-row"></div>

  <div class="practice-card">
    <div class="word-header" id="word-header"></div>
    <div class="char-progress-row" id="char-row"></div>

    <div class="square-wrap">
      <svg id="board" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="var(--vermillion-soft)"></path>
          </marker>
        </defs>

        <rect x="2" y="2" width="105" height="105" rx="6" class="grid-border"></rect>
        <line x1="54.5" y1="2" x2="54.5" y2="107" class="grid-cross"></line>
        <line x1="2" y1="54.5" x2="107" y2="54.5" class="grid-cross"></line>
        <line x1="2" y1="2" x2="107" y2="107" class="grid-diag"></line>
        <line x1="107" y1="2" x2="2" y2="107" class="grid-diag"></line>

        <g id="guide-layer"></g>
        <g id="written-layer"></g>
        <g id="marker-layer"></g>
        <path id="draw-path"></path>
      </svg>

      <div class="overlay" id="overlay">
        <div class="overlay-word" id="overlay-word"></div>
        <div class="stamp">できた</div>
        <p id="overlay-msg">よくできました！</p>
        <button class="reset-btn" id="overlay-reset">もう一度書く</button>
      </div>
    </div>

    <div class="progress-row" id="progress-row"></div>
    <div class="hint-text" id="hint-text"></div>

    <div class="controls">
      <button class="reset-btn" id="reset-btn">はじめから</button>
    </div>
  </div>

  <div class="info-card">
    <div class="info-glyph" id="info-glyph">正</div>
    <div class="info-lines" id="info-lines"></div>
  </div>

  <p class="credit">字形データ：<a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a>（CC BY-SA 3.0）</p>
</div>

  // Base kvg:type code -> friendly stroke description, used to build hints.
  const TYPE_HINTS = {
    "\u31c0": "\u53f3\u4e0a\u306b\u306f\u306d\u308b\u7dda",
    "\u31c1": "\u66f2\u304c\u3063\u3066\u306f\u306d\u308b\u7dda",

    "\u31c7": "\u4f55\u5ea6\u3082\u66f2\u304c\u308b\u6a2a\u7dda",
    "\u31cb": "\u66f2\u304c\u308a\u304f\u306d\u3063\u305f\u7dda",
    "\u31cf": "\u53f3\u3078\u306f\u3089\u3046\u7dda",
    "\u31d0": "\u6a2a\u7dda",
    "\u31d1": "\u7e26\u7dda",
    "\u31d2": "\u5de6\u3078\u306f\u3089\u3046\u7dda",

    "\u31d5": "\u6a2a\u304b\u3089\u4e0b\u306b\u66f2\u304c\u308b\u7dda",
    "\u31da": "\u7e26\u304b\u3089\u66f2\u304c\u308b\u7dda",
    "\u31dc": "\u66f2\u304c\u3063\u3066\u306f\u306d\u308b\u7dda",
    "\u31df": "\u7e26\u304b\u3089\u5de6\u4e0b\u3078\u306f\u3089\u3046\u7dda"
  };
  TYPE_HINTS["\u31d4/\u31cf"] = "\u70b9\u3001\u307e\u305f\u306f\u53f3\u306f\u3089\u3044";

  function hintFor(type, index){
    const base = (type || "").replace(/[a-z]+$/,'');
    const desc = TYPE_HINTS[base] || "\u7dda";
    return (index + 1) + "\u753b\u76ee\uff1a" + desc + "\u3092\u306a\u305e\u308d\u3046";
  }

  function currentEntry(){ return ENTRIES[entryIndex]; }

  // Furigana helper: puts the word's reading over the kanji portion only,
  // leaving any trailing hiragana okurigana (e.g. \u3050 in \u904e\u304e\u3066) shown plain.
  function isHiragana(ch){ return ch >= "\u3040" && ch <= "\u309f"; }

  function splitFurigana(entry){
    const chars = entry.chars;
    let kanjiCount = chars.length;
    for (let i = 0; i < chars.length; i++){
      if (isHiragana(chars[i])){ kanjiCount = i; break; }
    }
    const kanjiPart = chars.slice(0, kanjiCount).join('');
    const okurigana = chars.slice(kanjiCount).join('');
    let furigana = entry.reading || '';
    if (okurigana && furigana.endsWith(okurigana)){
      furigana = furigana.slice(0, furigana.length - okurigana.length);
    }
    return { kanjiPart, okurigana, furigana };
  }

  function rubyHTML(entry){
    const { kanjiPart, okurigana, furigana } = splitFurigana(entry);
    const kp = kanjiPart || entry.label;
    const rt = furigana ? ('<rt>' + furigana + '</rt>') : '';
    const ok = okurigana ? ('<span class="okuri">' + okurigana + '</span>') : '';
    return '<ruby>' + kp + rt + '</ruby>' + ok;
  }

  function updateWordHeader(){
    wordHeader.innerHTML = rubyHTML(currentEntry());
  }

  function buildEntrySelector(){
    entryRow.innerHTML = '';
    ENTRIES.forEach((e,i)=>{
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'entry-chip'
        + (i === entryIndex ? ' active' : '')
        + (masteredEntries.has(e.id) ? ' mastered' : '');
      chip.innerHTML = rubyHTML(e);
      chip.addEventListener('click', ()=> selectEntry(i));
      entryRow.appendChild(chip);
    });
  }

  function buildCharRow(){
    const chars = currentEntry().chars;
    charRow.innerHTML = '';
    if (chars.length < 2){ charRow.classList.add('hidden'); return; }
    charRow.classList.remove('hidden');
    chars.forEach((c,i)=>{
      const chip = document.createElement('span');
      const done = i < charIndex || (i === charIndex && completedAll);
      chip.className = 'char-chip'
        + (done ? ' done' : '')
        + (i === charIndex && !completedAll ? ' active' : '');
      chip.textContent = c;
      charRow.appendChild(chip);
    });
  }

  function updateInfoCard(){
    const entry = currentEntry();
    infoGlyph.textContent = entry.label;
    infoGlyph.classList.toggle('two-char', entry.chars.length > 1);
    if (entry.chars.length === 1){
      const d = CHAR_DATA[entry.chars[0]];
      infoLines.innerHTML =
        '<div><b>\u97f3\u8aad\u307f</b>\u3000' + d.onyomi + '</div>' +
        '<div><b>\u8a13\u8aad\u307f</b>\u3000' + d.kunyomi + '</div>' +
        '<div><b>\u610f\u5473</b>\u3000' + d.meaning + '</div>';
    } else {
      infoLines.innerHTML =
        '<div><b>\u8aad\u307f\u65b9</b>\u3000' + entry.reading + '</div>' +
        '<div><b>\u610f\u5473</b>\u3000' + entry.meaning + '</div>';
    }
  }

  function buildStrokes(){
    const strokes = currentStrokes();
    totalStrokes = strokes.length;
    guideLayer.innerHTML = '';
    writtenLayer.innerHTML = '';
    markerLayer.innerHTML = '';
    progressRow.innerHTML = '';

    strokes.forEach((s, i)=>{
      const guide = document.createElementNS(svgNS, 'path');
      guide.setAttribute('d', s.d);
      guide.setAttribute('class', 'guide-stroke');
      guideLayer.appendChild(guide);

      // Measure the real path geometry (bezier-accurate) so the start
      // marker and the "did they finish near the end" check line up with
      // the authentic stroke shape rather than a straight-line guess.
      const len = guide.getTotalLength();
      const start = guide.getPointAtLength(0);
      const end = guide.getPointAtLength(len);
      s._start = { x: start.x, y: start.y };
      s._end = { x: end.x, y: end.y };

      const written = document.createElementNS(svgNS, 'path');
      written.setAttribute('d', s.d);
      written.setAttribute('class', 'written-stroke');
      writtenLayer.appendChild(written);

      const g = document.createElementNS(svgNS, 'g');
      g.setAttribute('class', 'stroke-marker-group');

      const pulse = document.createElementNS(svgNS, 'circle');
      pulse.setAttribute('cx', s._start.x); pulse.setAttribute('cy', s._start.y); pulse.setAttribute('r', 5);
      pulse.setAttribute('class', 'marker-pulse');

      const startDot = document.createElementNS(svgNS, 'circle');
      startDot.setAttribute('cx', s._start.x); startDot.setAttribute('cy', s._start.y); startDot.setAttribute('r', 5);
      startDot.setAttribute('class', 'marker-start');

      const num = document.createElementNS(svgNS, 'text');
      num.setAttribute('x', s._start.x); num.setAttribute('y', s._start.y);
      num.setAttribute('class', 'marker-num');
      num.textContent = i + 1;

      g.appendChild(pulse); g.appendChild(startDot); g.appendChild(num);
      markerLayer.appendChild(g);

      const dot = document.createElement('span');
      dot.className = 'dot';
      progressRow.appendChild(dot);
    });

    dotsEls = [...progressRow.children];
  }

  function renderState(){
    const strokes = currentStrokes();
    const guideEls = guideLayer.querySelectorAll('.guide-stroke');
    const writtenEls = writtenLayer.querySelectorAll('.written-stroke');
    const markerGroups = markerLayer.querySelectorAll('.stroke-marker-group');

    guideEls.forEach((el, i)=>{
      el.classList.toggle('active', i === strokeIndex && !completedAll);
      el.classList.toggle('done', i < strokeIndex);
    });
    writtenEls.forEach((el, i)=> el.classList.toggle('done', i < strokeIndex));
    markerGroups.forEach((el, i)=>{
      el.style.display = (i === strokeIndex && !completedAll) ? '' : 'none';
    });
    dotsEls.forEach((d, i)=>{
      d.classList.toggle('done', i < strokeIndex);
      d.classList.toggle('current', i === strokeIndex && !completedAll);
    });

    if (!completedAll){
      hintText.textContent = hintFor(strokes[strokeIndex].type, strokeIndex);
    }
  }

  function svgPoint(evt){
    const rect = board.getBoundingClientRect();
    const scaleX = 109 / rect.width;
    const scaleY = 109 / rect.height;
    return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY };
  }

  function resetDrawPath(){
    drawPathEl.setAttribute('d', '');
    drawPathEl.classList.remove('fail');
    currentPoints = [];
  }

  function loadChar(){
    strokeIndex = 0;
    buildStrokes();
    renderState();
    buildCharRow();
  }

  function completeStroke(){
    strokeIndex++;
    resetDrawPath();
    const chars = currentEntry().chars;

    if (strokeIndex < totalStrokes){
      renderState();
      return;
    }

    if (charIndex < chars.length - 1){
      const finishedChar = chars[charIndex];
      const nextChar = chars[charIndex + 1];
      hintText.textContent = '\u300c' + finishedChar + '\u300d\u3067\u304d\u305f\uff01\u3064\u304e\u306f\u300c' + nextChar + '\u300d';
      charIndex++;
      buildCharRow();
      transitioning = true;
      setTimeout(()=>{ transitioning = false; loadChar(); }, 700);
    } else {
      completedAll = true;
      renderState();
      buildCharRow();
      overlayWord.innerHTML = rubyHTML(currentEntry());
      overlayMsg.textContent = '\u300c' + currentEntry().label + '\u300d\u304c\u304b\u3051\u307e\u3057\u305f\uff01';
      setTimeout(()=> overlay.classList.add('show'), 250);
      masteredEntries.add(currentEntry().id);
      buildEntrySelector();
      clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = setTimeout(advanceToNextEntry, 2600);
    }
  }

  function advanceToNextEntry(){
    const next = (entryIndex + 1) % ENTRIES.length;
    selectEntry(next);
  }

  function failAttempt(){
    drawPathEl.classList.add('fail');
    setTimeout(resetDrawPath, 450);
  }

  function onDown(e){
    if (completedAll || transitioning) return;
    drawing = true;
    board.setPointerCapture(e.pointerId);
    const p = svgPoint(e);
    currentPoints = [p];
    drawPathEl.setAttribute('d', 'M ' + p.x + ' ' + p.y);
    drawPathEl.classList.remove('fail');
  }

  function onMove(e){
    if (!drawing) return;
    const p = svgPoint(e);
    currentPoints.push(p);
    drawPathEl.setAttribute('d', drawPathEl.getAttribute('d') + ' L ' + p.x + ' ' + p.y);
  }

  function onUp(){
    if (!drawing) return;
    drawing = false;
    if (currentPoints.length < 2){ resetDrawPath(); return; }

    const target = currentStrokes()[strokeIndex];
    const last = currentPoints[currentPoints.length - 1];
    const dist = Math.hypot(last.x - target._end.x, last.y - target._end.y);

    if (dist <= 18){
      completeStroke();
    } else {
      failAttempt();
    }
  }

  function selectEntry(i){
    clearTimeout(autoAdvanceTimer);
    entryIndex = i;
    charIndex = 0;
    strokeIndex = 0;
    completedAll = false;
    transitioning = false;
    overlay.classList.remove('show');
    buildEntrySelector();
    updateInfoCard();
    updateWordHeader();
    loadChar();
  }

  function resetAll(){
    clearTimeout(autoAdvanceTimer);
    charIndex = 0;
    strokeIndex = 0;
    completedAll = false;
    transitioning = false;
    overlay.classList.remove('show');
    loadChar();
  }

  board.addEventListener('pointerdown', onDown);
  board.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  resetBtn.addEventListener('click', resetAll);
  overlayResetBtn.addEventListener('click', resetAll);

  buildEntrySelector();
  updateInfoCard();
  updateWordHeader();
  loadChar();
})();
</script>

</body>
</html>
