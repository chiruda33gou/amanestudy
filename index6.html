<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>夜空を動く星ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 星座早見盤のような濃紺の夜空に、1枚の問題カードが浮かぶ一列レイアウト。図は自前のSVG。 */
:root{
  --sky:#0e1631; --sky2:#162150; --panel:#1a2655; --panel2:#22306a;
  --ink:#eef0fa; --mute:#a6aed4; --line:#5d6cab;
  --gold:#f5c95b; --gold-ink:#2a1e00;
  --ok:#7fdcb7; --ng:#ff9a9a; --ground:#0a1026;
  --display:"Kiwi Maru","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--mute)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(26px,6vw,36px);line-height:1.25;margin:2px 0 0;text-wrap:balance}
h1 .g{color:var(--gold)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--gold);width:18px;height:18px}
ruby rt{font-size:.5em;color:var(--mute);font-weight:400}
.card{background:linear-gradient(180deg,var(--panel),var(--sky2));border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
.lead{margin:0;color:var(--mute);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cat{position:relative}
.cat input{position:absolute;opacity:0;inset:0}
.cat label{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;min-height:72px;transition:border-color .15s,background .15s}
.cat label b{font-weight:700}
.cat label span{font-size:12px;color:var(--mute)}
.cat input:checked+label{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.cat input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg label{padding:6px 16px;cursor:pointer;font-size:14px}
.seg input:checked+label{background:var(--gold);color:var(--gold-ink);font-weight:700}
.seg input:focus-visible+label{outline:2px solid var(--ink);outline-offset:-3px}
button{font:inherit;cursor:pointer}
.btn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:16px}
.btn:hover{filter:brightness(1.07)}
.btn.sub{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.best{font-size:13px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--gold)} .dots i.ng{background:var(--ng)} .dots i.now{outline:2px solid var(--ink);outline-offset:1px}
.tag{align-self:flex-start;font-size:12px;letter-spacing:.06em;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.q{font-size:18px;font-weight:500;margin:0;line-height:1.8}
.note{font-size:13px;color:var(--mute);margin:-6px 0 0}
.figbox{background:var(--ground);border-radius:12px;padding:10px;overflow-x:auto}
.fig{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.fig text{fill:var(--ink);font-family:var(--body);font-size:13px}
.fig .sm{font-size:11px;fill:var(--mute)}
.fig .hl{fill:var(--gold);font-weight:700}
.fig .dash{stroke:var(--line);stroke-dasharray:3 4;fill:none;stroke-width:1}
.fig .ln{stroke:var(--mute);stroke-width:1.6;fill:none}
.fig .gl{stroke:var(--gold);stroke-width:2;fill:none}
.fig .gd{stroke:var(--gold);stroke-width:1.6;fill:none;stroke-dasharray:4 4}
.fig .st{fill:var(--gold)}
.fig .dot{fill:var(--ink)}
.fig .pt{fill:var(--mute)}
.fig .gnd{fill:#26305e}
.fig .hz{stroke:var(--line);stroke-width:1.5}
.fig .ring{fill:none;stroke:var(--gold);stroke-width:2}
.opts{display:grid;gap:10px}
.opts.grid4{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.opts.grid4{grid-template-columns:repeat(2,1fr)}}
.opt{text-align:left;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.opts.grid4 .opt{text-align:center;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--panel2))}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 16%,var(--panel2))}
.num{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num input{font:inherit;font-size:22px;width:120px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-variant-numeric:tabular-nums}
.num input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.num .unit{font-size:18px}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.fb.ok{border-left:4px solid var(--ok)} .fb.ng{border-left:4px solid var(--ng)}
.fb .v{font-weight:700;font-size:17px}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.fb p{margin:0;font-size:15px}
.score{font-family:var(--display);font-size:56px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;margin:0}
.score small{font-size:24px;color:var(--mute)}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars svg{width:24px;height:24px}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.miss li{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:14px}
.miss li b{color:var(--gold)}
footer{font-size:12px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .28s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">第5回 天体の観測</div>
      <h1>夜空を動く<span class="g">星</span>ドリル</h1>
    </div>
    <label class="toggle"><input type="checkbox" id="furi" checked> ふりがな</label>
  </header>
  <main id="app"></main>
  <footer>北極星の見つけ方・星の1日の動き・1か月の動き・季節の星座</footer>
</div>

<script>
/* ---------- ふりがな ---------- */
const RUBY={'反時計回り':'はんとけいまわり','時計回り':'とけいまわり','北斗七星':'ほくとしちせい','北極星':'ほっきょくせい','方角':'ほうがく','星座':'せいざ','等星':'とうせい','観察':'かんさつ','撮影':'さつえい'};
const RUBY_RE=new RegExp(Object.keys(RUBY).sort((a,b)=>b.length-a.length).join('|'),'g');
let furi=true;
const rb=s=>furi?String(s).replace(RUBY_RE,m=>`<ruby>${m}<rt>${RUBY[m]}</rt></ruby>`):String(s);

/* ---------- SVG helpers ---------- */
const D=Math.PI/180;
function starPath(x,y,R){let p=[];for(let i=0;i<10;i++){const r=i%2?R*.45:R,a=(-90+i*36)*D;p.push((x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1))}return `<polygon class="st" points="${p.join(' ')}"/>`}
const svg=(vb,inner,label)=>`<svg class="fig" viewBox="${vb}" role="img" aria-label="${label||'図'}">${inner}</svg>`;
const ground=(w,y)=>`<path class="gnd" d="M0 ${y} Q ${w*.18} ${y-16} ${w*.35} ${y-4} T ${w*.7} ${y-8} T ${w} ${y-2} V ${y+30} H0Z"/>`;

const KANA=['ア','イ','ウ','エ','オ','カ','キ','ク','ケ','コ','サ'];
function southArc({labels={},star=null}={}){
  const cx=200,cy=200,r=160;let s='';
  s+=`<path class="dash" d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}" style="stroke-dasharray:none;stroke:var(--line)"/>`;
  KANA.forEach((k,i)=>{const a=(90+15*(5-i))*D,x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);
    s+=`<line class="dash" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    s+=`<circle class="pt" cx="${x}" cy="${y}" r="4"/>`;
    const lx=cx+(r+16)*Math.cos(a),ly=cy-(r+16)*Math.sin(a);
    s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" class="${star===k?'hl':''}">${k}</text>`;
    if(labels[k]){const tx=cx+(r-26)*Math.cos(a),ty=cy-(r-26)*Math.sin(a);s+=`<text class="sm" x="${tx}" y="${ty+4}" text-anchor="middle">${labels[k]}</text>`}
    if(star===k)s+=starPath(x,y,11);
  });
  s+=`<text class="sm" x="${cx-20}" y="${cy-120}" text-anchor="middle">15°</text>`;
  s+=ground(400,cy);
  s+=`<text x="${cx-r}" y="${cy+22}" text-anchor="middle">東</text><text x="${cx+r}" y="${cy+22}" text-anchor="middle">西</text><text x="${cx}" y="${cy+22}" text-anchor="middle">南</text>`;
  return svg('0 0 400 232',s,'南の空の星の位置 ア〜サ');
}
const MARU='①②③④⑤⑥⑦⑧⑨⑩⑪⑫'.split('');
function northDial({labels={},star=null}={}){
  const cx=160,cy=145,r=110;let s='';
  s+=`<circle class="dash" cx="${cx}" cy="${cy}" r="${r}"/>`;
  for(let i=1;i<=12;i++){const a=(90+30*(i-1))*D,x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);
    s+=`<line class="dash" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    s+=`<circle class="pt" cx="${x}" cy="${y}" r="3.5"/>`;
    const lx=cx+(r+17)*Math.cos(a),ly=cy-(r+17)*Math.sin(a);
    s+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" class="${star===i?'hl':''}">${MARU[i-1]}</text>`;
    if(labels[i]){const tx=cx+(r-24)*Math.cos(a),ty=cy-(r-24)*Math.sin(a);s+=`<text class="sm" x="${tx}" y="${ty+4}" text-anchor="middle">${labels[i]}</text>`}
    if(star===i)s+=starPath(x,y,10);
  }
  s+=`<circle class="dot" cx="${cx}" cy="${cy}" r="4"/><text class="sm" x="${cx+8}" y="${cy+18}">北極星</text>`;
  s+=ground(320,282)+`<text x="${cx}" y="300" text-anchor="middle">北</text>`;
  return svg('0 0 320 308',s,'北の空の星の位置 ①〜⑫');
}
function cassFinder(show){
  const apex=[150,30],p3=[150,74],A=p3[1]-apex[1];
  const p1=[70,104],p5=[235,112];
  const mid=(p,t)=>[apex[0]+(p[0]-apex[0])*t,apex[1]+(p[1]-apex[1])*t];
  const p2=mid(p1,.55),p4=mid(p5,.5),pol=[150,74+5*A];
  let s='';
  s+=`<line class="dash" x1="${p2[0]}" y1="${p2[1]}" x2="${apex[0]}" y2="${apex[1]}"/><line class="dash" x1="${p4[0]}" y1="${p4[1]}" x2="${apex[0]}" y2="${apex[1]}"/>`;
  s+=`<polyline class="ln" points="${[p1,p2,p3,p4,p5].map(p=>p.join(',')).join(' ')}"/>`;
  [p1,p2,p3,p4,p5].forEach(p=>s+=`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4.5"/>`);
  s+=`<line class="ln" x1="${p3[0]}" y1="${p3[1]}" x2="${pol[0]}" y2="${pol[1]}" style="stroke-width:1"/>`;
  s+=`<path class="gl" d="M${apex[0]+2} ${apex[1]} Q ${apex[0]+16} ${(apex[1]+p3[1])/2} ${p3[0]+2} ${p3[1]}"/><text class="hl" x="${apex[0]+22}" y="${(apex[1]+p3[1])/2+4}">A</text>`;
  s+=`<path class="gd" d="M${p3[0]+2} ${p3[1]} Q ${p3[0]+40} ${(p3[1]+pol[1])/2} ${pol[0]+2} ${pol[1]}"/><text x="${p3[0]+44}" y="${(p3[1]+pol[1])/2+4}" class="${show?'hl':''}">B${show?' ＝ Aの5倍':' ＝ ？'}</text>`;
  s+=starPath(pol[0],pol[1],9)+`<text x="${pol[0]-16}" y="${pol[1]+4}" text-anchor="end">北極星</text>`;
  s+=`<text class="sm" x="${p1[0]-6}" y="${p1[1]-12}" text-anchor="middle">カシオペヤ座</text>`;
  return svg('0 0 300 320',s,'カシオペヤ座から北極星をさがす図');
}
function dipperFinder(show){
  const b3=[70,300],b4=[80,255],v=[b4[0]-b3[0],b4[1]-b3[1]],pol=[b4[0]+5*v[0],b4[1]+5*v[1]];
  const b1=[150,262],b2=[142,306],h1=[192,250],h2=[228,262],h3=[268,296];
  let s='';
  s+=`<polyline class="ln" points="${[b4,b1,b2,b3,b4].map(p=>p.join(',')).join(' ')}"/><polyline class="ln" points="${[b1,h1,h2,h3].map(p=>p.join(',')).join(' ')}"/>`;
  [b1,b2,b3,h1,h2,h3].forEach(p=>s+=`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`);
  s+=starPath(b3[0],b3[1],show?8:5)+starPath(b4[0],b4[1],show?8:5);
  s+=`<line class="dash" x1="${b4[0]}" y1="${b4[1]}" x2="${pol[0]}" y2="${pol[1]}"/>`;
  s+=`<text class="hl" x="${b3[0]-18}" y="${(b3[1]+b4[1])/2+4}">A</text>`;
  s+=`<text x="${(b4[0]+pol[0])/2-18}" y="${(b4[1]+pol[1])/2}" text-anchor="end" class="${show?'hl':''}">B${show?'＝Aの5倍':''}</text>`;
  s+=starPath(pol[0],pol[1],9)+`<text x="${pol[0]+14}" y="${pol[1]+4}">北極星</text>`;
  s+=`<text class="sm" x="${h2[0]}" y="${h2[1]+30}" text-anchor="middle">北斗七星</text>`;
  return svg('0 0 320 330',s,'北斗七星から北極星をさがす図');
}
function trails(show){
  const cx=250,cy=205;let s='';
  [55,78,96,118,140].forEach((r,i)=>{const a0=(118+i*3)*D,a1=(158+i*3)*D;
    const x0=cx+r*Math.cos(a0),y0=cy-r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy-r*Math.sin(a1);
    s+=`<path class="ln" d="M${x0} ${y0} A${r} ${r} 0 0 0 ${x1} ${y1}"/><circle cx="${x0}" cy="${y0}" r="4" fill="var(--ground)" stroke="var(--ink)" stroke-width="1.5"/><circle class="dot" cx="${x1}" cy="${y1}" r="4"/>`;
  });
  s+=`<circle class="dot" cx="${cx}" cy="${cy}" r="3.5"/><text x="${cx-10}" y="${cy+4}" text-anchor="end" class="${show?'hl':''}">${show?'北極星':'星A'}</text>`;
  s+=`<text class="sm" x="70" y="40">カシオペヤ座の星の線</text><text class="sm" x="70" y="228">○ 撮影開始　● 撮影終了</text>`;
  return svg('0 0 320 240',s,'長時間撮影した北の空');
}
function wAt(x,y,rot){return `<g transform="translate(${x} ${y}) rotate(${rot})"><polyline class="ln" points="-16,-6 -8,6 0,-3 8,6 16,-6"/>${[-16,-8,0,8,16].map((px,i)=>`<circle class="dot" cx="${px}" cy="${[-6,6,-3,6,-6][i]}" r="2.6"/>`).join('')}</g>`}
function monthFig(show){
  const cx=160,cy=200,r=130;let s='';
  const pt=a=>[cx+r*Math.cos(a*D),cy-r*Math.sin(a*D)];
  const n=pt(50),d=pt(80);
  s+=`<line class="dash" x1="${cx}" y1="${cy}" x2="${n[0]}" y2="${n[1]}"/><line class="dash" x1="${cx}" y1="${cy}" x2="${d[0]}" y2="${d[1]}"/>`;
  s+=wAt(n[0],n[1],-40)+wAt(d[0],d[1],-10);
  s+=`<text class="sm" x="${n[0]+18}" y="${n[1]+20}">11月5日 18時</text><text class="sm" x="${d[0]+22}" y="${d[1]}">12月5日 18時</text>`;
  const r2=50,a=pt(50),q=[cx+r2*Math.cos(50*D),cy-r2*Math.sin(50*D)],w=[cx+r2*Math.cos(80*D),cy-r2*Math.sin(80*D)];
  s+=`<path class="gl" d="M${q[0]} ${q[1]} A${r2} ${r2} 0 0 0 ${w[0]} ${w[1]}"/><text class="hl" x="${cx+38}" y="${cy-56}">${show?'30°':'？°'}</text>`;
  s+=`<circle class="dot" cx="${cx}" cy="${cy}" r="4"/><text class="sm" x="${cx-10}" y="${cy+4}" text-anchor="end">北極星</text>`;
  s+=ground(320,245)+`<text x="${cx}" y="268" text-anchor="middle">北</text>`;
  return svg('0 0 320 276',s,'1か月ごとのカシオペヤ座の位置');
}
function seasonPaths(){
  let s='';const y=200;
  const arc=(x0,peak,x1,label,ly)=>`<path class="ln" d="M${x0} ${y} Q 200 ${2*peak-y} ${x1} ${y}"/><text class="sm" x="200" y="${ly}" text-anchor="middle">${label}</text>`;
  s+=arc(40,28,360,'はくちょう座：北寄りからのぼり、頭の上付近',22);
  s+=arc(20,100,380,'オリオン座：真東→南の空→真西',94);
  s+=arc(110,168,290,'さそり座：南寄り、低い所',160);
  s+=ground(400,y)+`<text x="20" y="${y+24}">東</text><text x="200" y="${y+24}" text-anchor="middle">南</text><text x="380" y="${y+24}" text-anchor="end">西</text>`;
  return svg('0 0 400 232',s,'季節の星座の通り道');
}
function dirFig(facing){
  const cx=150,cy=125;let s='';
  const arrows=[['ア',-135],['イ',-45],['ウ',135],['エ',45]];
  s+=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs>`;
  arrows.forEach(([k,a])=>{const x=cx+70*Math.cos(a*D),y=cy+70*Math.sin(a*D);
    s+=`<line class="ln" x1="${cx+16*Math.cos(a*D)}" y1="${cy+16*Math.sin(a*D)}" x2="${x}" y2="${y}" marker-end="url(#ah)"/><text x="${cx+88*Math.cos(a*D)}" y="${cy+88*Math.sin(a*D)+5}" text-anchor="middle">${k}</text>`;});
  s+=starPath(cx,cy,11);
  s+=`<path class="gnd" d="M0 222 H40 V206 H70 V214 H110 V198 H130 V214 H180 V202 H215 V210 H260 V196 H300 V250 H0Z"/>`;
  const [L,R]=facing==='東'?['北','南']:['南','北'];
  s+=`<text class="sm" x="12" y="244">← ${L}</text><text class="sm" x="288" y="244" text-anchor="end">${R} →</text><text x="${cx}" y="244" text-anchor="middle">${facing}</text>`;
  return svg('0 0 300 252',s,facing+'の空の星');
}

/* ---------- 問題 ---------- */
const CATS={find:['北極星をさがす','見つけ方・星座'],day:['1日の動き','1時間に何度？'],month:['1か月の動き','同じ時刻で比べる'],season:['季節の星座','通り道と向き']};

 {c:'find',t:'choice',q:'北の空を長い時間撮影すると、カシオペヤ座の星は線のように写りましたが、星Aだけは1点に写りました。星Aは何という星ですか。',a:'北極星',o:['シリウス','アンタレス','ベガ'],fig:trails,e:'カシオペヤ座の線は、星Aを中心にした円の一部になっています。動きの中心でほとんど動かない星は北極星です。'},

 {c:'day',t:'num',q:'南の空の星Aは、19時にア、20時にイ、21時にウの位置にありました。ア〜サの間の角度はすべて15°です。星Aは1時間で何度動きますか。',a:15,u:'度',fig:()=>southArc({labels:DAYL}),e:'1時間に1つずつ動いているので15°です。星は1時間に約15°動いて見えます。'},

 {c:'day',t:'choice',q:'11月1日19時にアにあった星Aは、11月2日の2時にはどの位置にありますか。',a:'ク',o:['キ','ク','ケ','コ'],k:1,fig:s=>southArc({labels:DAYL,star:s?'ク':null}),e:'19時から次の日の2時までは7時間です。アから7つ進むとクになります。'},
 {c:'day',t:'num',q:'星Aが図のコの位置にあるのは、11月2日の何時ですか。24時制で答えましょう。',a:4,u:'時',fig:s=>southArc({labels:DAYL,star:s?'コ':null}),e:'アからコまでは9つなので9時間後です。19＋9＝28時、24を引いて次の日の4時です。'},
 {c:'day',t:'choice',q:'南の空の星は、時間とともにどのように動いて見えますか。',a:'東から南の空の高い所を通って西へ',o:['西から南の空の高い所を通って東へ','南から北へまっすぐ','ほとんど動かない'],e:'南の空の星は、太陽と同じように東から西へ動いて見えます。'},
 {c:'day',t:'choice',q:'北の空の星は、北極星を中心にしてどちら向きに回って見えますか。',a:'反時計回り',o:['時計回り'],k:1,fig:()=>northDial({labels:NL,star:3}),e:'①（20時）→②（22時）→③（0時）と、時計の針と反対向きに回ります。'},

 {c:'day',t:'choice',q:'星Aは、12月9日の2時にはどの位置にありますか。',a:'④',o:['③','④','⑤','⑫'],k:1,fig:s=>northDial({labels:NL,star:s?4:3}),e:'0時の③から2時間で1つ進むので④です。'},
 {c:'day',t:'num',q:'12月8日のある時刻に、星Aは⑨の位置にありました。何時ですか。24時制で答えましょう。',a:12,u:'時',fig:s=>northDial({labels:NL,star:s?9:1}),e:'⑨は①（20時）から時計回りに4つもどった所です。2時間×4＝8時間前なので、20－8＝12時です。'},
 {c:'day',t:'num',q:'星は1日（24時間）で、北極星のまわりを約何度回りますか。',a:360,u:'度',e:'15°×24時間＝360°。1日でほぼ1周します。'},

 {c:'month',t:'num',q:'毎月5日の18時に北の空を観察しました。11月5日から12月5日の間に、カシオペヤ座は北極星を中心に何度動きましたか。',a:30,u:'度',fig:monthFig,e:'同じ時刻に観察すると、星は1か月に約30°ずつ動いて見えます。'},
 {c:'month',t:'choice',q:'同じ時刻に観察すると、北の空の星は1か月ごとにどちら向きに動いて見えますか。',a:'反時計回り',o:['時計回り'],k:1,fig:monthFig,e:'1日の動きと同じく、北極星を中心に反時計回りです。'},
 {c:'month',t:'choice',q:'11月5日18時の位置から、北極星を中心に180°回った位置にカシオペヤ座が見えるのは、いつの18時ですか。',a:'5月5日',o:['2月5日','8月5日','12月5日'],e:'1か月で30°なので、180°÷30°＝6か月。11月5日の6か月後は5月5日です。'},
 {c:'month',t:'choice',q:'星が同じ位置に見える時刻は、1か月でどう変わりますか。',a:'約2時間早くなる',o:['約2時間おそくなる','約1時間早くなる','変わらない'],e:'1か月で30°先に進んでいます。30°は2時間分（15°×2）なので、2時間早い時刻に同じ位置に見えます。'},
 {c:'month',t:'num',q:'同じ時刻に観察すると、星は1年（12か月）で約何度回りますか。',a:360,u:'度',e:'30°×12か月＝360°。1年たつと、同じ時刻に同じ位置にもどります。'},

 {c:'season',t:'choice',q:'「はくちょう座」の星の通り道はどれですか。',a:'真東よりも北寄りからのぼり、頭の上付近を通る',o:['真東よりも南寄りからのぼり、南の空の低い所を通る','秋分の日の太陽とほぼ同じ通り道を通る','西からのぼり、東にしずむ'],after:seasonPaths,e:'はくちょう座（夏の星座）は北寄りからのぼり、高く頭の上付近を通ります。'},
 {c:'season',t:'choice',q:'「さそり座」の星の通り道はどれですか。',a:'真東よりも南寄りからのぼり、南の空の低い所を通る',o:['真東よりも北寄りからのぼり、頭の上付近を通る','秋分の日の太陽とほぼ同じ通り道を通る','北極星のまわりを回り、しずまない'],after:seasonPaths,e:'さそり座は南寄りからのぼり、南の空の低い所を通ります。'},
 {c:'season',t:'choice',q:'「オリオン座」の星の通り道はどれですか。',a:'秋分の日の太陽とほぼ同じ通り道を通る',o:['真東よりも北寄りからのぼり、頭の上付近を通る','真東よりも南寄りからのぼり、南の空の低い所を通る','北の空でしずまずに回る'],after:seasonPaths,e:'オリオン座はほぼ真東からのぼり、南の空を通ってほぼ真西にしずみます。秋分の日の太陽の通り道とほぼ同じです。'},
 {c:'season',t:'choice',q:'東の空の低い所にオリオン座の星が見えました。この星は、このあとどの向きに動いて見えますか。',a:'イ',o:['ア','イ','ウ','エ'],k:1,fig:()=>dirFig('東'),e:'東からのぼった星は南の空へ向かいます。東を向いたとき南は右なので、右ななめ上（イ）に動きます。'},
 {c:'season',t:'choice',q:'西の空の低い所に見えた星は、このあとどの向きに動いて見えますか。',a:'エ',o:['ア','イ','ウ','エ'],k:1,fig:()=>dirFig('西'),e:'南の空を通ってきた星は、西を向いたとき左（南）から来て、右ななめ下（エ）へしずんでいきます。'},
];
Q.forEach((q,i)=>q.id=i);

/* ---------- 状態 ---------- */
const app=document.getElementById('app');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S={cats:new Set(Object.keys(CATS)),n:10,list:[],i:0,res:[],done:false,view:'start'};

function render(){({start:renderStart,quiz:renderQ,result:renderResult})[S.view]()}

function renderStart(){
  const best=store.get('hoshi-best');
  app.innerHTML=`<section class="card">
    <h2>${rb('どの問題をとく？')}</h2>
    <p class="lead">${rb('プリント「夜空を動く星」の内容から出題します。分野をえらんでスタート。')}</p>
    <div class="cats">${Object.entries(CATS).map(([k,[n,s]])=>`<div class="cat"><input type="checkbox" id="c-${k}" value="${k}" ${S.cats.has(k)?'checked':''}><label for="c-${k}"><b>${rb(n)}</b><span>${rb(s)}・${Q.filter(q=>q.c===k).length}問</span></label></div>`).join('')}</div>
    <div class="row"><span style="font-size:14px">問題数</span><div class="seg">${[5,10,0].map(n=>`<input type="radio" name="n" id="n${n}" value="${n}" ${S.n===n?'checked':''}><label for="n${n}">${n?n+'問':'ぜんぶ'}</label>`).join('')}</div></div>
    <div class="row" style="justify-content:space-between"><button class="btn" id="go">スタート</button>${best?`<span class="best">さいこう記録 ${best.s} / ${best.t}</span>`:''}</div>
  </section>`;
  app.querySelectorAll('.cat input').forEach(el=>el.onchange=()=>{el.checked?S.cats.add(el.value):S.cats.delete(el.value)});
  app.querySelectorAll('input[name=n]').forEach(el=>el.onchange=()=>S.n=+el.value);
  document.getElementById('go').onclick=()=>{
    let pool=Q.filter(q=>S.cats.has(q.c));
    if(!pool.length){S.cats=new Set(Object.keys(CATS));pool=Q.slice()}
    pool=shuffle(pool.slice());if(S.n)pool=pool.slice(0,S.n);
    start(pool);
  };
}
function start(list){S.list=list;S.i=0;S.res=[];S.view='quiz';render();window.scrollTo(0,0)}

function renderQ(){
  const q=S.list[S.i];S.done=false;
  const opts=q.t==='choice'?(q.k?[...q.o.includes(q.a)?q.o:[q.a,...q.o]]:shuffle([q.a,...q.o])):null;
  const grid=opts&&opts.every(o=>o.length<=2);
  const dots=S.list.map((_,i)=>`<i class="${S.res[i]===true?'ok':S.res[i]===false?'ng':''} ${i===S.i?'now':''}"></i>`).join('');
  app.innerHTML=`<section class="card">
    <div class="top"><span>${S.i+1} / ${S.list.length}</span><div class="dots">${dots}</div></div>
    <span class="tag">${rb(CATS[q.c][0])}</span>
    <p class="q">${rb(q.q)}</p>
    ${q.fig?`<div class="figbox" id="fig">${q.fig(false)}</div>`:''}
    ${opts?`<div class="opts ${grid?'grid4':''}">${opts.map(o=>`<button class="opt" data-v="${o}">${rb(o)}</button>`).join('')}</div>`
      :`<form class="num" id="nf"><input id="numIn" inputmode="numeric" autocomplete="off" aria-label="答え"><span class="unit">${q.u}</span><button class="btn" type="submit">答える</button></form>`}
    <div id="fb"></div>
  </section>`;
  if(opts)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.v,b));
  else{const f=document.getElementById('nf'),inp=document.getElementById('numIn');inp.focus({preventScroll:true});
    f.onsubmit=e=>{e.preventDefault();const v=inp.value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[^\d.\-]/g,'');if(v==='')return;answer(Number(v),inp)}}
}
function answer(v,el){
  if(S.done)return;S.done=true;S.pick=v;
  const q=S.list[S.i],ok=q.t==='choice'?v===q.a:v===q.a;
  S.res[S.i]=ok;
  if(q.t==='choice')app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.a)b.classList.add('ok');else if(b===el)b.classList.add('ng')});
  else{el.disabled=true;el.style.borderColor=ok?'var(--ok)':'var(--ng)';el.parentElement.querySelector('button').disabled=true}
  const fig=document.getElementById('fig');if(fig&&q.fig)fig.innerHTML=q.fig(true);
  const last=S.i===S.list.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><span class="v">${ok?'正解！':'おしい！ 正解は「'+rb(q.a)+(q.u||'')+'」'}</span><p>${rb(q.e)}</p></div>
    ${q.after?`<div class="figbox" style="margin-top:12px">${q.after()}</div>`:''}
    <div class="row" style="margin-top:14px"><button class="btn" id="next">${last?'結果を見る':'次の問題'}</button></div>`;
  const n=document.getElementById('next');n.focus({preventScroll:true});
  n.onclick=()=>{if(last){S.view='result';render()}else{S.i++;render()}window.scrollTo({top:0})};
}
function renderResult(){
  const t=S.list.length,s=S.res.filter(Boolean).length;
  const best=store.get('hoshi-best');if(!best||s/t>best.s/best.t||(s/t===best.s/best.t&&t>best.t))store.set('hoshi-best',{s,t});
  const miss=S.list.filter((_,i)=>!S.res[i]);
  const msg=s===t?'全問正解！ 夜空の名人です。':s/t>=.7?'よくできました。まちがえた所を見直そう。':'図をよく見て、もう一度ちょうせんしよう。';
  const star=on=>`<svg viewBox="0 0 24 24"><polygon points="12,1.5 14.9,8.6 22.5,9.2 16.7,14.2 18.5,21.6 12,17.6 5.5,21.6 7.3,14.2 1.5,9.2 9.1,8.6" fill="${on?'var(--gold)':'none'}" stroke="var(--gold)" stroke-width="1.3"/></svg>`;
  app.innerHTML=`<section class="card">
    <h2>けっか</h2>
    <p class="score">${s}<small> / ${t}</small></p>
    <div class="stars">${S.res.map(star).join('')}</div>
    <p class="lead" style="color:var(--ink)">${rb(msg)}</p>
    ${miss.length?`<h2 style="font-size:16px">${rb('まちがえた問題')}</h2><ul class="miss">${miss.map(q=>`<li>${rb(q.q)}<br>正解：<b>${rb(q.a)}${q.u||''}</b></li>`).join('')}</ul>`:''}
    <div class="row">${miss.length?`<button class="btn" id="retry">まちがえた問題だけもう一度</button>`:''}<button class="btn ${miss.length?'sub':''}" id="home">はじめにもどる</button></div>
  </section>`;
  if(miss.length)document.getElementById('retry').onclick=()=>start(shuffle(miss.slice()));
  document.getElementById('home').onclick=()=>{S.view='start';render()};
}

/* ふりがな切りかえ（回答中は状態を保つ） */
const furiEl=document.getElementById('furi');
furi=store.get('hoshi-furi')!==false;furiEl.checked=furi;
furiEl.onchange=()=>{furi=furiEl.checked;store.set('hoshi-furi',furi);
  if(S.view==='quiz'&&S.done){const v=S.pick,q=S.list[S.i];renderQ();
    if(q.t==='choice'){answer(v,[...app.querySelectorAll('.opt')].find(b=>b.dataset.v===v))}
    else{const inp=document.getElementById('numIn');inp.value=v;answer(v,inp)}}
  else render()};

/* 星空の背景 */
function sky(){const c=document.getElementById('sky'),d=window.devicePixelRatio||1,w=innerWidth,h=innerHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0b1229');g.addColorStop(1,'#18245a');x.fillStyle=g;x.fillRect(0,0,w,h);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<w*h/2600;i++){const r=rnd()*1.2+.2;x.globalAlpha=rnd()*.6+.2;x.fillStyle=rnd()>.9?'#f5d98a':'#dfe4ff';x.beginPath();x.arc(rnd()*w,rnd()*h,r,0,7);x.fill()}}
sky();addEventListener('resize',sky);
render();
</script>
