function rot(arr,n){n%=arr.length;return arr.slice(n).concat(arr.slice(0,n));}

function svg(k,labels){
  const c=D[k],S=c.stars,map=(v)=>10+v*0.8;
  let s='<svg viewBox="0 0 100 100" role="img" aria-label="星の並びの図">';
  for(const [a,b] of c.lines){const A=S[a],B=S[b];s+=`<line x1="${map(A[0])}" y1="${map(A[1])}" x2="${map(B[0])}" y2="${map(B[1])}" stroke="var(--line)" stroke-width=".7" stroke-linecap="round"/>`;}
  for(const id in S){const [x,y,m]=S[id],r=MAGR[m]*0.6,fill=m===1?'var(--star)':'var(--star-dim)';
    if(m===1&&!labels) s+=`<circle cx="${map(x)}" cy="${map(y)}" r="${r*2}" fill="var(--star)" opacity=".15"/>`;
    s+=`<circle cx="${map(x)}" cy="${map(y)}" r="${r}" fill="${fill}"/>`;}
  if(labels){for(const id in labels){const [x,y]=S[id];let lx=map(x)+6,ly=map(y)-5;if(lx>90)lx=map(x)-6;if(ly<7)ly=map(y)+8;
    s+=`<circle cx="${map(x)}" cy="${map(y)}" r="5.2" fill="none" stroke="var(--label)" stroke-width=".6"/><text x="${lx}" y="${ly}" font-size="7" font-weight="700" fill="var(--label)" text-anchor="middle" dominant-baseline="middle" font-family="Zen Kaku Gothic New,sans-serif">${labels[id]}</text>`;}}
  return s+'</svg>';
}

let qs=[];
function card(grid,{no,art,prompt,opts,ans,exp,four}){
  const el=document.createElement('div');el.className='card';
  const i=qs.length;qs.push({done:false,ok:false});
  el.innerHTML=`<div class="qno">${no}</div>${art||''}<p class="prompt">${prompt}</p><div class="choices${four?' four':''}"></div><p class="fb" hidden></p>`;
  const box=el.querySelector('.choices'),fb=el.querySelector('.fb');
  opts.forEach((o,j)=>{const b=document.createElement('button');b.type='button';b.id=`q${i}o${j}`;b.textContent=o;
    b.addEventListener('click',()=>{if(qs[i].done)return;qs[i].done=true;qs[i].ok=o===ans;
      box.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add('ok');});
      if(o!==ans)b.classList.add('ng');
      fb.innerHTML=`<strong class="${o===ans?'ok':'ng'}">${o===ans?'正解！':'ざんねん。答えは「'+ans+'」'}</strong>${exp}`;fb.hidden=false;upd();});
    box.appendChild(b);});
  grid.appendChild(el);
}
function upd(){const a=qs.filter(q=>q.done).length,o=qs.filter(q=>q.ok).length;
  document.getElementById('ans').textContent=a;document.getElementById('ok').textContent=o;document.getElementById('total').textContent=qs.length;}

function build(){
  qs=[];['g1','g2','g3','g4'].forEach(g=>document.getElementById(g).innerHTML='');
  const g1=document.getElementById('g1'),g2=document.getElementById('g2'),g3=document.getElementById('g3'),g4=document.getElementById('g4');
  let n3=0;
  ORDER.forEach((k,i)=>{const c=D[k];
    card(g1,{no:`形 ${i+1}`,art:svg(k),prompt:'この星座は？',opts:rot(c.shapeOpts,i*3%4),ans:c.name,exp:c.shapeExp});
    if(!NO_NP.includes(k)) card(g2,{no:`名前 ${i+1}`,art:svg(k),prompt:c.namePrompt||`${c.name}の一等星の名前は？`,opts:rot(c.nameOpts,(i*5+1)%4),ans:c.nameAns,exp:c.nameExp});
    if(!NO_NP.includes(k)) c.pos.forEach(p=>{n3++;const opts=Object.values(p.labels).sort((a,b)=>'アイウエ'.indexOf(a)-'アイウエ'.indexOf(b));
      card(g3,{no:`位置 ${n3}`,art:svg(k,p.labels),prompt:`${c.name}：${p.q}`,opts,ans:p.ans,exp:p.exp,four:opts.length===4});});
    card(g4,{no:`季節 ${i+1}`,art:svg(k),prompt:`${c.name}が夜空で見ごろになる季節は？`,opts:SEASONS,ans:c.season,exp:c.seasonExp,four:true});
  });
  upd();
}
document.getElementById('tb').innerHTML=ORDER.map(k=>{const c=D[k];return `<tr><td>${c.name}</td><td>${c.firstName||c.nameAns}</td><td class="mag">${c.mag}</td><td>${c.posText}</td><td>${c.season}</td></tr>`;}).join('');
document.getElementById('reset').addEventListener('click',()=>{build();window.scrollTo({top:0,behavior:'smooth'});});
build();
</script>

</body></html>
