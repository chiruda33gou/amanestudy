<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことわざ問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 塾の教室の机の上。まじめで明るく、子どもが毎日開きたくなる問題集
   IDEA: 単語カード＋赤シート。答えを赤シートで隠して覚え、カードをめくって確かめる
   PICTURE: 藍色の机に重なった単語カード。一番上が「今日のことわざ」で、タップでめくれる
   COLOUR and TYPE: 藍 #1d3461 の地、白いカード、朱 #e5432d（赤シート・花丸）。見出しとことわざは しっぽり明朝、本文は Zen角ゴシック
   LAYOUT: 上部に藍の帯（カード＋モード選択）、下に設定。問題画面は1カラムの大きなカード */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fa,#0f1626);--paper:light-dark(#ffffff,#18223a);--ink:light-dark(#18202f,#e9edf5);--sub:light-dark(#566079,#a7b1c7);
--ai:#1d3461;--ai2:light-dark(#2b4a85,#8fb0ef);--shu:#e5432d;--shu-soft:light-dark(#fde7e3,#4a1f1a);--ok:light-dark(#1f7a4c,#5fd39a);--ok-soft:light-dark(#e2f4ea,#173a2a);--line:light-dark(#dfe3ec,#2a3654)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
.mincho{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
header.top{background:var(--ai);color:#fff;position:relative;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.10),transparent 45%),repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.04) 31px 32px);pointer-events:none}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
.nav h1{margin:0;font-size:clamp(28px,4.4vw,44px);line-height:1.05;letter-spacing:.04em}
.nav .count{font-size:14px;opacity:.8}
.nav .sp{flex:1}
.pill{border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:9px 16px;min-height:44px}
.pill:hover{background:rgba(255,255,255,.12)}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);margin-top:28px;position:relative;align-items:center}
.deck{position:relative;min-height:300px;perspective:1200px}
.deck .under{position:absolute;inset:14px -10px -14px 10px;background:#e9ecf3;border-radius:18px;transform:rotate(3deg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.deck .under.b{inset:26px -18px -24px 18px;transform:rotate(6deg);background:#d6dbe7}
.card{position:relative;height:300px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1);cursor:pointer;border:0;background:none;width:100%;padding:0;text-align:left}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;color:#18202f;border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;box-shadow:0 14px 34px rgba(0,0,0,.28);overflow:hidden}
.face::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--shu)}
.face .hole{position:absolute;top:22px;right:22px;width:22px;height:22px;border-radius:50%;background:var(--ai);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg)}
.face small{color:#566079;font-size:14px}
.face .big{font-size:clamp(26px,3.6vw,38px);line-height:1.25;margin:auto 0;text-wrap:balance}
.face .yomi{color:#566079;font-size:15px}
.face .mean{font-size:19px;line-height:1.7;margin:auto 0}
.hint{font-size:14px;color:rgba(255,255,255,.75);margin:30px 0 0}
.modes{display:grid;gap:10px}
.modes h2{margin:0 0 4px;font-size:20px;font-weight:700}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:12px 16px;text-align:left;min-height:64px;transition:background .15s,transform .15s}
.mode:hover{background:rgba(255,255,255,.16);transform:translateX(3px)}
.mode b{display:block;font-size:17px}
.mode span{font-size:13.5px;opacity:.8}
.mode i{font-style:normal;width:40px;height:40px;border-radius:10px;background:#fff;color:var(--ai);display:grid;place-items:center;font-weight:800;font-family:"Shippori Mincho B1",serif;font-size:20px}
.mode.weak i{background:var(--shu);color:#fff}
.mode em{font-style:normal;font-size:13px;opacity:.75;white-space:nowrap}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.settings h3{margin:0 0 10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 15px;min-height:44px;font-size:15px}
.chip[aria-pressed=true]{background:var(--ai);border-color:var(--ai);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true]{background:var(--ai2);border-color:var(--ai2);color:#0f1626}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .chip[aria-pressed=true]{background:var(--ai2);border-color:var(--ai2);color:#0f1626}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font-size:30px;line-height:1.1;font-family:"Shippori Mincho B1",serif}
.stat span{font-size:14px;color:var(--sub)}
.note{font-size:13.5px;color:var(--sub);margin-top:18px}
/* quiz */
.view{display:none}.view.on{display:block}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.back{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;min-height:44px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:120px}
.bar>div{height:100%;background:var(--shu);transition:width .3s}
.qno{font-size:15px;color:var(--sub);white-space:nowrap}
.qcard{background:var(--paper);border-radius:20px;padding:clamp(22px,4vw,40px);box-shadow:0 6px 24px rgba(20,30,60,.08);border-top:10px solid var(--ai);max-width:820px;margin:0 auto}
.qtype{font-size:14px;color:var(--ai2);font-weight:700;margin:0 0 10px}
.qtext{font-size:clamp(24px,3.8vw,36px);line-height:1.35;margin:0 0 6px;text-wrap:balance}
.qtext.long{font-size:clamp(19px,2.6vw,24px);line-height:1.6;font-family:inherit;font-weight:500}
.qsub{color:var(--sub);font-size:15px;margin:0 0 22px}
.blank{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--shu);color:transparent;margin:0 .1em}
.blank.fill{color:var(--shu)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 16px;min-height:56px;font-size:17px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ai2)}
.opt .n{width:30px;height:30px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.k{font-family:"Shippori Mincho B1",serif;font-size:19px;font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--shu);background:var(--shu-soft)}
.opt.wrong .n{background:var(--shu);color:#fff;border-color:var(--shu)}
.opt:disabled{cursor:default}
.fb{margin-top:20px;border-radius:14px;padding:16px 18px;display:none;position:relative}
.fb.on{display:block;animation:pop .35s ease}
.fb.ok{background:var(--ok-soft)}.fb.ng{background:var(--shu-soft)}
.fb .v{font-weight:700;font-size:18px;margin:0 0 6px}
.fb.ok .v{color:var(--ok)}.fb.ng .v{color:var(--shu)}
.fb .ex{margin:4px 0 0}
.fb .exk{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px}
.fb .exy{color:var(--sub);font-size:14px;margin-left:.5em}
.next{margin-top:18px;width:100%;background:var(--ai);color:#fff;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:700;min-height:52px;display:none}
.next.on{display:block}
:root[data-theme=dark] .next{background:var(--ai2);color:#0f1626}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .next{background:var(--ai2);color:#0f1626}}
.maru{position:absolute;right:14px;top:-26px;width:74px;height:74px;pointer-events:none}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
/* result */
.score{text-align:center}
.score .big{font-size:clamp(56px,10vw,96px);line-height:1;color:var(--shu);margin:8px 0}
.score p{margin:6px 0 0;color:var(--sub)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.btn{border:0;background:var(--ai);color:#fff;border-radius:12px;padding:12px 22px;min-height:48px;font-weight:700}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
:root[data-theme=dark] .btn:not(.ghost){background:var(--ai2);color:#0f1626}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn:not(.ghost){background:var(--ai2);color:#0f1626}}
.miss{max-width:820px;margin:26px auto 0}
.miss h3{font-size:18px}
/* list */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-height:44px}
.search:focus,.opt:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.sheet{display:flex;align-items:center;gap:8px;border:2px solid var(--shu);color:var(--shu);background:var(--paper);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700}
.sheet[aria-pressed=true]{background:var(--shu);color:#fff}
.list{display:grid;gap:8px}
.item{background:var(--paper);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) auto;gap:6px 18px;align-items:center;border-left:5px solid var(--line)}
.item.w{border-left-color:var(--shu)}
.item .ik{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:18px;line-height:1.35}
.item .iy{display:block;font-family:inherit;font-weight:400;font-size:12.5px;color:var(--sub)}
.item .im{font-size:15px;transition:background .2s,color .2s;border-radius:6px;padding:2px 6px;cursor:default}
.hide .item .im{background:var(--shu);color:var(--shu);cursor:pointer}
.hide .item .im.show{background:transparent;color:inherit}
.tag{font-size:12.5px;color:var(--sub);white-space:nowrap}
.empty{color:var(--sub);padding:30px;text-align:center}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}.deck{min-height:260px}.card{height:260px}}
@media(max-width:600px){.item{grid-template-columns:minmax(0,1fr)}.tag{justify-self:start}.face{padding:22px}.stats{gap:20px}}
@media(prefers-reduced-motion:reduce){.card,.mode,.fb.on{transition:none;animation:none}}
</style>
</head>
<body>
<header class="top band">
  <div class="wrap">
    <div class="nav">
      <h1 class="mincho">ことわざ問題集</h1>
      <span class="count" id="total"></span>
      <span class="sp"></span>
      <button class="pill" id="goHome">トップ</button>
      <button class="pill" id="goList">ことわざ一覧</button>
    </div>
    <div class="hero" id="heroArea">
      <div>
        <div class="deck">
          <div class="under b"></div><div class="under"></div>
          <button class="card" id="today" aria-label="今日のことわざ。押すと意味が見られます">
            <div class="face front"><span class="hole"></span><small>今日のことわざ</small><div class="big mincho" id="tdK"></div><div class="yomi" id="tdY"></div></div>
            <div class="face back"><span class="hole"></span><small>意味</small><div class="mean" id="tdM"></div><div class="yomi">もう一度押すと表にもどります</div></div>
          </button>
        </div>
        <p class="hint">カードを押すと裏返って意味が見られます。</p>
      </div>
      <div class="modes">
        <h2>問題の種類をえらぶ</h2>
        <button class="mode" data-mode="imi"><i>意</i><div><b>意味をえらぶ</b><span>ことわざを見て、正しい意味を4つから</span></div><em>基本</em></button>
        <button class="mode" data-mode="kotowaza"><i>言</i><div><b>ことわざをえらぶ</b><span>意味を見て、あてはまることわざを4つから</span></div><em>基本</em></button>
        <button class="mode" data-mode="ana"><i>□</i><div><b>穴うめ</b><span>（　）に入る言葉をえらぶ。動物・数・体がよく出る</span></div><em>頻出</em></button>
        <button class="mode" data-mode="nita"><i>似</i><div><b>似た意味のことわざ</b><span>同じような意味のものをえらぶ</span></div><em>応用</em></button>
        <button class="mode" data-mode="hantai"><i>反</i><div><b>反対の意味のことわざ</b><span>意味が反対になるものをえらぶ</span></div><em>応用</em></button>
        <button class="mode weak" data-mode="weak"><i>復</i><div><b>苦手を復習</b><span id="weakDesc">まちがえた問題がここにたまります</span></div><em id="weakN"></em></button>
      </div>
    </div>
  </div>
</header>

<main>
<section class="view on band" id="vHome">
  <div class="wrap settings">
    <div>
      <h3>出題数</h3>
      <div class="chips" id="numChips"></div>
    </div>
    <div>
      <h3>しぼりこみ（キーワードの種類）</h3>
      <div class="chips" id="catChips"></div>
    </div>
    <div>
      <h3>これまでの記録</h3>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <p class="wrap note">中学入試の国語でよく出ることわざを集めています（ことわざとして出題される故事成語の一部をふくみます）。記録はこのブラウザの中だけに保存されます。</p>
</section>

<section class="view band" id="vQuiz">
  <div class="wrap">
    <div class="qhead"><button class="back" id="quit">← やめる</button><div class="bar"><div id="prog"></div></div><span class="qno" id="qno"></span></div>
    <div class="qcard">
      <p class="qtype" id="qtype"></p>
      <p class="qtext mincho" id="qtext"></p>
      <p class="qsub" id="qsub"></p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <button class="next" id="next">次の問題へ →</button>
    </div>
  </div>
</section>

<section class="view band" id="vResult">
  <div class="wrap">
    <div class="qcard score">
      <p class="qtype" id="rType"></p>
      <div class="big mincho" id="rScore"></div>
      <p id="rMsg"></p>
      <div class="btnrow"><button class="btn" id="again">もう一度</button><button class="btn ghost" id="retryMiss">まちがえた問題だけ</button><button class="btn ghost" id="toHome">トップへ</button></div>
    </div>
    <div class="miss" id="missList"></div>
  </div>
</section>

<section class="view band" id="vList">
  <div class="wrap">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="ことわざ・よみ・意味でさがす" aria-label="検索">
      <button class="sheet" id="sheet" aria-pressed="false">赤シート</button>
    </div>
    <div class="chips" id="listCats" style="margin-bottom:14px"></div>
    <p class="note" id="listInfo" style="margin:0 0 10px"></p>
    <div class="list" id="list"></div>
  </div>
</section>
</main>

<script>
{
const RAW=`猫に小判|ねこにこばん|価値のわからない人に貴重なものを与えても、何の役にも立たないこと。|小判|動物|muda
豚に真珠|ぶたにしんじゅ|価値のわからない人に貴重なものを与えても、何の役にも立たないこと。|真珠|動物|muda
馬の耳に念仏|うまのみみにねんぶつ|いくら意見を言い聞かせても、聞き流すだけで少しも効き目がないこと。|念仏|動物|kiki
犬に論語|いぬにろんご|道理のわからない者に道理を説いても、むだであること。|犬|動物|kiki
犬も歩けば棒に当たる|いぬもあるけばぼうにあたる|出しゃばると思わぬ災難にあう。また、何かしていると思わぬ幸運にあうこともある。|棒|道具|
猿も木から落ちる|さるもきからおちる|その道の名人でも、ときには失敗することがある。|猿|動物|meijin
弘法にも筆の誤り|こうぼうにもふでのあやまり|その道の名人でも、ときには失敗することがある。|筆|道具|meijin
河童の川流れ|かっぱのかわながれ|その道の名人でも、ときには失敗することがある。|河童|動物|meijin
上手の手から水が漏る|じょうずのてからみずがもる|その道の名人でも、ときには失敗することがある。|水|自然|meijin
蛙の子は蛙|かえるのこはかえる|子は親に似るもので、平凡な親の子はやはり平凡である。|蛙|動物|oyako
瓜のつるになすびはならぬ|うりのつるになすびはならぬ|平凡な親から非凡な子は生まれない。子は親に似る。|瓜|植物|oyako
鳶が鷹を生む|とびがたかをうむ|平凡な親から優れた子が生まれること。|鷹|動物|
能ある鷹は爪を隠す|のうあるたかはつめをかくす|本当に実力のある人は、それをむやみに見せびらかさない。|爪|体|
虎の威を借る狐|とらのいをかるきつね|力のある者の権力を頼りにして、いばる小人物のたとえ。|狐|動物|
取らぬ狸の皮算用|とらぬたぬきのかわざんよう|まだ手に入っていないものをあてにして、あれこれ計画を立てること。|狸|動物|
二兎を追う者は一兎をも得ず|にとをおうものはいっとをもえず|同時に二つのことをしようとすると、結局どちらもうまくいかない。|兎|動物|nito
虻蜂取らず|あぶはちとらず|両方を手に入れようとして、結局どちらも得られないこと。|虻|動物|nito
雀百まで踊り忘れず|すずめひゃくまでおどりわすれず|幼いときに身についた習慣は、年をとっても変わらない。|雀|動物|sanko
三つ子の魂百まで|みつごのたましいひゃくまで|幼いころの性格は、年をとっても変わらない。|三つ子|数|sanko
窮鼠猫を噛む|きゅうそねこをかむ|追いつめられた弱い者が必死になると、強い者を負かすことがある。|猫|動物|
泣きっ面に蜂|なきっつらにはち|不運や困ったことの上に、さらに不運が重なること。|蜂|動物|fuun
弱り目にたたり目|よわりめにたたりめ|不運や困ったことの上に、さらに不運が重なること。|目|体|fuun
前門の虎後門の狼|ぜんもんのとらこうもんのおおかみ|一つの災難をのがれても、すぐまた別の災難にあうこと。|狼|動物|fuun
一難去ってまた一難|いちなんさってまたいちなん|一つの災難が過ぎたと思ったら、また次の災難がやってくること。|難|暮らし|fuun

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const save=()=>{store.set("kw-weak",[...weak]);rec.seen=[...seen];store.set("kw-rec",rec)};

$("#total").textContent=`全${D.length}こ収録`;
// today's card
const day=Math.floor((Date.now()+9*36e5)/864e5);const td=D[(day*37)%D.length];
$("#tdK").textContent=td.k;$("#tdY").textContent=td.r;$("#tdM").textContent=td.m;
$("#today").onclick=()=>$("#today").classList.toggle("flip");

function chips(el,arr,cur,fn){el.innerHTML=arr.map(v=>`<button class="chip" aria-pressed="${v===cur}" data-v="${v}">${v==="全部"?"全部":typeof v==="number"?v+"問":v}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const v=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;fn(v);[...el.children].forEach(c=>c.setAttribute("aria-pressed",c===b))}}
chips($("#numChips"),NUMS,num,v=>{num=v;store.set("kw-num",v)});
chips($("#catChips"),CATS,cat,v=>{cat=v;store.set("kw-cat",v)});
function renderHome(){
  const rate=rec.q?Math.round(rec.c/rec.q*100):0;
  $("#stats").innerHTML=`<div class="stat"><b>${rec.q}</b><span>といた問題数</span></div><div class="stat"><b>${rate}<small style="font-size:16px">%</small></b><span>正答率</span></div><div class="stat"><b>${seen.size}<small style="font-size:16px">/${D.length}</small></b><span>出会ったことわざ</span></div>`;
  $("#weakN").textContent=weak.size?weak.size+"こ":"";
  $("#weakDesc").textContent=weak.size?"まちがえたことわざを、意味をえらぶ問題でもう一度":"まちがえた問題がここにたまります";
}
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));$("#heroArea").style.display=id==="vHome"?"":"none";if(id==="vHome")renderHome();window.scrollTo(0,0)}

// ---- question builders
const inCat=d=>cat==="すべて"||d.t===cat;
function pickOthers(pool,n,bad){const out=[];for(const d of shuffle(pool)){if(out.length>=n)break;if(!bad(d))out.push(d)}return out}
function related(a,d){return a===d||(a.g&&a.g===d.g)||a.m===d.m||(opp[a.k]||[]).includes(d.k)}
function build(mode,d){
  if(mode==="imi"||mode==="weak"){
    const o=pickOthers(D,3,x=>related(d,x));
    return{type:"このことわざの意味は？",text:d.k,sub:d.r,opts:shuffle([d,...o]).map(x=>({label:x.m,ok:x===d})),kind:"m",d};
  }
  if(mode==="kotowaza"){
    const o=pickOthers(D,3,x=>related(d,x));
    return{type:"この意味のことわざは？",text:d.m,long:true,sub:"",opts:shuffle([d,...o]).map(x=>({label:x.k,ok:x===d})),kind:"k",d};
  }
  if(mode==="ana"){
    const words=[...new Set(D.filter(x=>x.t===d.t&&x.b!==d.b).map(x=>x.b))].filter(w=>!d.k.includes(w)&&!w.includes(d.b));
    let o=shuffle(words).slice(0,3);
    if(o.length<3)o=o.concat(shuffle([...new Set(D.map(x=>x.b))].filter(w=>w!==d.b&&!o.includes(w)&&!d.k.includes(w))).slice(0,3-o.length));
    const parts=d.k.split(d.b);
    return{type:"（　）に入る言葉は？",html:parts.map(esc).join(`<span class="blank">${esc(d.b)}</span>`),sub:"ヒント："+d.m,opts:shuffle([d.b,...o]).map(w=>({label:w,ok:w===d.b})),kind:"w",d};
  }
  if(mode==="nita"){
    const ans=shuffle(D.filter(x=>x!==d&&x.g===d.g))[0];
    const o=pickOthers(D,3,x=>x===d||related(d,x)||related(ans,x));
    return{type:"似た意味のことわざは？",text:d.k,sub:d.m,opts:shuffle([ans,...o]).map(x=>({label:x.k,ok:x===ans})),kind:"k",d,ans};
  }
  if(mode==="hantai"){
    const ans=byK[shuffle(opp[d.k])[0]];
    const o=pickOthers(D,3,x=>x===d||x===ans||(opp[d.k]||[]).includes(x.k)||(d.g&&x.g===d.g)||(ans.g&&x.g===ans.g));
    return{type:"反対の意味のことわざは？",text:d.k,sub:d.m,opts:shuffle([ans,...o]).map(x=>({label:x.k,ok:x===ans})),kind:"k",d,ans};
  }
}
function poolFor(mode){
  let p;
  if(mode==="weak")p=D.filter(d=>weak.has(d.k));
  else if(mode==="nita")p=D.filter(d=>d.g);
  else if(mode==="hantai")p=D.filter(d=>opp[d.k]);
  else p=D;
  if(mode!=="weak"){const c=p.filter(inCat);if(c.length>=4)p=c}
  return p;
}

// ---- quiz state
let Q=null;
function start(mode,list){
  let pool=list||poolFor(mode);
  if(!pool.length){alertBox("苦手なことわざはまだありません。まずは問題をといてみよう。");return}
  pool=shuffle(pool);const n=num==="全部"?pool.length:Math.min(num,pool.length);
  Q={mode,items:pool.slice(0,n),i:0,score:0,miss:[]};
  show("vQuiz");ask();
}
function alertBox(t){const s=$("#weakDesc");s.textContent=t}
function ask(){
  const d=Q.items[Q.i];const q=build(Q.mode,d);Q.cur=q;
  $("#qno").textContent=`${Q.i+1} / ${Q.items.length}`;
  $("#prog").style.width=(Q.i/Q.items.length*100)+"%";
  $("#qtype").textContent=`${MODE[Q.mode]}　${q.type}`;
  const qt=$("#qtext");qt.className="qtext "+(q.long?"long":"mincho");
  if(q.html)qt.innerHTML=q.html;else qt.textContent=q.text;
  $("#qsub").textContent=q.sub;
  $("#opts").innerHTML=q.opts.map((o,i)=>`<button class="opt ${q.kind==="m"?"":"k"}" data-i="${i}"><span class="n">${i+1}</span><span>${esc(o.label)}</span></button>`).join("");
  $("#fb").className="fb";$("#next").className="next";
}
function answer(i){
  const q=Q.cur;if(q.done)return;q.done=true;
  const ok=q.opts[i].ok;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  const d=q.d;rec.q++;seen.add(d.k);
  if(ok){Q.score++;rec.c++;if(Q.mode==="weak")weak.delete(d.k)}else{Q.miss.push(d);weak.add(d.k)}
  save();
  const b=document.querySelector(".blank");if(b)b.classList.add("fill");
  let ex=`<p class="ex"><span class="exk">${esc(d.k)}</span><span class="exy">${esc(d.r)}</span><br>${esc(d.m)}</p>`;
  if(q.ans)ex+=`<p class="ex"><span class="exk">${esc(q.ans.k)}</span><span class="exy">${esc(q.ans.r)}</span><br>${esc(q.ans.m)}</p>`;
  const maru=ok?`<svg class="maru" viewBox="0 0 80 80" aria-hidden="true"><path d="M40 8c18 0 31 12 31 30S57 71 38 71 8 58 9 40 22 9 44 10" fill="none" stroke="#e5432d" stroke-width="5" stroke-linecap="round"/><path d="M40 22c10 0 17 7 17 16s-8 17-18 17-16-8-15-17 9-16 20-15" fill="none" stroke="#e5432d" stroke-width="4" stroke-linecap="round"/></svg>`:"";
  const fb=$("#fb");fb.className="fb on "+(ok?"ok":"ng");
  fb.innerHTML=maru+`<p class="v">${ok?"せいかい！":"ざんねん… 正しい答えを確かめよう"}</p>`+ex;
  const nx=$("#next");nx.className="next on";nx.textContent=Q.i+1<Q.items.length?"次の問題へ →":"結果を見る";nx.focus({preventScroll:true});
}
function nextQ(){Q.i++;if(Q.i<Q.items.length)ask();else result()}
function result(){
  $("#prog").style.width="100%";
  const n=Q.items.length,s=Q.score,p=Math.round(s/n*100);
  $("#rType").textContent=MODE[Q.mode];
  $("#rScore").textContent=`${s} / ${n}`;
  $("#rMsg").textContent=p===100?"全問正解！すばらしい。":p>=80?`正答率${p}%。あと少しで満点！`:p>=50?`正答率${p}%。まちがえたものを見直そう。`:`正答率${p}%。一覧で意味を確かめてから、もう一度ちょうせんしよう。`;
  $("#retryMiss").style.display=Q.miss.length?"":"none";
  $("#missList").innerHTML=Q.miss.length?`<h3>まちがえたことわざ</h3><div class="list">${Q.miss.map(itemHTML).join("")}</div>`:"";
  show("vResult");
}
function itemHTML(d){return`<div class="item ${weak.has(d.k)?"w":""}"><div class="ik">${esc(d.k)}<span class="iy">${esc(d.r)}</span></div><div class="im">${esc(d.m)}</div><span class="tag">${esc(d.t)}${weak.has(d.k)?"・苦手":""}</span></div>`}

// ---- list
let lcat="すべて";
chips($("#listCats"),CATS.concat(["苦手"]),lcat,v=>{lcat=v;renderList()});
function renderList(){
  const q=$("#q").value.trim();
  const r=D.filter(d=>(lcat==="すべて"||(lcat==="苦手"?weak.has(d.k):d.t===lcat))&&(!q||d.k.includes(q)||d.r.includes(q)||d.m.includes(q)));
  $("#listInfo").textContent=`${r.length}こ表示中`+($("#list").parentElement.classList.contains("hide")?"・赤い部分を押すと意味が見えます":"");
  $("#list").innerHTML=r.length?r.map(itemHTML).join(""):`<div class="empty">見つかりませんでした。</div>`;
}
$("#q").addEventListener("input",renderList);
$("#sheet").onclick=e=>{const w=$("#vList .wrap");const on=w.classList.toggle("hide");e.currentTarget.setAttribute("aria-pressed",on);renderList()};
$("#list").onclick=e=>{const m=e.target.closest(".im");if(m)m.classList.toggle("show")};

// ---- events
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.mode));
$("#opts").onclick=e=>{const b=e.target.closest(".opt");if(b)answer(+b.dataset.i)};
$("#next").onclick=nextQ;
$("#quit").onclick=()=>show("vHome");
$("#again").onclick=()=>start(Q.mode);
$("#retryMiss").onclick=()=>start(Q.mode==="weak"?"weak":Q.mode,Q.miss.slice());
$("#toHome").onclick=$("#goHome").onclick=()=>show("vHome");
$("#goList").onclick=()=>{show("vList");renderList()};
document.addEventListener("keydown",e=>{if(!$("#vQuiz").classList.contains("on")||e.target.tagName==="INPUT"||e.target.tagName==="BUTTON")return;
  if(/^[1-4]$/.test(e.key)&&!Q.cur.done)answer(+e.key-1);else if(e.key==="Enter"&&Q.cur.done){e.preventDefault();nextQ()}});
renderHome();
}
</script>
</body>
</html>
