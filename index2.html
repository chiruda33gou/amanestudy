<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社会 作業ノート チェック</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  #app-root {
    --pink:#FF6FA5; --purple:#B57BFF; --mint:#2FCB8F; --yellow:#FFC93D; --sky:#33B6F2; --orange:#FF9F5A;
    --ink:#5B4B75; --ink-soft:#8577A0; --card:#FFFFFF;
    --shadow: rgba(181,123,255,.28);
    font-family:'Zen Maru Gothic', sans-serif; color: var(--ink); min-height:100vh; font-size: 19px;
    background: radial-gradient(circle at 15% 8%, #FFE3F2 0%, transparent 45%),
                radial-gradient(circle at 90% 12%, #DFF3FF 0%, transparent 40%),
                radial-gradient(circle at 20% 92%, #FFF6D6 0%, transparent 45%),
                linear-gradient(160deg, #FFF0F7 0%, #F1F4FF 50%, #FFFDF0 100%);
    padding: 26px 16px 60px; position: relative; overflow-x: hidden;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .display-font { font-family:'Mochiy Pop One', 'Zen Maru Gothic', sans-serif; }
  h1.display-font { font-size: 1.9rem !important; }
  h3.display-font { font-size: 1.5rem !important; }
  h4.display-font { font-size: 1.25rem !important; }
  .page-card { background: var(--card); border-radius: 26px; box-shadow: 0 10px 24px var(--shadow); border: 3px solid #F4E9FF; position: relative; }
  .px6 { padding-left:24px; padding-right:24px; }
  .py7 { padding-top:28px; padding-bottom:28px; }
  .py8 { padding-top:32px; padding-bottom:32px; }
  .py9 { padding-top:36px; padding-bottom:36px; }
  .py5 { padding-top:20px; padding-bottom:20px; }
  .py4 { padding-top:16px; padding-bottom:16px; }
  .mb6 { margin-bottom:24px; }
  .mb4 { margin-bottom:16px; }
  .center { text-align:center; }
  .row { display:flex; align-items:center; }
  .gap3 { gap:12px; }
  .gap2 { gap:8px; }
  .col { display:flex; flex-direction:column; }
  .flex1 { flex:1; }
  .deck-card { transition: transform .18s cubic-bezier(.3,1.5,.4,1), box-shadow .18s ease; width:100%; text-align:left; border:none; cursor:pointer; }
  .deck-card:hover { transform: translateY(-4px) scale(1.02) rotate(-.5deg); box-shadow: 0 14px 28px var(--shadow); }
  .deck-card:active { transform: scale(.97); }
  .icon-badge { width:52px; height:52px; border-radius:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:1.5rem; box-shadow: 0 4px 0 rgba(0,0,0,.08) inset; }
  .badge-0 { background: linear-gradient(145deg,#FFC2DA,#FF8FB8); }
  .badge-1 { background: linear-gradient(145deg,#BFEFFF,#7FD4F5); }
  .badge-2 { background: linear-gradient(145deg,#FFEAA8,#FFD35C); }
  .badge-3 { background: linear-gradient(145deg,#C9F5DD,#7FE0AC); }
  .badge-4 { background: linear-gradient(145deg,#E3D2FF,#C9A6FF); }
  .btn-primary { background: linear-gradient(180deg,#FF8AB8,#FF5F98); color:#fff; font-family:'Zen Maru Gothic',sans-serif; font-weight:900; border:none; border-radius:999px; padding:15px 28px; box-shadow:0 5px 0 #D93E76; cursor:pointer; transition: transform .08s ease, box-shadow .08s ease; font-size:1.25rem; }
  .btn-primary:active { transform: translateY(4px); box-shadow:0 1px 0 #D93E76; }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
  .btn-secondary { background:#fff; color:var(--purple); border:3px solid #E7D6FF; border-radius:999px; padding:11px 22px; font-weight:900; font-family:'Zen Maru Gothic',sans-serif; cursor:pointer; transition: transform .1s ease, background .15s ease; font-size:1.1rem; }
  .btn-secondary:hover { background:#FBF5FF; }
  .btn-secondary:active { transform: scale(.96); }
  .map-frame { border-radius: 20px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 6px 18px var(--shadow); background:#fff; margin-bottom: 18px; }
  .map-frame img { display:block; width:100%; height:auto; }
  .choice-btn { border:none; border-radius:20px; padding:19px 20px; text-align:left; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:1.4rem; color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.15); transition: transform .12s cubic-bezier(.3,1.6,.4,1), box-shadow .12s ease, filter .12s ease; width:100%; display:block; }
  .choice-btn:active:not(:disabled) { transform: translateY(3px) scale(.98); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .choice-0 { background: linear-gradient(180deg,#FF9AC2,#FF6FA5); }
  .choice-1 { background: linear-gradient(180deg,#63D3FF,#33B6F2); }
  .choice-2 { background: linear-gradient(180deg,#4FE0AA,#2FCB8F); }
  .choice-3 { background: linear-gradient(180deg,#FFD470,#FFC93D); }
  .choice-btn:disabled { cursor:default; }
  .choice-btn.dim { opacity:.35; filter: grayscale(.3); box-shadow:none; transform: scale(.97); }
  .choice-btn.correct-reveal { background: linear-gradient(180deg,#6FE3A8,#2FCB8F); box-shadow:0 5px 0 #1E9E6C; animation: pop-correct .5s cubic-bezier(.3,1.7,.4,1); transform: scale(1.04); opacity:1 !important; filter:none !important; }
  .choice-btn.wrong-reveal { background: linear-gradient(180deg,#FF8F8F,#FF6363); box-shadow:0 5px 0 #D94545; animation: shake-wrong .45s ease; opacity:1 !important; filter:none !important; }
  @keyframes pop-correct { 0%{transform:scale(1);} 40%{transform:scale(1.12) rotate(-2deg);} 70%{transform:scale(.98) rotate(1deg);} 100%{transform:scale(1.04) rotate(0);} }
  @keyframes shake-wrong { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px) rotate(-2deg);} 40%{transform:translateX(6px) rotate(2deg);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
  .progress-dots { display:flex; gap:6px; flex-wrap:wrap; max-width: 230px; }
  .progress-dot { width:20px; height:20px; border-radius:50%; border:2px solid #E7D6FF; background:#fff; }
  .progress-dot.filled-correct { background: var(--mint); border-color: var(--mint); }
  .progress-dot.filled-wrong { background:#FF6363; border-color:#FF6363; }
  .progress-dot.current { border-color: var(--pink); border-width:3px; transform: scale(1.15); }
  .check-badge { display:inline-flex; align-items:center; gap:4px; font-size:.95rem; color:#B87A1F; background:#FFF3CF; border:2px solid #FFDD7A; border-radius:999px; padding:3px 11px; margin-left:6px; font-weight:700; }
  .rank-badge { display:inline-flex; align-items:center; gap:4px; font-size:.95rem; color:#8A4FBF; background:#F1E4FF; border:2px solid #D9BBFF; border-radius:999px; padding:3px 11px; font-weight:700; }
  .correct-burst { position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; overflow:visible; z-index:5; }
  .correct-bubble { position:relative; animation: bubble-in .5s cubic-bezier(.3,1.8,.4,1); }
  .correct-text { display:inline-block; font-family:'Mochiy Pop One',sans-serif; font-size:2.6rem; color:#fff; background: linear-gradient(135deg,#FF6FA5,#B57BFF); padding: 16px 34px; border-radius: 999px; box-shadow: 0 8px 0 #A64FDB, 0 14px 26px rgba(181,123,255,.5); }
  @keyframes bubble-in { 0%{opacity:0; transform:scale(.2) rotate(-12deg);} 55%{opacity:1; transform:scale(1.18) rotate(4deg);} 80%{transform:scale(.95) rotate(-2deg);} 100%{transform:scale(1) rotate(0);} }
  .sparkle { position:absolute; font-size:1.5rem; animation: sparkle-pop .8s ease forwards; opacity:0; }
  .s1 { top:-18px; left:-24px; animation-delay:.15s; }
  .s2 { top:-24px; right:-20px; animation-delay:.28s; }
  .s3 { bottom:-20px; left:-10px; animation-delay:.4s; }
  .s4 { bottom:-22px; right:-16px; animation-delay:.22s; }
  @keyframes sparkle-pop { 0%{opacity:0; transform:scale(0) rotate(0);} 50%{opacity:1; transform:scale(1.3) rotate(20deg);} 100%{opacity:0; transform:scale(.8) rotate(40deg) translateY(-10px);} }
  .confetti-layer { position:absolute; inset:0; overflow:hidden; }
  .confetti-piece { position:absolute; top:-10px; animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards; }
  @keyframes confetti-fall { 0%{ transform: translate(0,0) rotate(0); opacity:1; } 100%{ transform: translate(var(--drift), 340px) rotate(var(--rot)); opacity:0; } }
  .wrong-bubble { position:absolute; top:10px; right:14px; animation: wobble-in .4s ease; z-index:5; }
  .wrong-text { display:inline-block; font-family:'Mochiy Pop One',sans-serif; font-size:1.5rem; color:#fff; background: linear-gradient(135deg,#FF9F5A,#FF6363); padding:10px 22px; border-radius:999px; box-shadow: 0 4px 0 #D94545; }
  @keyframes wobble-in { 0%{opacity:0; transform:scale(.5) rotate(8deg);} 60%{opacity:1; transform:scale(1.1) rotate(-4deg);} 100%{transform:scale(1) rotate(0);} }
  .auto-next-hint { margin-top: 18px; text-align:center; font-size:1.05rem; color: var(--ink-soft); font-weight:700; animation: fade-pulse 1s ease-in-out infinite; }
  @keyframes fade-pulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
  .spin { display:inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .correct-bubble, .confetti-piece, .choice-btn.correct-reveal, .choice-btn.wrong-reveal, .wrong-bubble, .sparkle, .deck-card { animation:none!important; transition:none!important; } }
</style>
</head>

function cityChoices(correct, pool) {
  const others = pool.filter((c) => c !== correct);
  const picked = shuffle(others).slice(0, 3);
  return shuffle([correct, ...picked]);
}

  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---- ストレージ ----
const STORAGE_KEY = "dai1kai-sagyo-note-v5-html";
async function loadHistory() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    if (!res) return {};
    return JSON.parse(res.value);
  } catch {
    return {};
  }
}
async function saveHistory(history) {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(history), false);
  } catch (e) {
    console.error("保存に失敗しました", e);
  }
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ---- 状態 ----
const state = {
  screen: "home", // home | quiz | result
  history: {},
  loadingHistory: true,
  deckKey: null,
  deckImage: null,
  questions: [],
  qIndex: 0,
  selected: null,
  answered: false,
  isCorrect: false,
  wrong: [],
  correctCount: 0,
  reviewMode: false,
};
let autoNextTimer = null;

function currentQuestion() {
  return state.questions[state.qIndex] || null;
}

function startDeck(key, review) {
  const deck = DECKS.find((d) => d.key === key);
  const source = review ? review : deck.data;
  const withShuffledChoices = source.map((q) => Object.assign({}, q, { shuffledChoices: shuffle(q.choices) }));
  state.deckKey = key;
  state.deckImage = deck.image;
  state.questions = withShuffledChoices;
  state.qIndex = 0;
  state.selected = null;
  state.answered = false;
  state.isCorrect = false;
  state.wrong = [];
  state.correctCount = 0;
  state.reviewMode = !!review;
  state.screen = "quiz";
  render();
}

function goHome() {
  if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
  state.screen = "home";
  render();
}

function choose(choiceValue) {
  const current = currentQuestion();
  if (!current || state.answered) return;
  const correct = choiceValue === current.base;
  state.selected = choiceValue;
  state.isCorrect = correct;
  state.answered = true;
  if (correct) state.correctCount += 1;
  else state.wrong.push(current);
  render();
  const delay = correct ? 1300 : 2000;
  if (autoNextTimer) clearTimeout(autoNextTimer);
  autoNextTimer = setTimeout(() => { next(); }, delay);
}

async function next() {
  if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
  if (state.qIndex + 1 < state.questions.length) {
    state.qIndex += 1;
    state.selected = null;
    state.answered = false;
    state.isCorrect = false;
    render();
  } else {
    if (!state.reviewMode) {
      state.history[state.deckKey] = { date: Date.now(), score: state.correctCount, total: state.questions.length };
      await saveHistory(state.history);
    }
    state.screen = "result";
    render();
  }
}

function reviewWrong() {
  startDeck(state.deckKey, state.wrong);
}

// ---- レンダリング ----
function renderHome() {
  let deckList;
  if (state.loadingHistory) {
    deckList = `<div class="row gap2" style="color:var(--ink-soft)"><span class="spin">⏳</span> 読み込み中…</div>`;
  } else {
    deckList = `<div class="col gap3">` + DECKS.map((d, di) => {
      const last = state.history[d.key];
      return `
        <button class="page-card deck-card px6 py4 row gap3" data-action="start-deck" data-key="${esc(d.key)}">
          <div class="icon-badge badge-${di}">${d.icon}</div>
          <div class="flex1">
            <div class="display-font" style="font-size:1.3rem;color:var(--purple)">${esc(d.title)}</div>
            <div style="font-size:1.02rem;color:var(--ink-soft);margin-top:4px">
              全${d.data.length}問${last ? `　前回 ${last.score}/${last.total}` : "　まだ挑戦していません"}
            </div>
          </div>
          <div style="color:var(--pink);font-size:1.6rem">▶</div>
        </button>`;
    }).join("") + `</div>`;
  }

  return `
    <div class="wrap">
      <div class="page-card px6 py7 mb6 center">
        <div style="font-size:2.6rem;margin-bottom:4px">🌸📚🌟</div>
        <h1 class="display-font" style="font-size:1.9rem;color:var(--pink);line-height:1.5">社会 作業ノート<br>チェック</h1>
        <p style="color:var(--ink-soft);margin-top:10px;font-size:1.15rem">
          山地・山脈、半島・島、政令指定都市の4コーナー。<br>こたえをえらぶと、すぐにわかるよ！
        </p>
      </div>
      ${deckList}
    </div>`;
}

function renderQuiz() {
  const current = currentQuestion();
  if (!current) return renderHome();
  const q = state.questions;

  const dots = q.map((qq, i) => {
    const isWrong = state.wrong.some((w) => w.id === qq.id);
    const isDone = i < state.qIndex || (i === state.qIndex && state.answered);
    const cls = ["progress-dot"];
    if (i === state.qIndex) cls.push("current");
    if (isDone) cls.push(isWrong ? "filled-wrong" : "filled-correct");
    return `<div class="${cls.join(" ")}"></div>`;
  }).join("");

  const mapHtml = state.deckImage
    ? `<div class="map-frame"><img src="${state.deckImage}" alt="作業ノートの地図"></div>`
    : "";

  const choicesHtml = current.shuffledChoices.map((c, ci) => {
    let cls = `choice-btn choice-${ci % 4}`;
    if (state.answered) {
      if (c === current.base) cls += " correct-reveal";
      else if (c === state.selected) cls += " wrong-reveal";
      else cls += " dim";
    }
    return `<button class="${cls}" data-action="choose" data-idx="${ci}" ${state.answered ? "disabled" : ""}>${esc(c)}</button>`;
  }).join("");

  const rankBadge = typeof current.rank === "number" ? `<span class="rank-badge">👑 人口 ${current.rank}位</span>` : "";

  let overlay = "";
  if (state.answered && state.isCorrect) {
    overlay = `
      <div class="correct-burst">
        <div class="confetti-layer">${buildConfetti()}</div>
        <div class="correct-bubble">
          <span class="correct-text">せいかい！</span>
          <span class="sparkle s1">✨</span>
          <span class="sparkle s2">⭐</span>
          <span class="sparkle s3">✨</span>
          <span class="sparkle s4">🌟</span>
        </div>
      </div>`;
  } else if (state.answered && !state.isCorrect) {
    overlay = `<div class="wrong-bubble"><span class="wrong-text">おしい！</span></div>`;
  }

  const answerNote = (state.answered && !state.isCorrect)
    ? `<div style="margin-top:18px;font-size:1.2rem;color:var(--ink-soft);background:#FFF3CF;border-radius:14px;padding:12px 16px">🌟 正解は「<b style="color:var(--purple)">${esc(current.base)}</b>」だよ</div>`
    : "";

  const nextHint = state.answered
    ? `<div class="auto-next-hint">${state.qIndex + 1 < q.length ? "つぎの問題へ…" : "けっかを見るよ…"}</div>`
    : "";

  return `
    <div class="wrap">
      <div class="row mb4" style="justify-content:space-between">
        <button class="btn-secondary row gap2" data-action="go-home">⬅ やめる</button>
        <div class="progress-dots">${dots}</div>
      </div>
      ${mapHtml}
      <div class="page-card px6 py8" style="position:relative;min-height:300px">
        <div class="row gap2" style="margin-bottom:10px;flex-wrap:wrap">
          <span style="font-size:1.05rem;color:var(--ink-soft);font-weight:700">第${state.qIndex + 1}問 / 全${q.length}問</span>
          ${rankBadge}
        </div>
        <h3 class="display-font" style="font-size:1.5rem;color:var(--purple);line-height:1.7;margin-bottom:22px">${esc(current.label)}</h3>
        <div class="col gap3">${choicesHtml}</div>
        ${overlay}
        ${answerNote}
        ${nextHint}
      </div>
    </div>`;
}

function buildConfetti() {
  const colors = ["#FF6FA5", "#FFD93D", "#4FC3F7", "#3DDC97", "#B57BFF", "#FF9F5A"];
  let html = "";
  for (let i = 0; i < 26; i++) {
    const left = Math.random() * 100;
    const delay = (Math.random() * 0.25).toFixed(2);
    const duration = (0.9 + Math.random() * 0.6).toFixed(2);
    const color = colors[i % colors.length];
    const rotate = Math.round(Math.random() * 360);
    const size = (6 + Math.random() * 7).toFixed(1);
    const drift = Math.round((Math.random() - 0.5) * 80);
    const shape = i % 3 === 0 ? "50%" : "3px";
    html += `<span class="confetti-piece" style="left:${left}%;animation-delay:${delay}s;animation-duration:${duration}s;background:${color};width:${size}px;height:${size}px;border-radius:${shape};--drift:${drift}px;--rot:${rotate}deg"></span>`;
  }
  return html;
}

function renderResult() {
  const total = state.questions.length;
  const emoji = state.correctCount === total ? "🎉🌟🎉" : state.correctCount / total >= 0.6 ? "🌸✨" : "💪🌱";
  const msg = state.correctCount === total
    ? "ぜんぶ正解！すごい！パーフェクト！"
    : state.correctCount / total >= 0.6
    ? "よくがんばったね！もう少しで満点！"
    : "まちがえた問題を見なおしてみよう！";

  const wrongHtml = state.wrong.length > 0 ? `
    <div class="page-card px6 py5 mb6">
      <h4 class="display-font" style="font-size:1rem;color:var(--purple);margin-bottom:10px">まちがえた問題（${state.wrong.length}問）</h4>
      <div class="col gap3">
        ${state.wrong.map((qq) => `
          <div style="border-left:4px solid #FF9F5A;padding-left:10px">
            <div style="font-size:1.15rem">${esc(qq.label)}</div>
            <div style="font-size:1.05rem;color:var(--mint);font-weight:700">正解：${esc(qq.base)}</div>
          </div>`).join("")}
      </div>
    </div>` : "";

  const reviewBtn = state.wrong.length > 0
    ? `<button class="btn-primary row gap2" data-action="review-wrong">🔄 まちがえた問題だけ復習</button>`
    : "";

  return `
    <div class="wrap">
      <div class="page-card px6 py9 center mb6">
        <div style="font-size:2.4rem;margin-bottom:6px">${emoji}</div>
        <div style="font-size:1.05rem;color:var(--ink-soft);font-weight:700;margin-bottom:6px">けっか</div>
        <div class="display-font" style="font-size:3.2rem;color:var(--pink)">${state.correctCount} / ${total}</div>
        <p style="color:var(--ink-soft);margin-top:10px;font-size:1.2rem">${msg}</p>
      </div>
      ${wrongHtml}
      <div class="row gap3" style="flex-wrap:wrap">
        ${reviewBtn}
        <button class="btn-secondary" data-action="go-home">ホームにもどる</button>
      </div>
    </div>`;
}

function render() {
  const root = document.getElementById("app-root");
  if (state.screen === "home") root.innerHTML = renderHome();
  else if (state.screen === "quiz") root.innerHTML = renderQuiz();
  else root.innerHTML = renderResult();
}

document.getElementById("app-root").addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  if (action === "start-deck") {
    startDeck(el.getAttribute("data-key"));
  } else if (action === "go-home") {
    goHome();
  } else if (action === "choose") {
    const idx = Number(el.getAttribute("data-idx"));
    const current = currentQuestion();
    if (current) choose(current.shuffledChoices[idx]);
  } else if (action === "review-wrong") {
    reviewWrong();
  }
});

(async function init() {
  state.history = await loadHistory();
  state.loadingHistory = false;
  render();
})();
</script>
</body>
</html>
