<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>星と星座クイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one card floating on a canvas night sky; progress shown as a row of stars that light up. Single dark look by choice. */
:root{
  --sky:#0b1330; --sky2:#16224d; --card:#18234a; --line:#2e3d74;
  --ink:#eef1ff; --muted:#a9b3dd; --gold:#ffd66b; --ok:#5fe0a8; --ng:#ff7a8a;
  --red:#ff6b5b; --orange:#ffa34d; --yellow:#ffe066; --white:#f7f8ff; --bluewhite:#a9d4ff;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--sky2),var(--sky) 70%);background-color:var(--sky);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--gold);font-weight:700}
h1{margin:0;font-size:clamp(26px,6vw,34px);font-weight:900;text-wrap:balance;line-height:1.3}
.progress{display:flex;gap:8px;margin-top:4px}
.progress span{font-size:22px;color:var(--line);transition:color .3s,transform .3s}
.progress span.now{color:var(--muted);transform:scale(1.15)}
.progress span.ok{color:var(--gold)}
.progress span.ng{color:#6b77a8}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.qno{font-weight:900;color:var(--gold);font-size:15px;letter-spacing:.08em}
.qtext{margin:0;font-size:20px;font-weight:700;text-wrap:balance;line-height:1.55}
.hint{margin:0;color:var(--muted);font-size:14px}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.03);font-weight:700;font-size:17px;transition:border-color .2s,background .2s,transform .1s}
.opt:hover{border-color:var(--muted)}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px}
.opt.sq .mark{border-radius:7px}
.opt.sel{border-color:var(--gold);background:rgba(255,214,107,.1)}
.opt.sel .mark{background:var(--gold);border-color:var(--gold);color:var(--sky)}
.opt.right{border-color:var(--ok);background:rgba(95,224,168,.12)}
.opt.wrong{border-color:var(--ng);background:rgba(255,122,138,.12)}
.opt.done{cursor:default}
.pair{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.pair small{color:var(--muted);font-weight:500;font-size:14px}
.dot{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{border:2px dashed var(--line);border-radius:12px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;padding:4px}
.slot.fill{border-style:solid;border-color:var(--muted)}
.slot.right{border-color:var(--ok)} .slot.wrong{border-color:var(--ng)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:6.8em 1fr;gap:4px 10px;align-items:center}
.mname{font-weight:700;font-size:16px}
.mslots{display:flex;gap:6px;min-width:0}
.mslot{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 0;min-width:0;min-height:44px;padding:4px 8px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;color:var(--muted);transition:border-color .2s}
.mslot.fill{border-style:solid;border-color:var(--muted);color:var(--ink)}
.mslot.next{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,214,107,.15)}
.mslot.right{border-color:var(--ok);background:rgba(95,224,168,.12)}
.mslot.wrong{border-color:var(--ng);background:rgba(255,122,138,.12)}
.mslot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mfix{grid-column:2;color:var(--ok);font-size:14px;font-weight:700}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:2px solid var(--line);font-weight:700}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip[disabled]{opacity:.25;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:13px 24px;border-radius:999px;background:var(--gold);color:var(--sky);font-weight:900;font-size:17px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.feedback{border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:4px}
.feedback b{font-size:19px}
.feedback.ok b{color:var(--ok)} .feedback.ng b{color:var(--ng)}
.feedback p{margin:0;color:var(--muted);font-size:15px}
.result{text-align:center;align-items:center}
.big{font-size:56px;font-weight:900;color:var(--gold);line-height:1.1}
.big small{font-size:22px;color:var(--muted)}
@media (max-width:420px){.slot{min-height:58px;font-size:11px}.qtext{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="eyebrow">小学4年 理科 ・ 星の明るさや色</div>
    <h1>星と星座クイズ</h1>
    <div class="progress" id="progress" aria-label="すすみぐあい"></div>
  </header>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
const C = {red:'var(--red)',orange:'var(--orange)',yellow:'var(--yellow)',white:'var(--white)',bw:'var(--bluewhite)'};
const Q = [
  {type:'match', q:'それぞれの星座の一等星を、上から順にタップしてならべましょう。', hint:'光っているわくに入るよ。入れた星をタップすると外せるよ。',
   rows:[['はくちょう座',['デネブ']],['わし座',['アルタイル']],['こと座',['ベガ']],['さそり座',['アンタレス']],
         ['おおいぬ座',['シリウス']],['こいぬ座',['プロキオン']],['オリオン座',['リゲル','ベテルギウス']]],
   chips:['シリウス','ベガ','リゲル','アンタレス','デネブ','プロキオン','アルタイル','ベテルギウス'],
   exp:'オリオン座には一等星が2つあります。七夕の「ひこ星」がわし座のアルタイル、「おりひめ星」がこと座のベガだよ。'},
  {type:'one', q:'ベガ、デネブ、アルタイルの3つの一等星でつくられる形を何という？',
   opts:['夏の大三角','冬の大三角','春の大曲線','秋の四辺形'], a:0,
   exp:'夏の夜、頭の上のほうに見える大きな三角形です。'},
  {type:'one', q:'プロキオン、ベテルギウス、シリウスの3つの一等星でつくられる形を何という？',
   opts:['夏の大三角','冬の大三角','冬のダイヤモンド','北斗七星'], a:1,
   exp:'冬の南の空に見える三角形です。オリオン座のベテルギウスが目じるしになります。'},
  {type:'order', q:'星の表面温度が低い順に、星の色をならべましょう。', hint:'温度が低い色から順にタップしてね。',
   items:[['赤',C.red],['だいだい',C.orange],['黄色',C.yellow],['白',C.white],['青白',C.bw]],
   exp:'赤い星がいちばん温度が低く、青白い星がいちばん高いです。ちなみに太陽は黄色い星です。'},
  {type:'one', q:'アンタレスとベテルギウスの色は？', color:true,
   opts:[['赤',C.red],['黄色',C.yellow],['白',C.white],['青白',C.bw]], a:0,
   exp:'どちらも赤い星。表面温度が低い星です。'},
  {type:'one', q:'リゲルの色は？', color:true,
   opts:[['赤',C.red],['だいだい',C.orange],['黄色',C.yellow],['青白',C.bw]], a:3,
   exp:'リゲルは青白い星。同じオリオン座の赤いベテルギウスと色をくらべてみよう。'}
];
// 毎回ちがう順番にする（元の並びのままにはならない）
function shuffle(a){a=a.slice();if(a.length<2)return a;let same=true;
  while(same){for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}same=a.every((v,k)=>v===k)}
  return a}
const idx=n=>Array.from({length:n},(_,k)=>k);
let i=0, score=[], state={};
const card=document.getElementById('card'), prog=document.getElementById('progress');

function drawProgress(){
  prog.innerHTML=Q.map((_,k)=>`<span class="${k<score.length?(score[k]?'ok':'ng'):(k===i?'now':'')}">★</span>`).join('');
}
function esc(s){return s}
function render(){
  drawProgress();
  if(i>=Q.length) return renderResult();
  const q=Q[i]; state={sel:new Set(),order:[],done:false};
  let h=`<div class="qno">問${i+1}</div><p class="qtext">${q.q}</p>`;
  if(q.hint) h+=`<p class="hint">${q.hint}</p>`;
  if(q.type==='match'){
    let n=0;
    h+=`<div class="mlist">`+q.rows.map((r,ri)=>`<div class="mrow" id="r${ri}"><div class="mname">${r[0]}</div><div class="mslots">`+
      r[1].map(()=>`<button class="mslot" id="m${n}" data-s="${n++}">？</button>`).join('')+`</div></div>`).join('')+`</div>`;
    h+=`<div class="chips">`+shuffle(idx(q.chips.length)).map(k=>`<button class="chip" id="c${k}" data-k="${k}">★ ${q.chips[k]}</button>`).join('')+`</div>`;
    h+=`<div class="row"><button class="btn" id="check" disabled>こたえあわせ</button></div>`;
  } else if(q.type==='one'){
    h+=`<div class="opts">`+shuffle(idx(q.opts.length)).map(k=>{const o=q.opts[k];
      const label=q.color?`<span class="dot" style="background:${o[1]};color:${o[1]}"></span>${o[0]}`:`<span class="mark"></span>${o}`;
      return `<button class="opt" id="o${k}" data-k="${k}">${label}</button>`}).join('')+`</div>`;
  } else {
    h+=`<div class="slots" id="slots">`+q.items.map((_,k)=>`<div class="slot" id="s${k}">${k+1}</div>`).join('')+`</div>`;
    h+=`<div class="scale"><span>← 温度が低い</span><span>温度が高い →</span></div>`;
    h+=`<div class="chips">`+shuffle(idx(q.items.length)).map(k=>`<button class="chip" id="c${k}" data-k="${k}"><span class="dot" style="background:${q.items[k][1]};color:${q.items[k][1]}"></span>${q.items[k][0]}</button>`).join('')+`</div>`;
    h+=`<div class="row"><button class="btn ghost" id="undo">ひとつもどす</button><button class="btn" id="check" disabled>こたえあわせ</button></div>`;
  }
  card.innerHTML=h;
  bind(q);
}
function bind(q){
  if(q.type==='match'){
    const total=q.chips.length; state.slots=Array(total).fill(null);
    const owner=[]; q.rows.forEach((r,ri)=>r[1].forEach(()=>owner.push(ri)));
    const upd=()=>{
      const next=state.slots.indexOf(null);
      state.slots.forEach((v,s)=>{const b=document.getElementById('m'+s);
        b.textContent=v===null?'？':q.chips[v];
        b.className='mslot'+(v!==null?' fill':'')+(!state.done&&s===next?' next':'');});
      card.querySelectorAll('.chip').forEach(c=>c.disabled=state.done||state.slots.includes(+c.dataset.k));
      document.getElementById('check').disabled=state.done||next!==-1;
    };
    card.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const s=state.slots.indexOf(null); if(s<0)return; state.slots[s]=+c.dataset.k; upd();});
    card.querySelectorAll('.mslot').forEach(b=>b.onclick=()=>{ if(state.done)return; state.slots[+b.dataset.s]=null; upd();});
    document.getElementById('check').onclick=()=>{ state.done=true; upd();
      let all=true;
      q.rows.forEach((r,ri)=>{
        const got=state.slots.filter((_,s)=>owner[s]===ri).map(v=>q.chips[v]);
        let rowOk=true;
        state.slots.forEach((v,s)=>{ if(owner[s]!==ri)return; const b=document.getElementById('m'+s);
          const hit=r[1].includes(q.chips[v]); b.classList.add(hit?'right':'wrong'); if(!hit)rowOk=false;});
        if(!rowOk){all=false; document.getElementById('r'+ri).insertAdjacentHTML('beforeend',`<div class="mfix">こたえ：${r[1].join('・')}</div>`);}
      });
      card.querySelector('.chips').remove();
      document.getElementById('check').closest('.row').remove();
      finish(all,q.exp,'赤いわくの星座は、下に書いてある星がこたえです。');
    };
    upd();
  } else if(q.type==='one'){
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(state.done)return; state.done=true;
      const k=+b.dataset.k, ok=k===q.a;
      card.querySelectorAll('.opt').forEach(x=>x.classList.add('done'));
      document.getElementById('o'+q.a).classList.add('right');
      if(!ok) b.classList.add('wrong');
      const ans=q.color?q.opts[q.a][0]:q.opts[q.a];
      finish(ok,q.exp,`こたえは「${ans}」です。`);
    });
  } else {
    const upd=()=>{
      q.items.forEach((_,k)=>{const s=document.getElementById('s'+k); const v=state.order[k];
        if(v===undefined){s.className='slot';s.innerHTML=k+1}
        else{s.className='slot fill';s.innerHTML=`<span class="dot" style="background:${q.items[v][1]};color:${q.items[v][1]}"></span>${q.items[v][0]}`}});
      card.querySelectorAll('.chip').forEach(c=>c.disabled=state.done||state.order.includes(+c.dataset.k));
      document.getElementById('check').disabled=state.order.length<q.items.length||state.done;
      document.getElementById('undo').disabled=!state.order.length||state.done;
    };
    card.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.order.push(+c.dataset.k);upd()});
    document.getElementById('undo').onclick=()=>{state.order.pop();upd()};
    document.getElementById('check').onclick=()=>{ state.done=true; upd();
      let ok=true; state.order.forEach((v,k)=>{const s=document.getElementById('s'+k); if(v===k)s.classList.add('right'); else{s.classList.add('wrong');ok=false}});
      document.getElementById('check').closest('.row').remove();
      card.querySelector('.chips').remove();
      finish(ok,q.exp,'正しい順は「赤 → だいだい → 黄色 → 白 → 青白」です。');
    };
    upd();
  }
}
function finish(ok,exp,ans){
  score.push(ok); drawProgress();
  const last=i===Q.length-1;
  card.insertAdjacentHTML('beforeend',`<div class="feedback ${ok?'ok':'ng'}"><b>${ok?'せいかい！':'ざんねん…'}</b>${ok?'':`<p>${ans}</p>`}<p>${exp}</p></div>
  <div class="row"><button class="btn" id="next">${last?'けっかを見る':'つぎの問題へ'}</button></div>`);
  const n=document.getElementById('next'); n.focus({preventScroll:true}); n.onclick=()=>{i++;render();window.scrollTo({top:0,behavior:'smooth'})};
}
function renderResult(){
  const n=score.filter(Boolean).length;
  const msg=n===Q.length?'全問せいかい！星の博士だね。':n>=4?'よくできました！まちがえた問題をもう一度見てみよう。':'もう一度ちょうせんしてみよう！';
  card.className='card result';
  card.innerHTML=`<div class="qno">けっか</div><div class="big">${n}<small> / ${Q.length}問</small></div><p class="qtext">${msg}</p>
  <div class="row"><button class="btn" id="again">もう一度やる</button></div>`;
  document.getElementById('again').onclick=()=>{i=0;score=[];card.className='card';render()};
}
render();

// starfield
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let pts=[];
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
  pts=Array.from({length:Math.round(innerWidth*innerHeight/5000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.3,p:Math.random()*6.28,
    c:['#ffffff','#ffffff','#cfe3ff','#ffe9b0','#ffc2a8'][Math.random()*5|0]}))}
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(t){cx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of pts){cx.globalAlpha=.45+.45*Math.sin(s.p+t/900);cx.fillStyle=s.c;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.29);cx.fill()}
  if(!still)requestAnimationFrame(draw)}
addEventListener('resize',size);size();requestAnimationFrame(draw);
</script>

</body></html>
