<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>ことわざ問題集</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 塾の教室の机の上。まじめで明るく、子どもが毎日開きたくなる問題集
   IDEA: 単語カード＋赤シート。答えを赤シートで隠して覚え、カードをめくって確かめる
   PICTURE: 藍色の机に重なった単語カード。一番上が「今日のことわざ」で、タップでめくれる
   COLOUR and TYPE: 藍 #1d3461 の地、白いカード、朱 #e5432d（赤シート・花丸）。しっぽり明朝＋Zen角ゴシック
   LAYOUT: 古いタブレットでも崩れないよう、flex と margin だけで組む（grid・gap・clamp・light-dark は使わない） */
:root{--bg:#f4f6fa;--paper:#fff;--ink:#18202f;--sub:#566079;--ai:#1d3461;--ai2:#2b4a85;--btn:#1d3461;--btnink:#fff;--shu:#e5432d;--shu-soft:#fde7e3;--ok:#1f7a4c;--ok-soft:#e2f4ea;--line:#dfe3ec}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1626;--paper:#18223a;--ink:#e9edf5;--sub:#a7b1c7;--ai2:#8fb0ef;--btn:#8fb0ef;--btnink:#0f1626;--shu-soft:#4a1f1a;--ok:#5fd39a;--ok-soft:#173a2a;--line:#2a3654}}
:root[data-theme=dark]{--bg:#0f1626;--paper:#18223a;--ink:#e9edf5;--sub:#a7b1c7;--ai2:#8fb0ef;--btn:#8fb0ef;--btnink:#0f1626;--shu-soft:#4a1f1a;--ok:#5fd39a;--ok-soft:#173a2a;--line:#2a3654}
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f4f6fa;background:var(--bg);color:#18202f;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;-webkit-tap-highlight-color:transparent}
.mincho{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif}
.band{padding:40px 5%}
.wrap{max-width:1100px;margin:0 auto}
.row{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.grow{-webkit-box-flex:1;-webkit-flex:1 1 0%;flex:1 1 0%}
header.top{background:#1d3461;color:#fff;position:relative;overflow:hidden}
header.top:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.10),transparent 45%);pointer-events:none}
.nav{position:relative}
.nav>*{margin:4px 12px 4px 0}
.nav h1{margin-right:14px;font-size:36px;line-height:1.1;letter-spacing:.04em}
.nav .count{font-size:14px;opacity:.8}
.pill{border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:9px 16px;min-height:44px}
.hero{position:relative;margin-top:24px;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.hero>.col{width:50%;padding-right:24px}
.hero>.col+.col{padding-right:0;padding-left:24px}
.deck{position:relative;height:300px;-webkit-perspective:1200px;perspective:1200px}
.deck .under{position:absolute;top:14px;left:10px;right:-10px;bottom:-14px;background:#e9ecf3;border-radius:18px;-webkit-transform:rotate(3deg);transform:rotate(3deg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.deck .under.b{top:26px;left:18px;right:-18px;bottom:-24px;-webkit-transform:rotate(6deg);transform:rotate(6deg);background:#d6dbe7}
.card{position:relative;display:block;height:300px;width:100%;border:0;background:none;padding:0;text-align:left;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-transition:-webkit-transform .6s;transition:transform .6s}
.card.flip{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.face{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#fff;color:#18202f;border-radius:18px;border-top:10px solid #e5432d;padding:22px 28px;box-shadow:0 14px 34px rgba(0,0,0,.28);overflow:hidden}
.face .hole{position:absolute;top:16px;right:20px;width:22px;height:22px;border-radius:50%;background:#1d3461}
.face.back{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.face small{display:block;color:#566079;font-size:14px}
.face .big{font-size:34px;line-height:1.3;margin:52px 0 10px}
.face .yomi{color:#566079;font-size:15px}
.face .mean{font-size:19px;line-height:1.7;margin:36px 0 14px}
.hint{font-size:14px;color:rgba(255,255,255,.75);margin:34px 0 0}
.modes h2{margin:0 0 10px;font-size:20px}
.mode{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;width:100%;margin-bottom:10px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:11px 16px;text-align:left;min-height:62px}
.mode:active{background:rgba(255,255,255,.2)}
.mode .txt{-webkit-box-flex:1;-webkit-flex:1 1 0%;flex:1 1 0%;margin:0 12px}
.mode b{display:block;font-size:17px}
.mode .txt span{font-size:13.5px;opacity:.8}
.mode i{font-style:normal;-webkit-flex-shrink:0;flex-shrink:0;width:40px;height:40px;line-height:40px;text-align:center;border-radius:10px;background:#fff;color:#1d3461;font-weight:800;font-family:"Shippori Mincho B1",serif;font-size:20px}
.mode.weak i{background:#e5432d;color:#fff}
.mode em{font-style:normal;font-size:13px;opacity:.75;white-space:nowrap}
.settings{-webkit-box-align:start;-webkit-align-items:flex-start;align-items:flex-start;margin:0 -12px}
.settings>div{-webkit-box-flex:1;-webkit-flex:1 1 260px;flex:1 1 260px;padding:0 12px 18px}
.settings h3{margin:0 0 10px;font-size:17px}
.chip{border:1.5px solid #dfe3ec;border-color:var(--line);background:#fff;background:var(--paper);border-radius:999px;padding:8px 15px;min-height:44px;font-size:15px;margin:0 8px 8px 0}
.chip[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.stat{margin:0 28px 8px 0}
.stat b{display:block;font-size:30px;line-height:1.1;font-family:"Shippori Mincho B1",serif}
.stat span{font-size:14px;color:var(--sub)}
.note{font-size:13.5px;color:var(--sub);margin-top:14px}
.view{display:none}.view.on{display:block}
.qhead{margin-bottom:16px}
.qhead>*{margin:4px 10px 4px 0}
.back{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;min-height:44px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:100px}
.bar>div{height:100%;background:#e5432d;-webkit-transition:width .3s;transition:width .3s}
.qno{font-size:15px;color:var(--sub);white-space:nowrap}
.qcard{background:#fff;background:var(--paper);border-radius:20px;padding:30px;box-shadow:0 6px 24px rgba(20,30,60,.08);border-top:10px solid #1d3461;max-width:820px;margin:0 auto;position:relative}
.qtype{font-size:14px;color:var(--ai2);font-weight:700;margin:0 0 10px}
.qtext{font-size:32px;line-height:1.35;margin:0 0 6px;word-wrap:break-word}
.qtext.long{font-size:21px;line-height:1.6;font-family:inherit;font-weight:500}
.qsub{color:var(--sub);font-size:15px;margin:0 0 18px}
.blank{display:inline-block;min-width:2.4em;border-bottom:3px solid #e5432d;color:transparent;margin:0 .1em}
.blank.fill{color:#e5432d}
.opt{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;width:100%;margin-top:10px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 16px;min-height:56px;font-size:17px}
.opt .n{-webkit-flex-shrink:0;flex-shrink:0;width:30px;height:30px;line-height:27px;text-align:center;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);font-size:14px;font-weight:700;margin-right:14px}
.opt .l{-webkit-box-flex:1;-webkit-flex:1 1 0%;flex:1 1 0%}
.opt.k{font-family:"Shippori Mincho B1",serif;font-size:19px;font-weight:600}
.opt.right{border-color:#1f7a4c;border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{background:#1f7a4c;color:#fff;border-color:#1f7a4c}
.opt.wrong{border-color:#e5432d;background:var(--shu-soft)}
.opt.wrong .n{background:#e5432d;color:#fff;border-color:#e5432d}
.opt[disabled]{cursor:default;color:inherit;opacity:1}
.fb{margin-top:18px;border-radius:14px;padding:16px 18px;display:none;position:relative}
.fb.on{display:block}
.fb.ok{background:var(--ok-soft)}.fb.ng{background:var(--shu-soft)}
.fb .v{font-weight:700;font-size:18px;margin:0 0 6px}
.fb.ok .v{color:var(--ok)}.fb.ng .v{color:#e5432d}
.fb .ex{margin:6px 0 0}
.fb .exk{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:19px}
.fb .exy{color:var(--sub);font-size:14px;margin-left:.5em}
.maru{position:absolute;right:14px;top:-26px;width:74px;height:74px;pointer-events:none}
.qnav{margin-top:16px}
.prev{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 18px;min-height:52px;font-weight:700;margin-right:10px}
.prev[disabled]{opacity:.35;cursor:default}
.next{position:relative;overflow:hidden;background:var(--btn);color:var(--btnink);border:0;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:700;min-height:52px;visibility:hidden}
.next.on{visibility:visible}
.next .t{position:relative}
.next .cd{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22)}
.next.auto .cd{-webkit-animation:cd 2.5s linear forwards;animation:cd 2.5s linear forwards}
@-webkit-keyframes cd{from{width:0}to{width:100%}}
@keyframes cd{from{width:0}to{width:100%}}
.score{text-align:center}
.score .big{font-size:72px;line-height:1;color:#e5432d;margin:8px 0}
.score p{margin:6px 0 0;color:var(--sub)}
.btnrow{-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;margin-top:18px}
.btn{border:0;background:var(--btn);color:var(--btnink);border-radius:12px;padding:12px 22px;min-height:48px;font-weight:700;margin:4px}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.miss{max-width:820px;margin:26px auto 0}
.tools>*{margin:0 10px 10px 0}
.search{-webkit-box-flex:1;-webkit-flex:1 1 240px;flex:1 1 240px;font-family:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-height:44px;-webkit-appearance:none}
.search:focus{outline:3px solid #e5432d;outline-offset:2px}
button:focus{outline:3px solid #e5432d;outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
.sheet{border:2px solid #e5432d;color:#e5432d;background:var(--paper);border-radius:999px;padding:8px 18px;min-height:44px;font-weight:700}
.sheet[aria-pressed=true]{background:#e5432d;color:#fff}
.item{background:var(--paper);border-radius:12px;padding:12px 16px;margin-bottom:8px;border-left:5px solid var(--line)}
.item.w{border-left-color:#e5432d}
.item .ik{width:15em;-webkit-flex-shrink:0;flex-shrink:0;padding-right:16px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:18px;line-height:1.35}
.item .iy{display:block;font-family:inherit;font-weight:400;font-size:12.5px;color:var(--sub)}
.item .im{-webkit-box-flex:1;-webkit-flex:1 1 0%;flex:1 1 0%;font-size:15px;border-radius:6px;padding:2px 6px}
.hide .item .im{background:#e5432d;color:#e5432d;cursor:pointer}
.hide .item .im.show{background:transparent;color:inherit}
.tag{font-size:12.5px;color:var(--sub);white-space:nowrap;padding-left:12px}
.empty{color:var(--sub);padding:30px;text-align:center}
@media (min-width:900px){.band{padding:56px 5%}.nav h1{font-size:44px}.qcard{padding:40px}.qtext{font-size:36px}}
@media (max-width:760px){.hero>.col,.hero>.col+.col{width:100%;padding:0}.hero>.col+.col{margin-top:40px}.deck,.card{height:260px}.face .big{font-size:28px;margin-top:40px}}
@media (max-width:600px){.band{padding:24px 16px}.nav h1{font-size:28px}.qcard{padding:22px 18px}.qtext{font-size:25px}.qtext.long{font-size:19px}.item .ik{width:100%;padding:0 0 4px}.tag{padding:4px 0 0}.score .big{font-size:56px}}
@media (prefers-reduced-motion:reduce){.card{-webkit-transition:none;transition:none}}
</style>
</head>
<body>
<header class="top band">
  <div class="wrap">
    <div class="nav row">
      <h1 class="mincho">ことわざ問題集</h1>
      <span class="count" id="total"></span>
      <span class="grow"></span>
      <button class="pill" id="goHome" type="button">トップ</button>
      <button class="pill" id="goList" type="button">ことわざ一覧</button>
    </div>
    <div class="hero row" id="heroArea">
      <div class="col">
        <div class="deck">
          <div class="under b"></div><div class="under"></div>
          <button class="card" id="today" type="button" aria-label="今日のことわざ。押すと意味が見られます">
            <div class="face front"><span class="hole"></span><small>今日のことわざ</small><div class="big mincho" id="tdK"></div><div class="yomi" id="tdY"></div></div>
            <div class="face back"><span class="hole"></span><small>意味</small><div class="mean" id="tdM"></div><div class="yomi">もう一度押すと表にもどります</div></div>
          </button>
        </div>
        <p class="hint">カードを押すと裏返って意味が見られます。</p>
      </div>
      <div class="col modes">
        <h2>問題の種類をえらぶ</h2>
        <button class="mode" type="button" data-mode="imi"><i>意</i><span class="txt"><b>意味をえらぶ</b><span>ことわざを見て、正しい意味を4つから</span></span><em>基本</em></button>
        <button class="mode" type="button" data-mode="kotowaza"><i>言</i><span class="txt"><b>ことわざをえらぶ</b><span>意味を見て、あてはまることわざを4つから</span></span><em>基本</em></button>
        <button class="mode" type="button" data-mode="ana"><i>□</i><span class="txt"><b>穴うめ</b><span>（　）に入る言葉をえらぶ。動物・数・体がよく出る</span></span><em>頻出</em></button>
        <button class="mode" type="button" data-mode="nita"><i>似</i><span class="txt"><b>似た意味のことわざ</b><span>同じような意味のものをえらぶ</span></span><em>応用</em></button>
        <button class="mode" type="button" data-mode="hantai"><i>反</i><span class="txt"><b>反対の意味のことわざ</b><span>意味が反対になるものをえらぶ</span></span><em>応用</em></button>
        <button class="mode weak" type="button" data-mode="weak"><i>復</i><span class="txt"><b>苦手を復習</b><span id="weakDesc">まちがえた問題がここにたまります</span></span><em id="weakN"></em></button>
      </div>
    </div>
  </div>
</header>

<main>
<section class="view on band" id="vHome">
  <div class="wrap settings row">
    <div><h3>出題数</h3><div class="row" id="numChips"></div></div>
    <div><h3>しぼりこみ（キーワードの種類）</h3><div class="row" id="catChips"></div></div>
    <div><h3>これまでの記録</h3><div class="row" id="stats"></div></div>
  </div>
  <p class="wrap note">中学入試の国語でよく出ることわざを集めています（ことわざとして出題される故事成語の一部をふくみます）。答えると2.5秒で次の問題に進みます。記録はこのブラウザの中だけに保存されます。</p>
</section>

<section class="view band" id="vQuiz">
  <div class="wrap">
    <div class="qhead row"><button class="back" id="quit" type="button">← やめる</button><div class="bar grow"><div id="prog"></div></div><span class="qno" id="qno"></span></div>
    <div class="qcard">
      <p class="qtype" id="qtype"></p>
      <p class="qtext mincho" id="qtext"></p>
      <p class="qsub" id="qsub"></p>
      <div id="opts"></div>
      <div class="fb" id="fb"></div>
      <div class="qnav row">
        <button class="prev" id="prev" type="button">← 前の問題</button>
        <button class="next grow" id="next" type="button"><span class="cd"></span><span class="t" id="nextT">次の問題へ →</span></button>
      </div>
    </div>
  </div>
</section>

<section class="view band" id="vResult">
  <div class="wrap">
    <div class="qcard score">
      <p class="qtype" id="rType"></p>
      <div class="big mincho" id="rScore"></div>
      <p id="rMsg"></p>
      <div class="btnrow row"><button class="btn" id="again" type="button">もう一度</button><button class="btn ghost" id="retryMiss" type="button">まちがえた問題だけ</button><button class="btn ghost" id="toHome" type="button">トップへ</button></div>
    </div>
    <div class="miss" id="missList"></div>
  </div>
</section>

<section class="view band" id="vList">
  <div class="wrap" id="listWrap">
    <div class="tools row">
      <input class="search" id="q" type="search" placeholder="ことわざ・よみ・意味でさがす" aria-label="検索">
      <button class="sheet" id="sheet" type="button" aria-pressed="false">赤シート</button>
    </div>
    <div class="row" id="listCats" style="margin-bottom:8px"></div>
    <p class="note" id="listInfo" style="margin:0 0 10px"></p>
    <div id="list"></div>
  </div>
</section>
</main>

<script>

function renderHome(){
  var rate=rec.q?Math.round(rec.c/rec.q*100):0,wn=keys(weak).length;
  $("#stats").innerHTML='<div class="stat"><b>'+rec.q+'</b><span>といた問題数</span></div><div class="stat"><b>'+rate+'<small style="font-size:16px">%</small></b><span>正答率</span></div><div class="stat"><b>'+keys(seen).length+'<small style="font-size:16px">/'+D.length+'</small></b><span>出会ったことわざ</span></div>';
  $("#weakN").textContent=wn?wn+"こ":"";
  $("#weakDesc").textContent=wn?"まちがえたことわざを、意味をえらぶ問題でもう一度":"まちがえた問題がここにたまります";
}
function show(id){
  stopTimer();
  $$(".view").forEach(function(v){v.classList.toggle("on",v.id===id);});
  $("#heroArea").style.display=id==="vHome"?"":"none";
  if(id==="vHome")renderHome();
  window.scrollTo(0,0);
}

// ---- 問題づくり
function inCat(d){return cat==="すべて"||d.t===cat;}
function pickOthers(pool,n,bad){var o=[],s=shuffle(pool);for(var i=0;i<s.length&&o.length<n;i++)if(!bad(s[i]))o.push(s[i]);return o;}
function isOpp(a,b){return !!opp[a.k]&&opp[a.k].indexOf(b.k)!==-1;}
function related(a,d){return a===d||(a.g&&a.g===d.g)||a.m===d.m||isOpp(a,d);}
function optsFrom(list,ans,field){return map(shuffle(list),function(x){return{label:x[field],ok:x===ans};});}
function build(mode,d){
  var o,ans;
  if(mode==="imi"||mode==="weak"){
    o=pickOthers(D,3,function(x){return related(d,x);});
    return{type:"このことわざの意味は？",text:d.k,sub:d.r,opts:optsFrom([d].concat(o),d,"m"),kind:"m",d:d};
  }
  if(mode==="kotowaza"){
    o=pickOthers(D,3,function(x){return related(d,x);});
    return{type:"この意味のことわざは？",text:d.m,long:true,sub:"",opts:optsFrom([d].concat(o),d,"k"),kind:"k",d:d};
  }
  if(mode==="ana"){
    var words=uniq(map(filter(D,function(x){return x.t===d.t&&x.b!==d.b;}),function(x){return x.b;}));
    words=filter(words,function(w){return !has(d.k,w)&&!has(w,d.b);});
    var ws=shuffle(words).slice(0,3);
    if(ws.length<3){
      var all=filter(uniq(map(D,function(x){return x.b;})),function(w){return w!==d.b&&ws.indexOf(w)===-1&&!has(d.k,w);});
      ws=ws.concat(shuffle(all).slice(0,3-ws.length));
    }
    var parts=map(d.k.split(d.b),esc);
    return{type:"（　）に入る言葉は？",html:parts.join('<span class="blank">'+esc(d.b)+'</span>'),sub:"ヒント："+d.m,
      opts:map(shuffle([d.b].concat(ws)),function(w){return{label:w,ok:w===d.b};}),kind:"w",d:d};
  }
  if(mode==="nita"){
    ans=shuffle(filter(D,function(x){return x!==d&&x.g===d.g;}))[0];
    o=pickOthers(D,3,function(x){return x===d||related(d,x)||related(ans,x);});
    return{type:"似た意味のことわざは？",text:d.k,sub:d.m,opts:optsFrom([ans].concat(o),ans,"k"),kind:"k",d:d,ans:ans};
  }
  if(mode==="hantai"){
    ans=byK[shuffle(opp[d.k])[0]];
    o=pickOthers(D,3,function(x){return x===d||x===ans||isOpp(d,x)||(d.g&&x.g===d.g)||(ans.g&&x.g===ans.g);});
    return{type:"反対の意味のことわざは？",text:d.k,sub:d.m,opts:optsFrom([ans].concat(o),ans,"k"),kind:"k",d:d,ans:ans};
  }
}
function poolFor(mode){
  var p;
  if(mode==="weak")p=filter(D,function(d){return weak[d.k];});
  else if(mode==="nita")p=filter(D,function(d){return !!d.g;});
  else if(mode==="hantai")p=filter(D,function(d){return !!opp[d.k];});
  else p=D;
  if(mode!=="weak"){var c=filter(p,inCat);if(c.length>=4)p=c;}
  return p;
}

// ---- 出題
var Q=null,timer=null;
function stopTimer(){if(timer){clearTimeout(timer);timer=null;}var n=$("#next");if(n)n.classList.remove("auto");}
function start(mode,list){
  var pool=list||poolFor(mode);
  if(!pool.length){$("#weakDesc").textContent="苦手なことわざはまだありません。まずは問題をといてみよう。";return;}
  pool=shuffle(pool);
  var n=num==="全部"?pool.length:Math.min(parseInt(num,10),pool.length);
  Q={mode:mode,items:pool.slice(0,n),i:0,score:0,miss:[],hist:[]};
  show("vQuiz");render();
}
function render(){
  stopTimer();
  var h=Q.hist[Q.i];
  if(!h){h={q:build(Q.mode,Q.items[Q.i]),chosen:-1};Q.hist[Q.i]=h;}
  var q=h.q;
  $("#qno").textContent=(Q.i+1)+" / "+Q.items.length;
  $("#prog").style.width=(Q.i/Q.items.length*100)+"%";
  $("#qtype").textContent=MODE[Q.mode]+"　"+q.type;
  var qt=$("#qtext");qt.className="qtext"+(q.long?" long":" mincho");
  if(q.html)qt.innerHTML=q.html;else qt.textContent=q.text;
  $("#qsub").textContent=q.sub;
  $("#opts").innerHTML=map(q.opts,function(o,i){return '<button type="button" class="opt'+(q.kind==="m"?"":" k")+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="l">'+esc(o.label)+'</span></button>';}).join("");
  $("#fb").className="fb";$("#fb").innerHTML="";
  $("#next").className="next grow";
  $("#prev").disabled=Q.i===0;
  if(h.chosen>=0)reveal(h,false);
  window.scrollTo(0,0);
}
function answer(idx){
  var h=Q.hist[Q.i];if(!h||h.chosen>=0)return;
  h.chosen=idx;
  var q=h.q,d=q.d,ok=q.opts[idx].ok;
  rec.q++;seen[d.k]=1;
  if(ok){Q.score++;rec.c++;if(Q.mode==="weak")delete weak[d.k];}
  else{Q.miss.push(d);weak[d.k]=1;}
  save();
  reveal(h,true);
}
function reveal(h,auto){
  var q=h.q,idx=h.chosen,ok=q.opts[idx].ok,d=q.d;
  $$(".opt").forEach(function(b,j){b.disabled=true;if(q.opts[j].ok)b.classList.add("right");else if(j===idx)b.classList.add("wrong");});
  var bl=document.querySelector(".blank");if(bl)bl.classList.add("fill");
  var ex='<p class="ex"><span class="exk">'+esc(d.k)+'</span><span class="exy">'+esc(d.r)+'</span><br>'+esc(d.m)+'</p>';
  if(q.ans)ex+='<p class="ex"><span class="exk">'+esc(q.ans.k)+'</span><span class="exy">'+esc(q.ans.r)+'</span><br>'+esc(q.ans.m)+'</p>';
  var maru=ok?'<svg class="maru" viewBox="0 0 80 80" aria-hidden="true"><path d="M40 8c18 0 31 12 31 30S57 71 38 71 8 58 9 40 22 9 44 10" fill="none" stroke="#e5432d" stroke-width="5" stroke-linecap="round"/><path d="M40 22c10 0 17 7 17 16s-8 17-18 17-16-8-15-17 9-16 20-15" fill="none" stroke="#e5432d" stroke-width="4" stroke-linecap="round"/></svg>':"";
  var fb=$("#fb");fb.className="fb on "+(ok?"ok":"ng");
  fb.innerHTML=maru+'<p class="v">'+(ok?"せいかい！":"ざんねん… 正しい答えを確かめよう")+'</p>'+ex;
  var last=Q.i+1>=Q.items.length,nx=$("#next");
  nx.className="next grow on";
  if(auto){
    $("#nextT").textContent=last?"まもなく結果へ（押すとすぐ進む）":"まもなく次へ（押すとすぐ進む）";
    void nx.offsetWidth;nx.classList.add("auto");
    timer=setTimeout(function(){timer=null;goNext();},AUTO_MS);
  }else{
    $("#nextT").textContent=last?"結果を見る →":"次の問題へ →";
  }
}
function goNext(){
  stopTimer();
  var h=Q.hist[Q.i];if(!h||h.chosen<0)return;
  Q.i++;
  if(Q.i<Q.items.length)render();else result();
}
function goPrev(){stopTimer();if(Q.i>0){Q.i--;render();}}
function result(){
  $("#prog").style.width="100%";
  var n=Q.items.length,s=Q.score,p=Math.round(s/n*100);
  $("#rType").textContent=MODE[Q.mode];
  $("#rScore").textContent=s+" / "+n;
  $("#rMsg").textContent=p===100?"全問正解！すばらしい。":p>=80?"正答率"+p+"%。あと少しで満点！":p>=50?"正答率"+p+"%。まちがえたものを見直そう。":"正答率"+p+"%。一覧で意味を確かめてから、もう一度ちょうせんしよう。";
  $("#retryMiss").style.display=Q.miss.length?"":"none";
  $("#missList").innerHTML=Q.miss.length?'<h3>まちがえたことわざ</h3>'+map(Q.miss,itemHTML).join(""):"";
  show("vResult");
}
function itemHTML(d){var w=!!weak[d.k];return '<div class="item row'+(w?" w":"")+'"><div class="ik">'+esc(d.k)+'<span class="iy">'+esc(d.r)+'</span></div><div class="im">'+esc(d.m)+'</div><span class="tag">'+esc(d.t)+(w?"・苦手":"")+'</span></div>';}

// ---- 一覧
var lcat="すべて";
chips($("#listCats"),CATS.concat(["苦手"]),lcat,function(v){lcat=v;renderList();});
function renderList(){
  var q=$("#q").value.replace(/^\s+|\s+$/g,"");
  var r=filter(D,function(d){return (lcat==="すべて"||(lcat==="苦手"?weak[d.k]:d.t===lcat))&&(!q||has(d.k,q)||has(d.r,q)||has(d.m,q));});
  var hidden=$("#listWrap").classList.contains("hide");
  $("#listInfo").textContent=r.length+"こ表示中"+(hidden?"・赤い部分を押すと意味が見えます":"");
  $("#list").innerHTML=r.length?map(r,itemHTML).join(""):'<div class="empty">見つかりませんでした。</div>';
}
on($("#q"),"input",renderList);
on($("#q"),"keyup",renderList);
on($("#sheet"),"click",function(){var w=$("#listWrap");w.classList.toggle("hide");setP($("#sheet"),w.classList.contains("hide"));renderList();});
on($("#list"),"click",function(e){var m=up(e.target,"im");if(m)m.classList.toggle("show");});

// ---- 操作
$$(".mode").forEach(function(b){on(b,"click",function(){start(b.getAttribute("data-mode"));});});
on($("#opts"),"click",function(e){var b=up(e.target,"opt");if(b&&!b.disabled)answer(parseInt(b.getAttribute("data-i"),10));});
on($("#next"),"click",goNext);
on($("#prev"),"click",goPrev);
on($("#quit"),"click",function(){show("vHome");});
on($("#again"),"click",function(){start(Q.mode);});
on($("#retryMiss"),"click",function(){start(Q.mode,Q.miss.slice());});
on($("#toHome"),"click",function(){show("vHome");});
on($("#goHome"),"click",function(){show("vHome");});
on($("#goList"),"click",function(){show("vList");renderList();});
on(document,"keydown",function(e){
  if(!$("#vQuiz").classList.contains("on")||!Q)return;
  var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="BUTTON"&&(e.keyCode===13||e.keyCode===32))return;
  var k=e.keyCode,h=Q.hist[Q.i];
  if(k>=49&&k<=52&&h&&h.chosen<0)answer(k-49);
  else if((k===13||k===39)&&h&&h.chosen>=0){e.preventDefault();goNext();}
  else if(k===37){e.preventDefault();goPrev();}
});
renderHome();
})();
</script>
</body>
